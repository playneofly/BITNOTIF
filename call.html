<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#10141A" />
<title>T کال — تماس صوتی و تصویری</title>
<link rel="manifest" href="/call-manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="T کال" />
<link rel="apple-touch-icon" href="/assets/icon-192.png" />
<link rel="icon" type="image/png" href="/assets/icon-192.png" />
<style>
  @font-face { font-family: "Vazirmatn"; src: url("/assets/Vazirmatn-T33.woff2") format("woff2"); font-display: swap; }
  :root {
    --bg:#10141A; --bg2:#151A21; --panel:#1A2029; --panel2:#202834;
    --line:#28303D; --line2:#20262F;
    --text:#D9E0EA; --sub:#8C99AB; --dim:#5F6C7F;
    --acc:#4C8DFF; --acc2:#2E6BD8; --green:#43C97B; --red:#E0696E; --gold:#D8A94E;
    --mono: "SF Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif; font-size: 13px;
    display: flex; align-items: center; justify-content: center; padding: 12px;
  }
  [hidden] { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  .shell { width: 100%; max-width: 440px; height: 100%; max-height: 800px; display: flex; flex-direction: column; position: relative; }

  /* ===== ورود ===== */
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 26px 22px; display: flex; flex-direction: column; gap: 12px; align-items: center; margin: auto; width: 100%; max-width: 340px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .mark {
    width: 42px; height: 42px; border-radius: 10px; flex: none; color: #fff; font-size: 19px;
    background: linear-gradient(150deg, var(--acc), var(--acc2));
    display: flex; align-items: center; justify-content: center;
  }
  .logo b { font-size: 17px; font-weight: 800; }
  .logo b small { display: block; font-size: 10.5px; color: var(--sub); font-weight: 500; }
  .field {
    width: 100%; height: 40px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg2); color: var(--text); padding: 4px 12px; font-size: 13.5px; font-family: inherit; outline: none;
  }
  .field:focus { border-color: var(--acc); }
  .btn {
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    border-radius: 7px; height: 40px; padding: 0 16px; font-size: 13px; font-weight: 700;
  }
  .btn.primary { background: var(--acc2); border-color: var(--acc2); color: #fff; }
  .msg { font-size: 12px; color: var(--red); min-height: 15px; font-weight: 600; }
  .hintlink { font-size: 11.5px; color: var(--sub); }
  .hintlink a { color: var(--acc); text-decoration: none; font-weight: 700; }

  /* ===== هدر ===== */
  .topbar {
    display: flex; align-items: center; gap: 9px; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  .topbar .tt { flex: 1; min-width: 0; }
  .topbar .tt b { font-size: 14.5px; display: block; }
  .topbar .tt span { font-size: 9px; color: var(--dim); font-family: var(--mono); }
  .mynum {
    font-family: var(--mono); font-size: 11.5px; color: var(--acc); direction: ltr;
    background: rgba(76,141,255,.1); border: 1px solid rgba(76,141,255,.3);
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }

  .view { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-top: 10px; }

  /* کیپد */
  .numdisp {
    height: 58px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px;
  }
  .numdisp b { font-family: var(--mono); font-size: 24px; letter-spacing: 2px; direction: ltr; color: var(--text); }
  .numdisp b.empty { color: var(--dim); font-size: 13px; letter-spacing: 0; }
  .numdisp .clr { border: 0; background: none; color: var(--dim); font-size: 18px; }
  .keypad { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 16px 6px; align-content: center; direction: ltr; }
  .key.zero { grid-column: 2; }
  .key {
    border: 1px solid var(--line2); background: var(--panel); border-radius: 14px;
    height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: var(--text); font-size: 21px; font-weight: 700; font-family: var(--mono);
    transition: background .1s, transform .06s;
  }
  .key:active { transform: scale(.94); background: var(--panel2); }
  .dialrow { display: flex; gap: 10px; padding: 0 6px 10px; }
  .callbtn {
    flex: 1; height: 52px; border: 0; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .callbtn.audio { background: linear-gradient(135deg, #3FCE84, #22A05C); }
  .callbtn.video { background: linear-gradient(135deg, #5C9BFF, var(--acc2)); }
  .callbtn:active { transform: scale(.98); }
  .callbtn:disabled { opacity: .35; }

  /* مخاطبین (تب) */
  .contact { border-bottom: 1px solid var(--line2); padding: 11px 13px; cursor: pointer; }
  .contact:hover { background: rgba(76,141,255,.05); }
  .contact .crow { display: flex; align-items: center; gap: 10px; }
  .contact .cnm { font-size: 13px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .contact .cnum2 { display: block; font-size: 10px; color: var(--dim); font-family: var(--mono); direction: ltr; text-align: right; margin-top: 2px; }
  .copts { display: flex; gap: 8px; margin-top: 10px; }
  .copts button { flex: 1; border: 0; border-radius: 8px; height: 38px; font-size: 12px; font-weight: 800; color: #fff; }
  .copts .cv { background: linear-gradient(135deg, #5C9BFF, var(--acc2)); }
  .copts .ca { background: linear-gradient(135deg, #3FCE84, #22A05C); }

  /* اخیر */
  .recents { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-y: auto; }
  .rrow { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-bottom: 1px solid var(--line2); cursor: pointer; }
  .rrow:hover { background: rgba(76,141,255,.05); }
  .rrow .dir { width: 32px; height: 32px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 14px; background: var(--bg2); border: 1px solid var(--line2); }
  .rrow.in .dir { color: var(--green); }
  .rrow.miss .dir { color: var(--red); }
  .rrow.out .dir { color: var(--acc); }
  .av {
    width: 38px; height: 38px; border-radius: 50%; flex: none; color: #060B14; font-size: 15px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, hsl(var(--h,215) 80% 65%), hsl(var(--h,215) 70% 44%));
  }
  .rrow .mid { flex: 1; min-width: 0; }
  .rrow .mid b { font-size: 13px; display: flex; gap: 5px; align-items: center; }
  .rrow .mid span { display: block; font-size: 10px; color: var(--dim); margin-top: 2px; font-family: var(--mono); direction: ltr; text-align: right; }
  .rrow .side { text-align: left; flex: none; }
  .rrow .side .tm { font-size: 9.5px; color: var(--dim); font-family: var(--mono); display: block; }
  .rrow .side .st { font-size: 9.5px; font-weight: 700; }
  .empty { padding: 30px 14px; text-align: center; color: var(--dim); font-size: 12px; }

  .tabs { display: flex; gap: 8px; margin-top: 10px; }
  .tabs button { flex: 1; height: 44px; border: 1px solid var(--line); background: var(--panel); color: var(--sub); border-radius: 10px; font-size: 13px; font-weight: 800; }
  .tabs button.on { color: var(--acc); border-color: var(--acc); background: rgba(76,141,255,.1); }

  /* ===== صفحه‌های تماس ===== */
  .overlay {
    position: absolute; inset: 0; z-index: 30; background: #0C1017;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border-radius: 10px; overflow: hidden;
  }
  .bigav {
    width: 96px; height: 96px; border-radius: 50%; color: #060B14; font-size: 38px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, hsl(var(--h,215) 80% 65%), hsl(var(--h,215) 70% 44%));
  }
  .ringing .bigav { animation: ringpulse 1.2s ease-in-out infinite; }
  @keyframes ringpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(76,141,255,.45); } 50% { box-shadow: 0 0 0 22px rgba(76,141,255,0); } }
  .cname { font-size: 19px; font-weight: 800; }
  .cnum { font-size: 11px; color: var(--sub); font-family: var(--mono); direction: ltr; }
  .cstate { font-size: 12px; color: var(--sub); }
  .ctime { font-family: var(--mono); font-size: 15px; color: var(--green); direction: ltr; }
  .answerrow { display: flex; gap: 60px; margin-top: 18px; }
  .bigbtn { width: 66px; height: 66px; border-radius: 50%; border: 0; color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center; }
  .bigbtn.decline { background: linear-gradient(135deg, #E8636A, #C43B47); }
  .bigbtn.accept { background: linear-gradient(135deg, #3FCE84, #22A05C); animation: accpulse 1.2s infinite; }
  @keyframes accpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(67,201,123,.5); } 50% { box-shadow: 0 0 0 18px rgba(67,201,123,0); } }

  #remoteVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #localVideo {
    position: absolute; top: 14px; inset-inline-start: 14px; width: 96px; height: 132px;
    object-fit: cover; border-radius: 10px; border: 2px solid rgba(255,255,255,.25); background: #000; z-index: 3;
  }
  .callui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; z-index: 4; }
  .callui .top { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: linear-gradient(180deg, rgba(6,10,16,.75), transparent); }
  .callui .ctrls { display: flex; gap: 14px; justify-content: center; padding: 16px; background: linear-gradient(0deg, rgba(6,10,16,.85), transparent); }
  .cbtn { width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(20,26,38,.8); color: #fff; font-size: 19px; }
  .cbtn.off { background: rgba(255,255,255,.9); color: #14202E; }
  .cbtn.hang { background: linear-gradient(135deg, #E8636A, #C43B47); border: 0; width: 60px; height: 60px; }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1C2530; border: 1px solid var(--line); color: var(--text);
    font-size: 12.5px; font-weight: 700; padding: 10px 18px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 99; max-width: 86%; text-align: center;
  }
  #toast.show { opacity: 1; }
  @media (max-width: 430px) {
    body { padding: 6px; }
    .key { height: 50px; }
    .shell { max-height: none; }
  }
</style>
</head>
<body>
  <div class="shell">

    <div id="login" class="card" hidden>
      <div class="logo"><div class="mark">📞</div><b>T کال<small>تماس صوتی و تصویری پیام‌رسان T</small></b></div>
      <input class="field" id="lgUser" placeholder="نام کاربری" autocomplete="username" />
      <input class="field" id="lgPass" type="password" placeholder="رمز" autocomplete="current-password" />
      <button class="btn primary" id="lgBtn" style="width:100%">ورود</button>
      <div class="msg" id="lgMsg"></div>
      <div class="hintlink">حساب نداری؟ <a href="/" target="_blank" rel="noopener">در پیام‌رسان T بساز</a></div>
    </div>

    <div id="app" hidden style="display:flex;flex-direction:column;height:100%">
      <div class="topbar">
        <div class="logo"><div class="mark">📞</div></div>
        <div class="tt"><b>T کال</b><span>playneofly.ir/call</span></div>
        <span class="mynum" id="myNum" title="کپی شمارهٔ من">—</span>
      </div>

      <div class="view" id="viewDial">
        <div class="numdisp"><b id="numDisp" class="empty">شمارهٔ ۱۰ رقمی…</b><button class="clr" id="btnClr">⌫</button></div>
        <div class="keypad" id="keypad"></div>
        <div class="dialrow">
          <button class="callbtn video" id="btnVideo">🎥 تماس تصویری</button>
          <button class="callbtn audio" id="btnAudio">📞 تماس صوتی</button>
        </div>
      </div>

      <div class="view" id="viewContacts" hidden>
        <div class="recents" id="cList"><div class="empty">…</div></div>
      </div>

      <div class="view" id="viewRecent" hidden>
        <div class="recents" id="recents"><div class="empty">…</div></div>
      </div>

      <div class="tabs">
        <button id="tabDial" class="on">⌨️ کیپد</button>
        <button id="tabContacts">👥 مخاطبین</button>
        <button id="tabRecent">🕐 اخیر</button>
      </div>
    </div>

    <div id="ovOutgoing" class="overlay ringing" hidden>
      <div class="bigav" id="oAv">?</div>
      <div class="cname" id="oName">…</div>
      <div class="cnum" id="oNum"></div>
      <div class="cstate">🔔 در حال زنگ خوردن…</div>
      <button class="bigbtn decline" id="oCancel">✕</button>
    </div>

    <div id="ovIncoming" class="overlay ringing" hidden>
      <div class="bigav" id="iAv">?</div>
      <div class="cname" id="iName">…</div>
      <div class="cnum" id="iNum"></div>
      <div class="cstate" id="iKind">📞 تماس صوتی ورودی</div>
      <div class="answerrow">
        <button class="bigbtn decline" id="iDecline">✕</button>
        <button class="bigbtn accept" id="iAccept">✓</button>
      </div>
    </div>

    <div id="ovActive" class="overlay" hidden>
      <video id="remoteVideo" hidden autoplay playsinline></video>
      <video id="localVideo" hidden autoplay playsinline muted></video>
      <audio id="remoteAudio" autoplay style="position:fixed;width:0;height:0;opacity:0;pointer-events:none"></audio>
      <div class="callui">
        <div class="top">
          <div class="cname" id="aName" style="color:#fff">…</div>
          <div class="cnum" id="aNum" style="color:rgba(255,255,255,.7)"></div>
          <div class="ctime" id="aTime">00:00</div>
          <div class="cstate" id="aState" style="color:rgba(255,255,255,.75)">در حال اتصال…</div>
        </div>
        <div class="ctrls">
          <button class="cbtn" id="aMute" title="میکروفن">🎙</button>
          <button class="cbtn" id="aCam" title="دوربین" hidden>🎥</button>
          <button class="cbtn" id="aFlip" title="عوض کردن دوربین" hidden>🔄</button>
          <button class="cbtn hang" id="aEnd" title="قطع">✕</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
  (function () {
    "use strict";
    /* ================================================================
       T کال — بازنویسی کامل با ماشین حالت واحد
       حالت‌ها: idle → dialing → incoming → connecting → incall
       یک حلقهٔ tick برای همه‌چیز؛ بدون حلقه‌های موازی و مسابقهٔ زمانی.
       ================================================================ */
    var $ = function (id) { return document.getElementById(id); };
    function toast(t) {
      var x = $("toast"); x.textContent = t; x.classList.add("show");
      clearTimeout(x._tm); x._tm = setTimeout(function () { x.classList.remove("show"); }, 2600);
    }
    function api(path, body, method) {
      return fetch("/api" + path, {
        method: method || (body ? "POST" : "GET"),
        credentials: "include",
        headers: body ? { "Content-Type": "application/json" } : undefined,
        body: body ? JSON.stringify(body) : undefined
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; });
      });
    }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function fmtDur(s) {
      s = Math.max(0, Math.floor(s));
      var m = Math.floor(s / 60), ss = s % 60;
      return (m < 10 ? "0" : "") + m + ":" + (ss < 10 ? "0" : "") + ss;
    }
    var hasRTC = typeof RTCPeerConnection !== "undefined";
    var ICE = { iceServers: [
      { urls: ["stun:stun.cloudflare.com:3478", "stun:stun.l.google.com:19302"] },
      { urls: ["turn:openrelay.metered.ca:80", "turn:openrelay.metered.ca:443", "turn:openrelay.metered.ca:443?transport=tcp"],
        username: "openrelayproject", credential: "openrelayproject" }
    ] };

    var me = null, myNumber = null;

    /* ---------- وضعیت مرکزی ---------- */
    var S = {
      st: "idle",                    // idle | dialing | incoming | connecting | incall
      call: null, role: "caller", kind: "audio",
      clientId: null, peerClientId: null, cursor: 0,
      localStream: null, mediaPromise: null,
      pc: null, graph: null, graphStream: null, pendingIce: [],
      offerDesc: null, offerSent: 0,
      micOn: true, camOn: true, facing: "user",
      answeredAt: 0, timer: 0,
      tickTm: 0, tickBusy: false, tickDelay: 1100,
      ringTm: 0, vibTm: 0, wdTm: 0,
      handled: {}, warnedCurrent: false,
      audioCtx: null
    };
    function setState(st) { S.st = st; scheduleTick(10); }

    /* ---------- حلقهٔ واحد ---------- */
    function scheduleTick(delay) {
      if (S.tickTm) return;
      S.tickTm = setTimeout(function () { S.tickTm = 0; tick(); }, delay || S.tickDelay);
    }
    function tick() {
      if (S.tickBusy) { scheduleTick(200); return; }
      S.tickBusy = true;
      var job = Promise.resolve();
      if (S.st === "idle") job = tickIdle();
      else if (S.st === "dialing") job = tickDialing();
      else if (S.st === "incoming") job = tickIncoming();
      else job = tickInCall();
      job.catch(function () {}).then(function () {
        S.tickBusy = false;
        scheduleTick();
      });
    }
    function nextDelay() {
      if (S.st === "idle") return 1100;
      if (S.st === "incoming") return 900;
      if (S.st === "dialing") return 400;
      return 300;
    }

    /* ---------- idle: کشف زنگ ورودی / بازگشت به تماس ---------- */
    function tickIdle() {
      return api("/call/inbox").then(function (r) {
        if (S.st !== "idle" || !r.ok) return;
        var inc = r.d.incoming;
        if (inc && inc.status === "ringing" && !S.handled[inc.id]) {
          beginIncoming(inc);
          return;
        }
        if (r.d.current && !S.warnedCurrent) {
          S.warnedCurrent = true;
          var cur = r.d.current;
          toast("بازگشت به تماس…");
          resumeCall(cur);
          return;
        }
        if (!r.d.current) S.warnedCurrent = false;
      });
    }
    function resumeCall(cur) {
      S.call = cur; S.role = cur.outgoing ? "caller" : "callee";
      S.kind = cur.kind || "audio"; S.cursor = 0; S.peerClientId = null;
      S.offerDesc = null; S.offerSent = 0; S.pendingIce = [];
      setState("connecting");
      openCallUI();
      setLabel("در حال اتصال…");
      ensureMedia();
      return api("/call/answer", { callId: cur.id }).then(function (r) {
        if (S.st !== "connecting") return;
        if (!r.ok) { S.warnedCurrent = false; endCall("تماس در دسترس نبود"); return; }
        S.clientId = r.d.clientId;
        S.peerClientId = r.d.peerClientId;
        S.answeredAt = r.d.call.answeredAt || Date.now();
        if (S.role === "caller") prepareOffer();
      });
    }

    /* ---------- dialing: صبر برای جواب ---------- */
    function tickDialing() {
      return api("/call/sync?callId=" + S.call.id + "&clientId=" + S.clientId + "&since=" + S.cursor).then(function (r) {
        if (S.st !== "dialing" || !r.ok || !r.d || r.d.status === undefined) return;
        if (r.d.cursor) S.cursor = r.d.cursor;
        if (r.d.status === "active") {
          S.peerClientId = r.d.peerClientId || S.peerClientId;
          S.answeredAt = r.d.answeredAt || Date.now();
          S.role = "caller";
          setState("connecting");
          openCallUI();
          setLabel("در حال اتصال…");
          prepareOffer();
        } else if (r.d.status === "declined") endCall("رد شد");
        else if (r.d.status === "missed") endCall("بی‌پاسخ");
        else if (r.d.status !== "ringing") endCall("تماس قطع شد");
      });
    }

    /* ---------- incoming: زنگ می‌خورد → لغوِ زنگ‌کننده را ببین ---------- */
    function tickIncoming() {
      return api("/call/inbox").then(function (r) {
        if (S.st !== "incoming") return;
        if (!r.ok) return;
        var inc = r.d.incoming;
        if (!inc || !inc.id || inc.id !== S.call.id) { endCall("تماس قطع شد"); }
      });
    }

    /* ---------- connecting | incall: سیگنال‌ها + وضعیت ---------- */
    function tickInCall() {
      return api("/call/sync?callId=" + S.call.id + "&clientId=" + S.clientId + "&since=" + S.cursor).then(function (r) {
        if (S.st !== "connecting" && S.st !== "incall") return;
        if (!r.ok || !r.d || r.d.status === undefined) return;
        if (r.d.cursor) S.cursor = r.d.cursor;
        if (r.d.peerClientId && !S.peerClientId) {
          S.peerClientId = r.d.peerClientId;
          if (S.role === "caller") flushOffer();
        }
        var sigs = r.d.signals || [];
        for (var i = 0; i < sigs.length; i++) onSignal(sigs[i]);
        if (r.d.status !== "active") { endCall(r.d.status === "declined" ? "رد شد" : "تماس تمام شد"); return; }
        if (S.st === "connecting" && S.pc && (S.pc.connectionState === "connected" || S.pc.connectionState === "completed")) {
          S.st = "incall";
          setLabel("متصل");
        }
        if (S.role === "caller" && S.st === "connecting" && S.offerDesc && Date.now() - S.offerSent > 4000) flushOffer();
      });
    }

    /* ---------- میڈیا (با کش promise — هرگز دوباره گرفته نمی‌شود) ---------- */
    function ensureMedia() {
      if (S.mediaPromise) return S.mediaPromise;
      var gmd = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
      if (!gmd) {
        S.mediaPromise = Promise.resolve(null);
        return S.mediaPromise;
      }
      var wantVideo = S.kind === "video";
      var p = gmd.call(navigator.mediaDevices, {
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
        video: wantVideo ? { facingMode: S.facing, width: { ideal: 640 }, height: { ideal: 480 } } : false
      });
      if (wantVideo) {
        p = p.catch(function () { return gmd.call(navigator.mediaDevices, { audio: true, video: true }); });
      }
      S.mediaPromise = p.then(function (st) {
        S.localStream = st;
        if (wantVideo && st && st.getVideoTracks().length === 0) { S.kind = "audio"; toast("دوربین اجازه نداد — تماس صوتی شد"); }
        return st;
      }).catch(function () {
        S.mediaPromise = null;
        toast("به میکروفن دسترسی نیست — فقط شنونده");
        return null;
      });
      return S.mediaPromise;
    }

    /* ---------- WebRTC (سبک tSpeak) ---------- */
    function wakeCtx() {
      try {
        S.audioCtx = S.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (S.audioCtx.state === "suspended") S.audioCtx.resume();
      } catch (e) {}
    }
    function createPC() {
      var pc = new RTCPeerConnection(ICE);
      S.pc = pc;
      if (S.localStream) {
        try {
          S.localStream.getTracks().forEach(function (t) {
            t.enabled = t.kind === "audio" ? S.micOn : S.camOn;
            pc.addTrack(t, S.localStream);
          });
          pc.getSenders().forEach(function (snd) {
            if (!snd || !snd.setParameters || !snd.track) return;
            try { snd.setParameters({ encodings: [{ maxBitrate: snd.track.kind === "video" ? 500000 : 32000 }] }); } catch (e2) {}
          });
        } catch (e) {}
      } else {
        try { pc.addTransceiver("audio", { direction: "recvonly" }); if (S.kind === "video") pc.addTransceiver("video", { direction: "recvonly" }); } catch (e) {}
      }
      pc.onicecandidate = function (e) { if (e.candidate && S.peerClientId) sig({ t: "ice", c: e.candidate }); };
      pc.ontrack = function (e) { attachRemote(e.streams[0]); };
      pc.onconnectionstatechange = function () {
        var cst = pc.connectionState;
        if (cst === "connected" || cst === "completed") { if (S.st === "connecting") { S.st = "incall"; } setLabel("متصل"); }
        else if (cst === "disconnected") {
          setTimeout(function () {
            if (S.pc === pc && pc.connectionState === "disconnected") setLabel("اتصال ضعیف…");
          }, 3500);
        } else if (cst === "failed") { setLabel("بازسازی اتصال…"); try { pc.restartIce(); } catch (e2) {} }
      };
      if (S.wdTm) clearInterval(S.wdTm);
      S.wdTm = setInterval(function () {
        if (S.pc !== pc || (S.st !== "connecting" && S.st !== "incall")) { clearInterval(S.wdTm); return; }
        var cst = pc.connectionState;
        if (cst === "failed" || cst === "disconnected") { try { pc.restartIce(); } catch (e2) {} }
      }, 9000);
      return pc;
    }
    function prepareOffer() {
      ensureMedia().then(function () {
        if (S.st !== "connecting" && S.st !== "incall") return;
        if (S.pc) { flushOffer(); return; }
        if (!hasRTC) return;
        var pc = createPC();
        pc.createOffer().then(function (of) {
          return pc.setLocalDescription(of).then(function () {
            S.offerDesc = pc.localDescription;
            flushOffer();
          });
        }).catch(function () {});
      });
    }
    function flushOffer() {
      if (!S.offerDesc || !S.peerClientId) return;
      sig({ t: "offer", s: S.offerDesc });
      S.offerSent = Date.now();
    }
    function sig(data) {
      if (!S.peerClientId) return;
      api("/call/signal", { callId: S.call.id, from: S.clientId, to: S.peerClientId, data: data });
      scheduleTick(80);
    }
    function onSignal(sg) {
      var d = null;
      try { d = typeof sg.data === "string" ? JSON.parse(sg.data) : sg.data; } catch (e) { d = null; }
      if (!d || !d.t) return;
      if (!hasRTC) return;
      if (d.t === "offer") {
        if (S.pc) { try { S.pc.close(); } catch (e) {} S.pc = null; S.pendingIce = []; }
        if (!S.localStream && S.mediaPromise) {
          S.mediaPromise.then(function () { if (d === S.lastOffer) return; S.lastOffer = d; takeOffer(d); });
          S.lastOffer = d;
          return;
        }
        S.lastOffer = d;
        takeOffer(d);
      } else if (d.t === "answer") {
        var p2 = S.pc;
        if (p2 && p2.signalingState !== "stable") {
          p2.setRemoteDescription(new RTCSessionDescription(d.s)).then(function () { flushIce(); }).catch(function () {});
        }
      } else if (d.t === "ice") {
        var p3 = S.pc;
        if (p3 && p3.remoteDescription) { try { p3.addIceCandidate(new RTCIceCandidate(d.c)).catch(function () {}); } catch (e4) {} }
        else S.pendingIce.push(d.c);
      }
    }
    function takeOffer(d) {
      var pc = S.pc || createPC();
      ensureMedia().then(function () {
        if (S.pc && S.pc !== pc) return;
        if (!S.localStream && !pc.getSenders().length) {
          try { pc.addTransceiver("audio", { direction: "recvonly" }); if (S.kind === "video") pc.addTransceiver("video", { direction: "recvonly" }); } catch (e) {}
        }
        pc.setRemoteDescription(new RTCSessionDescription(d.s)).then(function () {
          flushIce();
          return pc.createAnswer();
        }).then(function (an) {
          return pc.setLocalDescription(an).then(function () { sig({ t: "answer", s: pc.localDescription }); });
        }).catch(function () {});
      });
    }
    function flushIce() {
      if (!S.pendingIce.length || !S.pc) return;
      var q = S.pendingIce; S.pendingIce = [];
      q.forEach(function (c) { try { S.pc.addIceCandidate(new RTCIceCandidate(c)).catch(function () {}); } catch (e) {} });
    }
    function attachRemote(stream) {
      if (!stream) return;
      var hasVideo = S.kind === "video" || (stream.getVideoTracks && stream.getVideoTracks().length > 0);
      if (hasVideo) {
        var rv = $("remoteVideo");
        rv.muted = true;
        if (rv.srcObject !== stream) { rv.srcObject = stream; rv.hidden = false; rv.play().catch(function () {}); }
      }
      var ra = $("remoteAudio");
      ra.muted = true;
      if (ra.srcObject !== stream) { ra.srcObject = stream; }
      try {
        wakeCtx();
        if (S.graph && S.graphStream === stream) return;
        if (S.graph) { try { S.graph.src.disconnect(); } catch (e1) {} try { S.graph.gain.disconnect(); } catch (e2) {} }
        var srcNode = S.audioCtx.createMediaStreamSource(stream);
        var gain = S.audioCtx.createGain();
        gain.gain.value = 1;
        var analyser = S.audioCtx.createAnalyser(); analyser.fftSize = 512;
        srcNode.connect(analyser);
        srcNode.connect(gain); gain.connect(S.audioCtx.destination);
        S.graph = { src: srcNode, gain: gain };
        S.graphStream = stream;
      } catch (e) {
        ra.muted = false;
        try { ra.play().catch(function () { showUnlock(); }); } catch (e2) {}
      }
    }
    function showUnlock() {
      if (window._unlockTip) return;
      window._unlockTip = true;
      toast("برای شنیدن صدا، یک ضربه بزن");
      var handler = function () {
        try { $("remoteAudio").play().catch(function () {}); $("remoteVideo").play().catch(function () {}); } catch (e) {}
        document.removeEventListener("click", handler);
        window._unlockTip = false;
      };
      setTimeout(function () { document.addEventListener("click", handler); }, 50);
    }

    /* ---------- صداهای زنگ ---------- */
    function beep(freq, vol, dur) {
      try {
        wakeCtx();
        var o = S.audioCtx.createOscillator(), g = S.audioCtx.createGain();
        o.frequency.value = freq; g.gain.value = vol || 0.04;
        o.connect(g); g.connect(S.audioCtx.destination);
        o.start(); o.stop(S.audioCtx.currentTime + (dur || 0.06));
      } catch (e) {}
    }
    function startRing(kind) {
      stopRing();
      var toggle = function () { beep(880, 0.05, 0.3); setTimeout(function () { beep(660, 0.05, 0.3); }, 360); };
      toggle();
      S.ringTm = setInterval(toggle, 1900);
      if (kind === "in") {
        try {
          if (navigator.vibrate) {
            navigator.vibrate([600, 400, 600, 400]);
            S.vibTm = setInterval(function () { navigator.vibrate([600, 400, 600, 400]); }, 2000);
          }
        } catch (e) {}
      }
    }
    function stopRing() {
      if (S.ringTm) { clearInterval(S.ringTm); S.ringTm = 0; }
      if (S.vibTm) { clearInterval(S.vibTm); S.vibTm = 0; try { navigator.vibrate && navigator.vibrate(0); } catch (e) {} }
    }

    /* ---------- جریان‌های UI ---------- */
    function setLabel(t) { $("aState").textContent = t; }
    function openCallUI() {
      $("ovIncoming").hidden = true;
      $("ovOutgoing").hidden = true;
      $("ovActive").hidden = false;
      $("aName").textContent = S.call.peer.displayName || S.call.peer.username;
      $("aNum").textContent = "@" + S.call.peer.username;
      $("aTime").textContent = "00:00";
      $("aMute").classList.remove("off"); $("aMute").textContent = "🎙";
      $("aCam").classList.remove("off");
      $("aCam").hidden = S.kind !== "video";
      $("aFlip").hidden = S.kind !== "video";
      $("remoteVideo").hidden = S.kind !== "video";
      $("localVideo").hidden = S.kind !== "video";
      stopRing();
      if (!S.timer) {
        S.timer = setInterval(function () {
          if (S.st === "incall" || S.st === "connecting") {
            $("aTime").textContent = fmtDur((Date.now() - (S.answeredAt || Date.now())) / 1000);
          }
        }, 1000);
      }
    }
    function startOutgoingUI() {
      $("oAv").textContent = (S.call.peer.displayName || "?").trim().charAt(0);
      $("oAv").style.setProperty("--h", S.call.peer.hue || 215);
      $("oName").textContent = S.call.peer.displayName || S.call.peer.username;
      $("oNum").textContent = "@" + S.call.peer.username;
      $("ovOutgoing").hidden = false;
      startRing("out");
    }
    function beginIncoming(inc) {
      S.call = inc; S.role = "callee"; S.kind = inc.kind || "audio";
      S.cursor = 0; S.clientId = null; S.peerClientId = null;
      S.offerDesc = null; S.offerSent = 0; S.pendingIce = [];
      S.handled[inc.id] = 1;
      addContact(inc.peer, inc.peerNumber, true); renderContacts();
      wakeCtx();
      setState("incoming");
      $("iAv").textContent = (inc.peer.displayName || "?").trim().charAt(0);
      $("iAv").style.setProperty("--h", inc.peer.hue || 215);
      $("iName").textContent = inc.peer.displayName || inc.peer.username;
      $("iNum").textContent = "@" + inc.peer.username;
      $("iKind").textContent = inc.kind === "video" ? "🎥 تماس تصویری ورودی" : "📞 تماس صوتی ورودی";
      $("ovIncoming").hidden = false;
      startRing("in");
    }

    /* ---------- پایان ---------- */
    function endCall(reason) {
      var had = !!S.call;
      stopRing();
      if (S.timer) { clearInterval(S.timer); S.timer = 0; }
      if (S.wdTm) { clearInterval(S.wdTm); S.wdTm = 0; }
      if (S.pc) { try { S.pc.close(); } catch (e) {} S.pc = null; }
      if (S.graph) { try { S.graph.src.disconnect(); S.graph.gain.disconnect(); } catch (e) {} S.graph = null; }
      if (S.localStream) { try { S.localStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} S.localStream = null; }
      S.mediaPromise = null; S.graphStream = null; S.pendingIce = []; S.offerDesc = null; S.offerSent = 0;
      if (S.call) S.handled[S.call.id] = 1;
      try { $("remoteVideo").srcObject = null; $("remoteAudio").srcObject = null; $("localVideo").srcObject = null; } catch (e) {}
      $("ovOutgoing").hidden = true; $("ovIncoming").hidden = true; $("ovActive").hidden = true;
      S.st = "idle";
      S.call = null; S.cursor = 0; S.warnedCurrent = false;
      if (had) { toast(reason || "تماس پایان یافت"); loadRecents(); }
      scheduleTick(600);
    }

    /* ================================================================
       رابط کاربری
       ================================================================ */
    function showLogin() { $("login").hidden = false; $("app").hidden = true; }
    $("lgBtn").addEventListener("click", function () {
      var u = $("lgUser").value.trim(), p = $("lgPass").value;
      if (!u || !p) { $("lgMsg").textContent = "نام کاربری و رمز لازم است"; return; }
      $("lgBtn").disabled = true; $("lgMsg").textContent = "";
      api("/auth/login", { username: u, password: p }).then(function (r) {
        $("lgBtn").disabled = false;
        if (r.ok) boot(); else $("lgMsg").textContent = (r.d && r.d.error) || "ورود نشد";
      }).catch(function () { $("lgBtn").disabled = false; $("lgMsg").textContent = "خطای اتصال"; });
    });

    function loadNumber() {
      api("/call/number").then(function (r) {
        if (!r.ok) return;
        me = r.d.me; myNumber = r.d.number;
        $("myNum").textContent = myNumber || "—";
        loadRecents();
      });
    }
    $("myNum").addEventListener("click", function () {
      if (!myNumber) return;
      (navigator.clipboard ? navigator.clipboard.writeText(myNumber) : Promise.reject())
        .then(function () { toast("شمارهٔ تو کپی شد: " + myNumber); })
        .catch(function () { prompt("شمارهٔ تو:", myNumber); });
    });

    /* ---------- کیپد ---------- */
    var keys = [["1"],["2"],["3"],["4"],["5"],["6"],["7"],["8"],["9"]];
    var dial = "";
    (function () {
      var h = "";
      keys.forEach(function (k) { h += '<button class="key" data-k="' + k[0] + '">' + k[0] + "</button>"; });
      h += '<div></div><button class="key zero" data-k="0">0</button><div></div>';
      $("keypad").innerHTML = h;
    })();
    function renderDial() {
      var el = $("numDisp");
      if (dial) { el.textContent = dial; el.className = ""; }
      else { el.textContent = "شمارهٔ ۱۰ رقمی…"; el.className = "empty"; }
      $("btnAudio").disabled = !/^[0-9]{10}$/.test(dial);
      $("btnVideo").disabled = !/^[0-9]{10}$/.test(dial);
    }
    $("keypad").addEventListener("click", function (e) {
      var k = e.target.getAttribute && e.target.getAttribute("data-k");
      if (!k) return;
      if (/^[0-9]$/.test(k) && dial.length < 10) { dial += k; renderDial(); beep(1200, 0.02, 0.02); }
    });
    $("btnClr").addEventListener("click", function () { dial = dial.slice(0, -1); renderDial(); });
    document.addEventListener("keydown", function (e) {
      if ($("login").hidden && S.st === "idle") {
        var tg = e.target;
        if (tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA")) return;
        if (/^[0-9]$/.test(e.key)) { if (dial.length < 10) { dial += e.key; renderDial(); } }
        else if (e.key === "Backspace") { dial = dial.slice(0, -1); renderDial(); }
        else if (e.key === "Enter" && /^[0-9]{10}$/.test(dial)) startCall("audio");
      }
    });
    $("btnAudio").addEventListener("click", function () { startCall("audio"); });
    $("btnVideo").addEventListener("click", function () { startCall("video"); });

    /* ---------- شروع تماس ---------- */
    function startCall(kind) {
      if (S.st !== "idle") return;
      var target = dial.trim();
      if (!/^[0-9]{10}$/.test(target)) { toast("شمارهٔ ۱۰ رقمی را کامل بزن"); return; }
      wakeCtx();
      api("/call/dial", { target: target, kind: kind }).then(function (r) {
        if (!r.ok) { toast((r.d && r.d.error) || "زنگ نخورد"); return; }
        S.call = r.d.call; S.role = "caller"; S.kind = r.d.call.kind || kind;
        S.clientId = r.d.clientId; S.cursor = 0; S.peerClientId = null;
        S.offerDesc = null; S.offerSent = 0; S.pendingIce = [];
        addContact(r.d.call.peer, target);
        ensureMedia();
        setState("dialing");
        startOutgoingUI();
      });
    }
    $("oCancel").addEventListener("click", function () {
      var id = S.call && S.call.id;
      if (id) { api("/call/end", { callId: id }); S.handled[id] = 1; }
      endCall("لغو شد");
    });

    /* ---------- ورودی ---------- */
    $("iDecline").addEventListener("click", function () {
      api("/call/decline", { callId: S.call && S.call.id });
      endCall("رد شد");
    });
    $("iAccept").addEventListener("click", function () {
      wakeCtx();
      var callId = S.call.id;
      ensureMedia();
      setState("connecting");
      openCallUI();
      setLabel("در حال اتصال…");
      api("/call/answer", { callId: callId }).then(function (r) {
        if (S.st !== "connecting") return;
        if (!r.ok) { endCall((r.d && r.d.error) || "تماس در دسترس نیست"); return; }
        S.clientId = r.d.clientId;
        S.peerClientId = r.d.peerClientId;
        S.answeredAt = r.d.call.answeredAt || Date.now();
      });
    });

    /* ---------- کنترل‌ها ---------- */
    $("aMute").addEventListener("click", function () {
      S.micOn = !S.micOn;
      if (S.localStream) S.localStream.getAudioTracks().forEach(function (t) { t.enabled = S.micOn; });
      if (S.pc) S.pc.getSenders().forEach(function (x) { if (x.track && x.track.kind === "audio") x.track.enabled = S.micOn; });
      this.classList.toggle("off", !S.micOn);
      this.textContent = S.micOn ? "🎙" : "🔇";
    });
    $("aCam").addEventListener("click", function () {
      S.camOn = !S.camOn;
      if (S.localStream) S.localStream.getVideoTracks().forEach(function (t) { t.enabled = S.camOn; });
      if (S.pc) S.pc.getSenders().forEach(function (x) { if (x.track && x.track.kind === "video") x.track.enabled = S.camOn; });
      this.classList.toggle("off", !S.camOn);
    });
    $("aFlip").addEventListener("click", function () {
      if (!S.localStream || !S.pc) return;
      var gmd = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
      if (!gmd) return;
      S.facing = S.facing === "user" ? "environment" : "user";
      gmd.call(navigator.mediaDevices, { video: { facingMode: S.facing } }).then(function (st) {
        var nt = st.getVideoTracks()[0];
        var sender = S.pc.getSenders().filter(function (x) { return x.track && x.track.kind === "video"; })[0];
        if (sender) sender.replaceTrack(nt);
        var old = S.localStream.getVideoTracks()[0];
        if (old) old.stop();
        S.localStream.removeTrack(old); S.localStream.addTrack(nt);
        try { $("localVideo").srcObject = S.localStream; } catch (e) {}
      }).catch(function () { toast("دوربین عوض نشد"); });
    });
    $("aEnd").addEventListener("click", function () {
      api("/call/end", { callId: S.call && S.call.id });
      endCall("تماس تمام شد");
    });

    /* ---------- مخاطبین ---------- */
    var contacts = [];
    try { contacts = JSON.parse(localStorage.getItem("t-call-contacts") || "[]") || []; } catch (e) { contacts = []; }
    function saveContacts() { try { localStorage.setItem("t-call-contacts", JSON.stringify(contacts.slice(0, 40))); } catch (e) {} }
    function addContact(peer, number, silent) {
      if (!peer || !peer.username || !/^[0-9]{10}$/.test(String(number || ""))) return;
      contacts = contacts.filter(function (c) { return c.username !== peer.username; });
      contacts.unshift({ username: peer.username, displayName: peer.displayName || peer.username, hue: peer.hue || 215, number: String(number) });
      contacts = contacts.slice(0, 40);
      saveContacts();
      if (!silent) renderContacts();
    }
    var openContactIdx = null;
    function renderContacts() {
      var box = $("cList");
      if (!contacts.length) { box.innerHTML = '<div class="empty">هرکی بهش زنگ بزنی یا بهت زنگ بزنه، همین‌جا ثبت میشه</div>'; return; }
      box.innerHTML = contacts.map(function (c, i) {
        var h = '<div class="contact" data-ci="' + i + '"><div class="crow">' +
          '<div class="av" style="--h:' + (c.hue || 215) + '">' + esc((c.displayName || "?").trim().charAt(0).toUpperCase()) + "</div>" +
          '<span class="cnm">' + esc(c.displayName) + '<span class="cnum2">' + esc(c.number) + "</span></span></div>";
        if (openContactIdx === i) {
          h += '<div class="copts">' +
            '<button class="cv" data-cc="' + i + '" data-ck="video">🎥 تماس تصویری</button>' +
            '<button class="ca" data-cc="' + i + '" data-ck="audio">📞 تماس صوتی</button></div>';
        }
        return h + "</div>";
      }).join("");
    }
    $("cList").addEventListener("click", function (e) {
      var t = e.target;
      var cc = t.getAttribute && t.getAttribute("data-cc");
      var ck = t.getAttribute && t.getAttribute("data-ck");
      if (cc !== null && cc !== undefined && ck) {
        var c = contacts[Number(cc)];
        if (c && /^[0-9]{10}$/.test(c.number)) { dial = c.number; renderDial(); startCall(ck); }
        return;
      }
      var row = t.closest ? t.closest(".contact") : null;
      if (!row) return;
      var idx = Number(row.getAttribute("data-ci"));
      openContactIdx = openContactIdx === idx ? null : idx;
      renderContacts();
    });

    /* ---------- اخیر ---------- */
    function statusTxt(c) {
      if (c.status === "missed") return c.outgoing ? "بی‌پاسخ" : "از دست رفته";
      if (c.status === "declined") return c.outgoing ? "رد شد" : "رد کردی";
      if (c.status === "cancelled") return "لغو شد";
      if (c.status === "ended") return fmtDur(((c.endedAt || 0) - (c.answeredAt || c.startedAt || 0)) / 1000);
      return c.status === "ringing" ? "زنگ می‌خورد" : "…";
    }
    function loadRecents() {
      api("/call/recents").then(function (r) {
        if (!r.ok) return;
        var cs = r.d.calls || [];
        var ch2 = false;
        cs.forEach(function (c) { var b = contacts.length; addContact(c.peer, c.peerNumber, true); if (contacts.length !== b) ch2 = true; });
        if (ch2) renderContacts();
        if (!cs.length) { $("recents").innerHTML = '<div class="empty">هنوز تماسی نداشتی — اولین زنگ را بزن! 📞</div>'; return; }
        $("recents").innerHTML = cs.map(function (c) {
          var cls = c.status === "missed" ? "miss" : (c.outgoing ? "out" : "in");
          var dir = c.status === "missed" ? "✖" : (c.outgoing ? "↗" : "↙");
          var tm = new Date(c.startedAt || 0).toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
          return '<div class="rrow ' + cls + '" data-peer="' + esc(c.peerNumber || c.peer.username) + '">' +
            '<span class="dir">' + dir + "</span>" +
            '<div class="av" style="--h:' + (c.peer.hue || 215) + '">' + esc((c.peer.displayName || c.peer.username || "?").trim().charAt(0).toUpperCase()) + "</div>" +
            '<div class="mid"><b>' + esc(c.peer.displayName || c.peer.username) + (c.kind === "video" ? ' <span style="font-size:10px">🎥</span>' : "") + "</b>" +
            "<span>@" + esc(c.peer.username) + "</span></div>" +
            '<div class="side"><span class="tm">' + tm + '</span><span class="st">' + statusTxt(c) + "</span></div>" +
            "</div>";
        }).join("");
      });
    }
    $("recents").addEventListener("click", function (e) {
      var row = e.target.closest ? e.target.closest(".rrow") : null;
      if (!row) return;
      var num = row.getAttribute("data-peer");
      if (!/^[0-9]{10}$/.test(num)) { toast("شمارهٔ این کاربر در دسترس نیست"); return; }
      dial = num; renderDial(); startCall("audio");
    });

    /* ---------- تب‌ها ---------- */
    $("tabDial").addEventListener("click", function () { switchTab("dial"); });
    $("tabContacts").addEventListener("click", function () { switchTab("contacts"); });
    $("tabRecent").addEventListener("click", function () { switchTab("recent"); });
    function switchTab(t) {
      $("tabDial").classList.toggle("on", t === "dial");
      $("tabContacts").classList.toggle("on", t === "contacts");
      $("tabRecent").classList.toggle("on", t === "recent");
      $("viewDial").hidden = t !== "dial";
      $("viewContacts").hidden = t !== "contacts";
      $("viewRecent").hidden = t !== "recent";
      if (t === "recent") loadRecents();
      if (t === "contacts") renderContacts();
    }

    /* ---------- شروع ---------- */
    function boot() {
      $("login").hidden = true; $("app").hidden = false;
      loadNumber();
      renderContacts();
      renderDial();
      setState("idle");
    }
    var m = location.hash.match(/#dial=([0-9]{10})/);
    api("/me").then(function (r) {
      if (r.ok) {
        boot();
        if (m) { dial = m[1]; renderDial(); startCall("audio"); }
      } else showLogin();
    }).catch(showLogin);
    renderDial();
  })();
  </script>
</body>
</html>
