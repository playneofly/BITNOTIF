    <script>
    (function () {
      "use strict";

      var API      = "/api";
      var overlay  = document.getElementById("loginOverlay");
      var root     = document.getElementById("root");
      var loader   = document.getElementById("bootLoader");
      var loginMsg = document.getElementById("msgLogin");
      var signupMsg= document.getElementById("msgSignup");

      var settled = false;
      function hideLoader() {
        if (loader.classList.contains("hide")) return;
        loader.classList.add("fade");
        setTimeout(function () { loader.classList.add("hide"); }, 300);
      }
      function showApp()    { hideLoader(); overlay.classList.remove("show"); root.style.display = "block"; }
      function showLogin(text) {
        hideLoader();
        root.style.display = "none";
        overlay.classList.add("show");
        if (text) showMsg(loginMsg, text, "error", true);
      }

      /* پاسخ را فقط وقتی JSON است می‌خوانیم؛ اگر HTML برگشت یعنی API جلویش گرفته شده */
      function readJson(res) {
        var ct = res.headers.get("content-type") || "";
        if (ct.indexOf("application/json") === -1) {
          return Promise.reject(new Error("no-api"));
        }
        return res.json().then(function (d) { return { ok: res.ok, status: res.status, d: d || {} }; });
      }

      function showMsg(el, text, type, sticky) {
        el.textContent = text;
        el.className = "msg " + type;
        el.style.display = "block";
        if (text && !sticky) setTimeout(function () { el.style.display = "none"; }, 6000);
      }
      function hideMsg(el) { el.style.display = "none"; }

      function errText(r) {
        if (r && r.d && r.d.error) return r.d.error;
        if (r && r.status === 503) return "Server database is not connected.";
        return "Something went wrong. Try again.";
      }

      /* ---------- تشخیص وضعیت ورود ----------
         مسیر سریع: کوکیِ نشانه (t_in) که موقع ورود ست می‌شود؛ بدون انتظار برای شبکه.
         بعد پاسخ واقعی /api/me می‌رسد و اگر لازم بود تصمیم اصلاح می‌شود. */
      function boot() {
        if (window.__hint) {
          settled = true;
          showApp();
        }
        var req = window.__meReq || fetch(API + "/me", { credentials: "include", cache: "no-store" })
          .then(function (r) { return { status: r.status, ct: r.headers.get("content-type") || "" }; })
          .catch(function () { return { status: 0, ct: "" }; });

        req.then(function (r) {
          if (r.status === 200) { settled = true; showApp(); return; }
          if (r.status === 0 || r.ct.indexOf("application/json") === -1) {
            /* شبکه/API در دسترس نیست */
            if (!settled) showLogin("Server is not reachable right now. Please refresh in a moment.");
            return;
          }
          settled = true;
          showLogin("");
        });
      }
      boot();

      /* اگر داخل اپ خروج زد و به /login رفت، دوباره همین پنل را نشان بده.
         نکته: موقع بالا آمدن، خود اپ یک لحظه به /login می‌رود؛ پس قبل از نشان دادن
         پنل، حتماً از سرور می‌پرسیم که واقعاً لاگ‌اوت شده یا نه. */
      function watchLogout() {
        var checking = false, timer = null;
        function check() {
          var p = location.pathname;
          if (p !== "/login" && p !== "/register") return;

              .then(function (r) {
                checking = false;
                if (r.status === 200) return; // هنوز لاگین است → اپ فقط داشت بالا می‌آمد
                root.style.display = "none";
                overlay.classList.add("show");
              })
              .catch(function () { checking = false; });
          }, 400);
        }
        ["pushState", "replaceState"].forEach(function (m) {
          var orig = history[m];
          history[m] = function () { var r = orig.apply(this, arguments); setTimeout(check, 0); return r; };
        });
        window.addEventListener("popstate", function () { setTimeout(check, 0); });
      }
      watchLogout();

      /* ---------- flip ---------- */
      var flipped   = false;
      var slider    = document.getElementById("flipSlider");
      var inner     = document.getElementById("flipInner");
      var sideLogin = document.getElementById("sideLogin");
      var sideSignup= document.getElementById("sideSignup");

      function setFlip(on) {
        flipped = on;
        inner.classList.toggle("flipped", on);
        slider.classList.toggle("on", on);
        sideLogin.classList.toggle("active", !on);
        sideSignup.classList.toggle("active", on);
      }
      slider.addEventListener("click", function () { setFlip(!flipped); });
      sideLogin.addEventListener("click", function () { setFlip(false); });
      sideSignup.addEventListener("click", function () { setFlip(true); });

      /* بعد از ورود، همان صفحه‌ای که کاربر خواسته باز شود (مثلاً پنل ادمین) */
      function afterAuth() {
        var target = location.pathname;
        if (target === "/login" || target === "/register") target = "/";
        location.replace(target + location.search);
      }

      /* ---------- ورود ---------- */
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var username = document.getElementById("loginUsername").value.trim();
        var password = document.getElementById("loginPassword").value;
        if (!username || !password) { showMsg(loginMsg, "Username and password are required", "error"); return; }
        var btn = this.querySelector("button");
        btn.disabled = true; hideMsg(loginMsg);
        fetch(API + "/auth/login", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(readJson)
          .then(function (r) {
            btn.disabled = false;
            if (r.ok && r.d.user) { showMsg(loginMsg, "Welcome back!", "ok"); afterAuth(); }
            else showMsg(loginMsg, errText(r), "error");
          })
          .catch(function (err) {
            btn.disabled = false;
            showMsg(loginMsg, err && err.message === "no-api"
              ? "Server API is not responding. (Cloudflare Functions / D1)"
              : "Connection error", "error");
          });
      });

      /* ---------- ثبت‌نام ---------- */
      document.getElementById("signupForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var name     = document.getElementById("signupName").value.trim();
        var username = document.getElementById("signupUsername").value.trim();
        var password = document.getElementById("signupPassword").value;
        if (!name || !username || !password) { showMsg(signupMsg, "Name, username and password are required", "error"); return; }
        if (!/^[a-zA-Z][a-zA-Z0-9_]{2,19}$/.test(username)) {
          showMsg(signupMsg, "Username: 3–20 chars, letters/numbers/_ , must start with a letter", "error"); return;
        }
        if (password.length < 6) { showMsg(signupMsg, "Password must be at least 6 characters", "error"); return; }
        var btn = this.querySelector("button");
        btn.disabled = true; hideMsg(signupMsg);
        fetch(API + "/auth/register", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password, displayName: name })
        })
          .then(readJson)
          .then(function (r) {
            btn.disabled = false;
            if (r.ok && r.d.user) { showMsg(signupMsg, "Account created!", "ok"); afterAuth(); }
            else showMsg(signupMsg, errText(r), "error");
          })
          .catch(function (err) {
            btn.disabled = false;
            showMsg(signupMsg, err && err.message === "no-api"
              ? "Server API is not responding. (Cloudflare Functions / D1)"
              : "Connection error", "error");
          });
      });
    })();
    </script>

    <script>
    (function () {
      "use strict";

      var ADMIN_PATH = "/13899831a";
      var LIST_MS = 12000, CHAT_MS = 6000;
      var panel = null, tabBtn = null, badgeEl = null;
      var threads = [], current = null, open = false;
      var listTimer = null, chatTimer = null, pollTimer = null;
      var q = "";

      function onAdmin() { return location.pathname.indexOf(ADMIN_PATH) === 0; }

      function api(path, opt) {
        return fetch("/api" + path, Object.assign({ credentials: "include", cache: "no-store" }, opt || {}))
          .then(function (r) {
            var ct = r.headers.get("content-type") || "";
            if (ct.indexOf("application/json") === -1) throw new Error("no-api");
            return r.json().then(function (d) {
              if (!r.ok) throw new Error((d && d.error) || "خطا");
              return d;
            });
          });
      }
      function el(tag, cls, txt) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (txt != null) n.textContent = txt;
        return n;
      }
      function toast(msg) {
        var t = document.getElementById("tsupToast");
        if (!t) { t = el("div", "tsup-toast"); t.id = "tsupToast"; document.body.appendChild(t); }
        t.textContent = msg; t.style.display = "block";
        clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = "none"; }, 4000);
      }
      function fa(n) { return String(n).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; }); }
      function timeOf(ts) {
        if (!ts) return "";
        var d = new Date(ts), now = new Date();
        var sameDay = d.toDateString() === now.toDateString();
        try {
          return sameDay
            ? d.toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" })
            : d.toLocaleDateString("fa-IR", { month: "2-digit", day: "2-digit" });
        } catch (e) { return fa(d.getHours() + ":" + d.getMinutes()); }
      }
      function tickOf(b) {
        if (b === "owner") return { c: "#9b7ae0", t: "مالک" };
        if (b === "admin") return { c: "#e0b84d", t: "ادمین" };
        if (b === "verified") return { c: "#6aa0ff", t: "تایید" };
        return null;
      }

      /* ---------- ساخت پنل ---------- */
      function buildPanel() {
        if (panel) return panel;
        panel = el("div"); panel.id = "tsupPanel";

        var head = el("div", "tsup-head");
        var back = el("button", "tsup-btn tsup-back", "→");
        back.title = "برگشت به لیست";
        back.addEventListener("click", function () { panel.classList.remove("chat-open"); });
        var h = el("h2", null, "پشتیبانی اختصاصی T");
        var sub = el("span", "sub", "پیام‌ها از طرف ربات فرستاده می‌شود");
        var grow = el("div", "grow");
        var search = el("input", "tsup-search"); search.placeholder = "جستجوی یوزرنیم یا اسم";
        search.addEventListener("input", function () { q = this.value.trim().toLowerCase(); renderList(); });
        var refresh = el("button", "tsup-btn", "تازه‌سازی");
        refresh.addEventListener("click", function () { loadList(true); });
        var close = el("button", "tsup-btn", "بستن ✕");
        close.addEventListener("click", closePanel);
        head.appendChild(back); head.appendChild(h); head.appendChild(sub);
        head.appendChild(grow); head.appendChild(search); head.appendChild(refresh); head.appendChild(close);

        var body = el("div", "tsup-body");
        var list = el("div", "tsup-list"); list.id = "tsupList";
        var chat = el("div", "tsup-chat"); chat.id = "tsupChat";
        chat.appendChild(el("div", "tsup-hint", "یک گفتگو را از لیست انتخاب کن تا جوابش را بدهی."));
        body.appendChild(list); body.appendChild(chat);

        panel.appendChild(head); panel.appendChild(body);
        document.body.appendChild(panel);
        return panel;
      }

      /* ---------- لیست گفتگوها ---------- */
      function loadList(showErr) {
        return api("/admin/support")
          .then(function (d) {
            threads = d.threads || [];
            setBadge(d.totalUnread || 0);
            if (open) renderList();
          })
          .catch(function (e) { if (showErr) toast("خطا در گرفتن لیست: " + e.message); });
      }
      function setBadge(n) {
        if (!badgeEl) return;
        badgeEl.textContent = n > 99 ? "۹۹+" : fa(n);
        badgeEl.classList.toggle("on", n > 0);
      }
      function renderList() {
        var box = document.getElementById("tsupList");
        if (!box) return;
        box.textContent = "";
        var items = threads.filter(function (t) {
          if (!q) return true;
          return (t.username || "").toLowerCase().indexOf(q) > -1 ||
                 (t.displayName || "").toLowerCase().indexOf(q) > -1;
        });
        if (!items.length) {
          box.appendChild(el("div", "tsup-empty", q ? "چیزی پیدا نشد." : "هنوز کسی به پشتیبانی پیام نداده است."));
          return;
        }
        items.forEach(function (t) {
          var b = el("button", "tsup-item" + (current && current.userId === t.userId ? " sel" : ""));
          var av = el("div", "tsup-av");
          if (t.avatar) { var im = new Image(); im.src = t.avatar; av.appendChild(im); }
          else { av.textContent = (t.displayName || t.username || "?").trim().charAt(0); av.style.background = "hsl(" + (t.hue || 40) + ",42%,45%)"; }
          var meta = el("div", "tsup-meta");
          var nm = el("div", "tsup-name");
          if (t.online) nm.appendChild(el("span", "dot"));
          nm.appendChild(el("span", null, t.displayName || t.username));
          var tk = tickOf(t.badge);
          if (tk) { var s = el("span", "tick", "●"); s.style.color = tk.c; s.title = tk.t; nm.appendChild(s); }
          if (t.banned) { var bn = el("span", "tick", "⛔"); bn.title = "مسدود"; nm.appendChild(bn); }
          meta.appendChild(nm);
          meta.appendChild(el("div", "tsup-prev", "@" + t.username + " · " + (t.preview || "")));
          var side = el("div", "tsup-side");
          side.appendChild(el("div", "tsup-time", timeOf(t.lastAt)));
          if (t.unread > 0) side.appendChild(el("div", "tsup-unread", fa(t.unread)));
          b.appendChild(av); b.appendChild(meta); b.appendChild(side);
          b.addEventListener("click", function () { openThread(t); });
          box.appendChild(b);
        });
      }

      /* ---------- گفتگو ---------- */
      function openThread(t) {
        current = t;
        panel.classList.add("chat-open");
        renderList();
        renderChatShell();
        loadChat(true);
        clearInterval(chatTimer);
        chatTimer = setInterval(function () { if (open && current) loadChat(false); }, CHAT_MS);
      }
      function renderChatShell() {
        var chat = document.getElementById("tsupChat");
        chat.textContent = "";
        var head = el("div", "tsup-chat-head");
        var av = el("div", "tsup-av");
        if (current.avatar) { var im = new Image(); im.src = current.avatar; av.appendChild(im); }
        else { av.textContent = (current.displayName || "?").charAt(0); av.style.background = "hsl(" + (current.hue || 40) + ",42%,45%)"; }
        var w = el("div");
        w.appendChild(el("div", "who", current.displayName || current.username));
        w.appendChild(el("div", "uname", "@" + current.username + (current.online ? " · آنلاین" : "")));
        head.appendChild(av); head.appendChild(w);
        var msgs = el("div", "tsup-msgs"); msgs.id = "tsupMsgs";
        var comp = el("div", "tsup-comp");
        var ta = el("textarea", "tsup-ta"); ta.id = "tsupTa"; ta.placeholder = "جواب را بنویس… (Enter = ارسال)";
        ta.addEventListener("input", function () { this.style.height = "auto"; this.style.height = Math.min(140, this.scrollHeight) + "px"; });
        ta.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
        });
        var btn = el("button", "tsup-btn gold", "ارسال"); btn.id = "tsupSend";
        btn.addEventListener("click", send);
        comp.appendChild(ta); comp.appendChild(btn);
        chat.appendChild(head); chat.appendChild(msgs); chat.appendChild(comp);
      }
      function loadChat(scroll) {
        if (!current) return;
        api("/admin/support/" + encodeURIComponent(current.userId))
          .then(function (d) {
            renderMsgs(d.messages || [], scroll);
            current.unread = 0;
            loadList(false);
          })
          .catch(function (e) { if (scroll) toast("خطا: " + e.message); });
      }
      function renderMsgs(list, scroll) {
        var box = document.getElementById("tsupMsgs");
        if (!box) return;
        var atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 60;
        box.textContent = "";
        if (!list.length) box.appendChild(el("div", "tsup-hint", "هنوز پیامی رد و بدل نشده."));
        list.forEach(function (m) {
          var row = el("div", "tsup-row " + (m.fromBot ? "bot" : "user"));
          var bub = el("div", "tsup-bub");
          if (m.deleted) { bub.appendChild(el("em", null, "پیام حذف شده")); }
          else {
            if (m.mediaId && (m.type === "photo" || m.type === "album")) {
              var im = new Image(); im.src = "/api/admin/support/media/" + m.mediaId; im.loading = "lazy";
              bub.appendChild(im);
            } else if (m.mediaId && m.type === "voice") {
              var au = document.createElement("audio"); au.controls = true;
              au.src = "/api/admin/support/media/" + m.mediaId; bub.appendChild(au);
            } else if (m.mediaId && m.type === "video") {
              var vd = document.createElement("video"); vd.controls = true; vd.style.maxWidth = "100%";
              vd.style.borderRadius = "9px"; vd.src = "/api/admin/support/media/" + m.mediaId; bub.appendChild(vd);
            }
            if (m.body) bub.appendChild(document.createTextNode(m.body));
          }
          bub.appendChild(el("span", "t", (m.fromBot ? "پشتیبانی · " : "") + timeOf(m.createdAt)));
          row.appendChild(bub);
          box.appendChild(row);
        });
        if (scroll || atBottom) box.scrollTop = box.scrollHeight;
      }
      function send() {
        var ta = document.getElementById("tsupTa");
        var btn = document.getElementById("tsupSend");
        if (!ta || !current) return;
        var text = ta.value.trim();
        if (!text) return;
        btn.disabled = true;
        api("/admin/support/" + encodeURIComponent(current.userId), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ body: text })
        })
          .then(function () {
            ta.value = ""; ta.style.height = "auto";
            btn.disabled = false;
            loadChat(true);
          })
          .catch(function (e) { btn.disabled = false; toast("ارسال نشد: " + e.message); });
      }

      /* ---------- باز/بسته ---------- */
      function openPanel() {
        buildPanel();
        open = true;
        panel.classList.add("open");
        if (tabBtn) tabBtn.classList.add("on");
        document.querySelectorAll(".admin-tab").forEach(function (b) {
          if (b !== tabBtn) b.classList.remove("on");
        });
        renderList();
        loadList(true);
        clearInterval(listTimer);

        '<path d="M20 13h-2.4a1 1 0 0 0-1 1v3.4a1 1 0 0 0 1 1h.8a1.6 1.6 0 0 0 1.6-1.6Z"></path>' +
        '<path d="M18 18.4v.6a2.5 2.5 0 0 1-2.5 2.5H13"></path></svg>';

      function injectTab() {
        if (!onAdmin()) return;
        var nav = document.querySelector(".admin-rail nav");
        if (!nav) return;
        if (tabBtn && nav.contains(tabBtn)) return;
        tabBtn = document.createElement("button");
        tabBtn.type = "button";
        tabBtn.className = "admin-tab" + (open ? " on" : "");
        tabBtn.title = "پشتیبانی";

      /* کلیک‌ها به‌صورت delegation — حتی اگر React ریل را دوباره بسازد کار می‌کند */
      document.addEventListener("click", function (e) {
        if (!e.target || !e.target.closest) return;
        var mine = e.target.closest("[data-t-support]");
        if (mine) {
          e.preventDefault(); e.stopPropagation();
          tabBtn = mine;

          if (open) closePanel(); else openPanel();
          return;
        }
        if (e.target.closest(".admin-tab") && open) closePanel();
      }, true);

      var mo = new MutationObserver(function () {
        if (!onAdmin()) { if (open) closePanel(); tabBtn = null; badgeEl = null; return; }

    <script>
    (function () {
      "use strict";
      /* دکمه‌های آپلود و ورودی‌ها را بدون دست‌زدن به ساختار React بهبود می‌دهد */

      var FOLDER =
        '<div class="folder">' +
          '<div class="front-side"><div class="tip"></div><div class="cover"></div></div>' +
          '<div class="back-side cover"></div>' +
        '</div>';

      function label(inp) {
        var f = inp.files && inp.files[0];
        if (f) return f.name.length > 26 ? f.name.slice(0, 23) + "…" : f.name;
        var acc = (inp.getAttribute("accept") || "");
        if (acc.indexOf("apk") > -1) return "انتخاب فایل APK";
        if (acc.indexOf("image") > -1) return "انتخاب عکس";
        return "انتخاب فایل";
      }

      function makeCard(inp) {
        var card = document.createElement("div");
        card.className = "t-upload";
        card.setAttribute("data-t-upload", "1");
        card.innerHTML = FOLDER + '<span class="custom-file-upload"></span>';
        card.querySelector(".custom-file-upload").textContent = label(inp);
        card.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          inp.click();
        });
        inp.addEventListener("change", function () {
          var t = card.querySelector(".custom-file-upload");
          if (t) t.textContent = label(inp);
        });
        return card;
      }

      function enhance() {
        /* ۱) فایل‌های پنل ادمین */
        var files = document.querySelectorAll('.admin input[type="file"]:not(.t-av-input)');
        for (var i = 0; i < files.length; i++) {
          var inp = files[i];
          if (inp.closest("table")) continue;          /* ورودی‌های آواتار داخل جدول کارت نمی‌گیرند */
          var next = inp.nextElementSibling;
          if (next && next.getAttribute && next.getAttribute("data-t-upload")) {
            if (!inp.classList.contains("t-file-native")) inp.classList.add("t-file-native");
            continue;
          }
          inp.classList.add("t-file-native");
          inp.insertAdjacentElement("afterend", makeCard(inp));
        }
        /* کارت‌های یتیم (اگر React ورودی را برداشت) پاک شوند */
        var cards = document.querySelectorAll("[data-t-upload]");
        for (var k = 0; k < cards.length; k++) {
          var prev = cards[k].previousElementSibling;
          if (!prev || prev.tagName !== "INPUT" || prev.type !== "file") cards[k].remove();
        }
        /* ۲) گیرهٔ کاغذ چت → پوشه */
        var clips = document.querySelectorAll('.composer .tool[title="عکس یا فیلم"]');
        for (var j = 0; j < clips.length; j++) {
          if (!clips[j].classList.contains("t-clip")) clips[j].classList.add("t-clip");
        }
      }

      var t = null;
      function schedule() {
        if (t) return;
        t = setTimeout(function () { t = null; try { enhance(); } catch (e) {} }, 200);
      }
      function start() {
        enhance();
        new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
      else start();
    })();

      function fitMenu(menu) {

          menu.style.bottom = "";
          var pad = 8;
          var r = menu.getBoundingClientRect();
          var dx = 0;
          if (r.right > window.innerWidth - pad) dx = window.innerWidth - pad - r.right;
          if (r.left + dx < pad) dx = pad - r.left;
          if (dx) menu.style.transform = "translateX(" + Math.round(dx) + "px)";
          var r2 = menu.getBoundingClientRect();
          if (r2.bottom > window.innerHeight - pad && r2.height < window.innerHeight - 40) {
            menu.style.top = "auto";
            menu.style.bottom = "100%";
          }
        } catch (e) {}
      }
      function scanMenus() {
        var list = document.querySelectorAll(".bubble > .menu");

        '<path d="M31.436,34.063H3.564A3.318,3.318,0,0,1,.25,30.749V22.011a1.25,1.25,0,0,1,2.5,0v8.738a.815.815,0,0,0,.814.814H31.436a.815.815,0,0,0,.814-.814V22.011a1.25,1.25,0,1,1,2.5,0v8.738A3.318,3.318,0,0,1,31.436,34.063Z"></path></svg>';

        fetch("/api/site", { credentials: "include", cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) { dlSite = d.site || null; fillDl(dlSite); })

      /* کلیک روی هر دکمهٔ دانلود → پنجرهٔ ما */
      document.addEventListener("click", function (e) {
        if (!e.target || !e.target.closest) return;

        '5.3-39.5 3.7-3.8 67.1-61.5 68.3-66.7 .2-.7 .3-3.1-1.2-4.4s-3.6-.8-5.1-.5q-3.3 .7-104.6 69.1-14.8 10.2-26.9 9.9c-8.9-.2-25.9-5-38.6-9.1-15.5-5-27.9-7.7-26.8-16.3q.8-6.7 18.5-13.7 108.4-47.2 144.6-62.3c68.9-28.6 83.2-33.6 92.5-33.8 2.1 0 6.6 .5 9.6 2.9a10.5 10.5 0 0 1 3.5 6.7A43.8 43.8 0 0 1 363 176.7z"/></svg>';

    <script>
    (function () {
      "use strict";
      /* بک‌گراند گفتگو + متن تولتیپ دکمهٔ دانلود */

      var convCache = {};              /* id -> "bot" | "human" */
      var CACHE_KEY = "t_conv_kinds";
      try {
        var saved = sessionStorage.getItem(CACHE_KEY);
        if (saved) convCache = JSON.parse(saved) || {};
      } catch (e) {}
      function remember(id, kind) {
        convCache[id] = kind;
        try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(convCache)); } catch (e) {}
      }

      /* یک‌بار همهٔ گفتگوها را می‌گیریم تا موقع سوئیچ هیچ تأخیری نباشد */
      var preloaded = false, preloading = false;
      function preloadKinds() {
        if (preloaded || preloading) return;
        preloading = true;
        fetch("/api/conversations", { credentials: "include", cache: "no-store" })
          .then(function (r) {
            if (!r.ok) throw new Error("no");
            return r.json();
          })
          .then(function (d) {
            (d.conversations || []).forEach(function (c) {
              var peer = c.peer || {};
              remember(c.id, String(peer.id || "").indexOf("bot_") === 0 ? "bot" : "human");
            });
            preloaded = true; preloading = false;
            decorateChat();
          })
          .catch(function () {
            preloading = false;                 /* هنوز لاگین نشده؛ دفعهٔ بعد دوباره */
          });
      }

      function convIdFromUrl() {
        var m = /^\/c\/([^/?#]+)/.exec(location.pathname);
        return m ? m[1] : null;
      }

      function applyBg(pane, kind) {
        var bg = pane.querySelector(":scope > .t-chatbg");
        if (bg && bg.dataset.kind === kind) return;
        if (bg) bg.remove();
        bg = document.createElement("div");
        bg.className = "t-chatbg";
        bg.dataset.kind = kind;
        bg.innerHTML = kind === "bot"
          ? '<div class="container"></div>'
          : '<div class="island"></div><div class="islandt"></div>';
        pane.insertBefore(bg, pane.firstChild);
      }

      function decorateChat() {
        var pane = document.querySelector(".chat-pane");
        if (!pane) return;
        var id = convIdFromUrl();
        if (!id) {
          var old = pane.querySelector(":scope > .t-chatbg");
          if (old) old.remove();
          return;
        }
        var kind = convCache[id];
        if (kind) { applyBg(pane, kind); return; }
        preloadKinds();
        if (pending[id]) return;
        pending[id] = 1;
        fetch("/api/conversations/" + encodeURIComponent(id), { credentials: "include", cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var conv = d && d.conversation;
            var peer = conv && conv.peer;
            var isBot = !!(peer && String(peer.id || "").indexOf("bot_") === 0);
            remember(id, isBot ? "bot" : "human");
            delete pending[id];
            var pane2 = document.querySelector(".chat-pane");
            if (pane2 && convIdFromUrl() === id) applyBg(pane2, convCache[id]);
          })
          .catch(function () { delete pending[id]; });
      }

      var pending = {};

      /* تولتیپ دکمهٔ دانلود = حجم فایل */
      var sizeTxt = null;
      function fa(n) { return String(n).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; }); }
      function loadSize() {
        if (sizeTxt !== null) return;
        sizeTxt = "";
        fetch("/api/site", { credentials: "include", cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var apk = d && d.site && d.site.apk;
            if (!apk) { sizeTxt = "بدون فایل"; return; }
            var mb = (apk.bytes || 0) / 1048576;
            var sz = apk.bytes ? (mb >= 1 ? fa(mb.toFixed(1)) + " MB" : fa(Math.round(apk.bytes / 1024)) + " KB") : "";
            sizeTxt = apk.version ? (sz ? sz + " · v" + apk.version : "v" + apk.version) : (sz || "دانلود");
            paintTips();
          })
          .catch(function () {});
      }
      function paintTips() {
        if (!sizeTxt) return;
        var tips = document.querySelectorAll(".apk-nav .Btn .tooltip");
        for (var i = 0; i < tips.length; i++) {
          if (tips[i].textContent !== sizeTxt) tips[i].textContent = sizeTxt;
        }
      }

      var t = null;
      function tick() {
        if (t) return;
        t = setTimeout(function () {
          t = null;
          try { preloadKinds(); decorateChat(); loadSize(); paintTips(); } catch (e) {}
        }, 150);
      }
      function start() {
        tick();
        new MutationObserver(tick).observe(document.body, { childList: true, subtree: true });
        function instant() {
          try { decorateChat(); } catch (e) {}
          tick();
        }
        ["pushState", "replaceState"].forEach(function (m) {
          var orig = history[m];
          history[m] = function () { var r = orig.apply(this, arguments); instant(); setTimeout(instant, 0); return r; };
        });
        window.addEventListener("popstate", instant);
        /* کلیک روی ردیف گفتگو هم فوراً بک‌گراند را عوض می‌کند */
        document.addEventListener("click", function (e) {
          if (e.target && e.target.closest && e.target.closest(".list .row")) setTimeout(instant, 0);
        }, true);
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
      else start();
    })();
    </script>

    <script>
    (function () {
      "use strict";
      /* در پنل ادمین → تب کاربران، برای هر بات دکمهٔ آپلود عکس پروفایل */

      var AV_MAX = 118000;          /* کمی زیر سقف سرور (۱۲۰٬۰۰۰) */
      var usersById = null, lastFetch = 0;

      var ICON =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M4 19V7a2 2 0 0 1 2-2h2l1.2-2h5.6L16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>' +
        '<circle cx="12" cy="12.5" r="3.4"/></svg>';

      function loadUsers() {
        if (usersById && Date.now() - lastFetch < 20000) return Promise.resolve(usersById);
        return fetch("/api/admin/users", { credentials: "include", cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var map = {};
            (d.users || []).forEach(function (u) {
              if (u.username) map[String(u.username).toLowerCase()] = u.id;
            });
            usersById = map; lastFetch = Date.now();
            return map;
          })
          .catch(function () { return usersById || {}; });
      }

      /* عکس را کوچک و فشرده می‌کند تا زیر سقف سرور بماند */
      function shrink(file) {
        return new Promise(function (resolve, reject) {
          var fr = new FileReader();
          fr.onerror = function () { reject(new Error("فایل خوانده نشد")); };
          fr.onload = function () {
            var img = new Image();
            img.onerror = function () { reject(new Error("این فایل عکس نیست")); };
            img.onload = function () {
              var size = 256;
              var cv = document.createElement("canvas");
              cv.width = size; cv.height = size;
              var ctx = cv.getContext("2d");
              var s = Math.min(img.width, img.height);
              ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
              var q = 0.85, out = cv.toDataURL("image/jpeg", q);
              while (out.length > AV_MAX && q > 0.35) { q -= 0.1; out = cv.toDataURL("image/jpeg", q); }
              if (out.length > AV_MAX) {
                cv.width = cv.height = 168;
                cv.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 168, 168);
                out = cv.toDataURL("image/jpeg", 0.7);
              }
              if (out.length > AV_MAX) return reject(new Error("عکس خیلی سنگین است"));
              resolve(out);
            };
            img.src = fr.result;
          };
          fr.readAsDataURL(file);
        });
      }

      function send(id, payload) {
        return fetch("/api/admin/users/" + encodeURIComponent(id), {
          method: "PATCH", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).then(function (r) {
          return r.json().then(function (d) {
            if (!r.ok) throw new Error((d && d.error) || "نشد");
            return d;
          });
        });
      }

      function flash(btn, cls, text) {
        var old = btn.dataset.label || btn.textContent;
        btn.classList.add(cls);
        btn.querySelector("span").textContent = text;
        setTimeout(function () {
          btn.classList.remove(cls);
          btn.querySelector("span").textContent = old;
        }, 2200);
      }

      function attach(row, username, id) {
        if (row.querySelector(".t-avup")) return;
        var cell = row.cells && row.cells.length ? row.cells[0] : row;

        var input = document.createElement("input");
        input.type = "file";
        input.className = "t-av-input";
        input.accept = "image/png,image/jpeg,image/webp";
        input.style.display = "none";

        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "t-avup";
        btn.title = "آپلود عکس پروفایل برای @" + username;
        btn.innerHTML = ICON + "<span>عکس</span>";
        btn.dataset.label = "عکس";

        var rm = document.createElement("button");
        rm.type = "button";
        rm.className = "t-avup t-avup-rm";
        rm.title = "برداشتن عکس";
        rm.innerHTML = "<span>حذف عکس</span>";
        rm.dataset.label = "حذف عکس";

        btn.addEventListener("click", function (e) {
          e.preventDefault(); e.stopPropagation(); input.click();
        });
        rm.addEventListener("click", function (e) {
          e.preventDefault(); e.stopPropagation();
          rm.disabled = true;
          send(id, { stripAvatar: true })
            .then(function () { rm.disabled = false; flash(rm, "done", "پاک شد ✓"); })
            .catch(function (err) { rm.disabled = false; flash(rm, "err", err.message); });
        });
        input.addEventListener("change", function () {
          var f = input.files && input.files[0];
          input.value = "";
          if (!f) return;
          btn.disabled = true;
          btn.querySelector("span").textContent = "…";
          shrink(f)
            .then(function (dataUrl) { return send(id, { avatar: dataUrl }); })
            .then(function () { btn.disabled = false; flash(btn, "done", "ثبت شد ✓"); })
            .catch(function (err) { btn.disabled = false; flash(btn, "err", err.message || "نشد"); });
        });

        cell.appendChild(input);
        cell.appendChild(btn);
        cell.appendChild(rm);
      }

      function scan() {
        if (location.pathname.indexOf("/13899831a") !== 0) return;
        var rows = document.querySelectorAll(".admin table tbody tr");
        if (!rows.length) return;
        var bots = [];
        for (var i = 0; i < rows.length; i++) {
          if (rows[i].textContent.indexOf("بات رسمی") > -1 && !rows[i].querySelector(".t-avup")) bots.push(rows[i]);
        }
        if (!bots.length) return;
        loadUsers().then(function (map) {
          bots.forEach(function (row) {
            var m = /@([A-Za-z0-9_]+)/.exec(row.textContent || "");
            if (!m) return;
            var id = map[m[1].toLowerCase()];
            if (id) attach(row, m[1], id);
          });
        });
      }

      var t = null;
      function tick() {
        if (t) return;
        t = setTimeout(function () { t = null; try { scan(); } catch (e) {} }, 220);
      }
      function start() {
        tick();
        new MutationObserver(tick).observe(document.body, { childList: true, subtree: true });
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
      else start();
    })();
    </script>
  </body>
</html>
