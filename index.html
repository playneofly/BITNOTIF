<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="description" content="پیام‌رسان T" />
    <title>T</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050506'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' font-family='Georgia' fill='%23d4a84b'%3ET%3C/text%3E%3C/svg%3E" />
    <style>
      /* ===== پنل ورود flip-card — تم تیره ===== */
      :root {
        --lg-bg:#0d0f14; --lg-card:#1b1f28; --lg-card2:#151922; --lg-border:#333a48;
        --lg-input:#232936; --lg-text:#f2f3f5; --lg-sub:#9aa0a6; --lg-gold:#d4a84b; --lg-gold2:#e0b84d;
      }
      /* قد واقعی صفحه روی موبایل (نوار مرورگر) */
      @supports (height: 100dvh) { :root { --app-h: 100dvh; } }

      html, body { height: 100%; }
      #loginOverlay {
        position: fixed; inset: 0; z-index: 99999;
        background: radial-gradient(1000px 700px at 50% -20%, #1a1e27 0%, var(--lg-bg) 60%, #07080b 100%);
        display: none; align-items: center; justify-content: center;
        padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
        box-sizing: border-box; overflow-y: auto; -webkit-overflow-scrolling: touch;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, sans-serif;
      }
      #loginOverlay.show { display: flex; }
      .auth-box { display: flex; flex-direction: column; align-items: center; gap: 20px; margin: auto; width: 100%; max-width: 340px; }
      .switch-row { display: flex; align-items: center; justify-content: center; gap: 18px; }
      .switch-row .side { font-size: 15px; font-weight: 600; color: var(--lg-sub); cursor: pointer; user-select: none; padding: 2px 4px; transition: color .2s; border-bottom: 2px solid transparent; background: none; border-top: 0; border-inline: 0; }
      .switch-row .side.active { color: var(--lg-gold); border-bottom-color: var(--lg-gold); }
      .switch-row .slider { width: 56px; height: 26px; border-radius: 20px; background: var(--lg-input); border: 1.5px solid var(--lg-border); position: relative; cursor: pointer; transition: background .25s; flex-shrink: 0; padding: 0; }
      .switch-row .slider:before { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--lg-gold); transition:transform .25s; }
      .switch-row .slider.on { background:rgba(212,168,75,.25); border-color:var(--lg-gold); }
      .switch-row .slider.on:before { transform:translateX(30px); background:#fff; }
      .flip-wrap { perspective: 1200px; width: 100%; display: flex; justify-content: center; }
      .flip-card__inner {
        width: 100%; max-width: 320px;
        height: clamp(430px, calc(var(--app-h, 100vh) - 190px), 480px);
        position: relative; transform-style: preserve-3d; transition: transform .7s;
      }
      .flip-card__inner.flipped { transform: rotateY(180deg); }
      .flip-card__front, .flip-card__back {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        -webkit-backface-visibility: hidden; backface-visibility: hidden;
        background: linear-gradient(165deg, var(--lg-card) 0%, var(--lg-card2) 100%);
        border: 1px solid var(--lg-border); border-radius: 14px;
        box-shadow: 0 24px 60px -16px rgba(0,0,0,.8);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 24px 22px; box-sizing: border-box; overflow-y: auto;
      }
      .flip-card__back { transform: rotateY(180deg); }
      .card-title { font-size: 24px; font-weight: 800; color: var(--lg-text); letter-spacing: .5px; margin-bottom: 4px; }
      .auth-form { display: flex; flex-direction: column; align-items: center; gap: 13px; width: 100%; }
      .auth-input {
        width: 100%; height: 46px; border-radius: 8px; border: 1.5px solid var(--lg-border);
        background: var(--lg-input); color: var(--lg-text);
        font-size: 16px; /* جلوگیری از زوم خودکار روی iOS */
        font-weight: 500; padding: 6px 14px; outline: none; box-sizing: border-box;
        transition: border-color .2s, box-shadow .2s;
      }
      .auth-input::placeholder { color: var(--lg-sub); opacity: .85; }
      .auth-input:focus { border-color: var(--lg-gold); box-shadow: 0 0 0 3px rgba(212,168,75,.16); }
      .auth-btn {
        width: 150px; height: 44px; border: none; border-radius: 8px;
        background: linear-gradient(135deg, var(--lg-gold2) 0%, #c89a35 100%);
        color: #1a1508; font-size: 15px; font-weight: 700; letter-spacing: .5px; cursor: pointer;
        margin-top: 4px; transition: transform .15s, box-shadow .2s, opacity .2s;
        box-shadow: 0 8px 20px -6px rgba(212,168,75,.45);
      }
      .auth-btn:hover { transform: translateY(-1px); }
      .auth-btn:active { transform: translateY(1px); }
      .auth-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
      .msg { display: none; font-size: 12.5px; line-height: 1.6; text-align: center; font-weight: 600; padding: 7px 10px; border-radius: 6px; width: 100%; box-sizing: border-box; }
      .msg.error { color: #ffb4b4; background: rgba(255,80,80,.12); border: 1px solid rgba(255,80,80,.3); }
      .msg.ok { color: #b4f5b4; background: rgba(80,255,80,.08); border: 1px solid rgba(80,255,80,.25); }

      /* لودر کوتاه تا وقتی وضعیت ورود مشخص شود */
      #bootLoader {
        position: fixed; inset: 0; z-index: 100000; display: flex; align-items: center; justify-content: center;
        background: #050506;
      }
      #bootLoader.hide { display: none; }
      #bootLoader .ring {
        width: 44px; height: 44px; border-radius: 50%;
        border: 3px solid rgba(212,168,75,.18); border-top-color: var(--lg-gold);
        animation: spin .9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 420px) {
        .auth-box { gap: 14px; }
        .switch-row { gap: 12px; }
        .switch-row .side { font-size: 13.5px; }
        .switch-row .slider { width: 50px; height: 24px; }
        .switch-row .slider.on:before { transform: translateX(26px); }
        .flip-card__inner { max-width: 300px; height: clamp(420px, calc(var(--app-h, 100vh) - 150px), 470px); }
        .flip-card__front, .flip-card__back { padding: 20px 18px; gap: 12px; }
        .card-title { font-size: 21px; }
        .auth-btn { width: 145px; }
      }
      @media (max-height: 560px) {
        .flip-card__inner { height: 420px; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-uC5WU97B.js"></script>

  <body style="margin:0;background:#050506">
    <!-- اپ تا وقتی وضعیت ورود مشخص نشده مخفی است -->
    <div id="root" style="display:none"></div>

    <div id="bootLoader"><div class="ring"></div></div>

    <!-- پنل ورود/ثبت‌نام flip-card -->
    <div id="loginOverlay" dir="ltr">
      <div class="auth-box">
        <div class="switch-row">
          <button type="button" class="side active" id="sideLogin">Log in</button>
          <button type="button" class="slider" id="flipSlider" aria-label="switch"></button>
          <button type="button" class="side" id="sideSignup">Sign up</button>
        </div>
        <div class="flip-wrap">
          <div class="flip-card__inner" id="flipInner">
            <div class="flip-card__front">
              <div class="card-title">Log in</div>
              <div id="msgLogin" class="msg"></div>
              <form class="auth-form" id="loginForm" onsubmit="return false;">
                <input type="text" placeholder="Username" id="loginUsername" class="auth-input" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
                <input type="password" placeholder="Password" id="loginPassword" class="auth-input" autocomplete="current-password">
                <button class="auth-btn" type="submit">Let`s go!</button>
              </form>
            </div>
            <div class="flip-card__back">
              <div class="card-title">Sign up</div>
              <div id="msgSignup" class="msg"></div>
              <form class="auth-form" id="signupForm" onsubmit="return false;">
                <input type="text" placeholder="Name" id="signupName" class="auth-input" autocomplete="name">
                <input type="text" placeholder="Username" id="signupUsername" class="auth-input" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
                <input type="password" placeholder="Password" id="signupPassword" class="auth-input" autocomplete="new-password">
                <button class="auth-btn" type="submit">Confirm!</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
    (function () {
      "use strict";

      var API      = "/api";
      var overlay  = document.getElementById("loginOverlay");
      var root     = document.getElementById("root");
      var loader   = document.getElementById("bootLoader");
      var loginMsg = document.getElementById("msgLogin");
      var signupMsg= document.getElementById("msgSignup");

      function hideLoader() { loader.classList.add("hide"); }
      function showApp()    { hideLoader(); overlay.classList.remove("show"); root.style.display = "block"; }
      function showLogin(text) {
        hideLoader();
        root.style.display = "none";
        overlay.classList.add("show");
        if (text) showMsg(loginMsg, text, "error", true);
      }

      /* پاسخ را فقط وقتی JSON است می‌خوانیم؛ اگر HTML برگشت یعنی API جلویش گرفته شده */
      function readJson(res) {
        var ct = res.headers.get("content-type") || "";
        if (ct.indexOf("application/json") === -1) {
          return Promise.reject(new Error("no-api"));
        }
        return res.json().then(function (d) { return { ok: res.ok, status: res.status, d: d || {} }; });
      }

      function showMsg(el, text, type, sticky) {
        el.textContent = text;
        el.className = "msg " + type;
        el.style.display = "block";
        if (text && !sticky) setTimeout(function () { el.style.display = "none"; }, 6000);
      }
      function hideMsg(el) { el.style.display = "none"; }

      function errText(r) {
        if (r && r.d && r.d.error) return r.d.error;
        if (r && r.status === 503) return "Server database is not connected.";
        return "Something went wrong. Try again.";
      }

      /* ---------- تشخیص وضعیت ورود ---------- */
      function boot() {
        fetch(API + "/me", { credentials: "include", cache: "no-store" })
          .then(function (res) {
            var ct = res.headers.get("content-type") || "";
            if (ct.indexOf("application/json") === -1) {
              /* API اصلاً جواب JSON نمی‌دهد → به کاربر بگو، به اپ راه نده */
              showLogin("Server is not reachable right now. Please try again in a moment.");
              return;
            }
            if (res.status === 200) showApp();
            else showLogin("");
          })
          .catch(function () {
            showLogin("Connection error. Check your internet and refresh.");
          });
      }
      boot();

      /* اگر داخل اپ خروج زد و به /login رفت، دوباره همین پنل را نشان بده */
      function watchLogout() {
        function check() {
          var p = location.pathname;
          if ((p === "/login" || p === "/register") && root.style.display !== "none") {
            root.style.display = "none";
            overlay.classList.add("show");
          }
        }
        ["pushState", "replaceState"].forEach(function (m) {
          var orig = history[m];
          history[m] = function () { var r = orig.apply(this, arguments); setTimeout(check, 0); return r; };
        });
        window.addEventListener("popstate", function () { setTimeout(check, 0); });
      }
      watchLogout();

      /* ---------- flip ---------- */
      var flipped   = false;
      var slider    = document.getElementById("flipSlider");
      var inner     = document.getElementById("flipInner");
      var sideLogin = document.getElementById("sideLogin");
      var sideSignup= document.getElementById("sideSignup");

      function setFlip(on) {
        flipped = on;
        inner.classList.toggle("flipped", on);
        slider.classList.toggle("on", on);
        sideLogin.classList.toggle("active", !on);
        sideSignup.classList.toggle("active", on);
      }
      slider.addEventListener("click", function () { setFlip(!flipped); });
      sideLogin.addEventListener("click", function () { setFlip(false); });
      sideSignup.addEventListener("click", function () { setFlip(true); });

      /* بعد از ورود، همان صفحه‌ای که کاربر خواسته باز شود (مثلاً پنل ادمین) */
      function afterAuth() {
        var target = location.pathname;
        if (target === "/login" || target === "/register") target = "/";
        location.replace(target + location.search);
      }

      /* ---------- ورود ---------- */
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var username = document.getElementById("loginUsername").value.trim();
        var password = document.getElementById("loginPassword").value;
        if (!username || !password) { showMsg(loginMsg, "Username and password are required", "error"); return; }
        var btn = this.querySelector("button");
        btn.disabled = true; hideMsg(loginMsg);
        fetch(API + "/auth/login", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(readJson)
          .then(function (r) {
            btn.disabled = false;
            if (r.ok && r.d.user) { showMsg(loginMsg, "Welcome back!", "ok"); afterAuth(); }
            else showMsg(loginMsg, errText(r), "error");
          })
          .catch(function (err) {
            btn.disabled = false;
            showMsg(loginMsg, err && err.message === "no-api"
              ? "Server API is not responding. (Cloudflare Functions / D1)"
              : "Connection error", "error");
          });
      });

      /* ---------- ثبت‌نام ---------- */
      document.getElementById("signupForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var name     = document.getElementById("signupName").value.trim();
        var username = document.getElementById("signupUsername").value.trim();
        var password = document.getElementById("signupPassword").value;
        if (!name || !username || !password) { showMsg(signupMsg, "Name, username and password are required", "error"); return; }
        if (!/^[a-zA-Z][a-zA-Z0-9_]{2,19}$/.test(username)) {
          showMsg(signupMsg, "Username: 3–20 chars, letters/numbers/_ , must start with a letter", "error"); return;
        }
        if (password.length < 6) { showMsg(signupMsg, "Password must be at least 6 characters", "error"); return; }
        var btn = this.querySelector("button");
        btn.disabled = true; hideMsg(signupMsg);
        fetch(API + "/auth/register", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password, displayName: name })
        })
          .then(readJson)
          .then(function (r) {
            btn.disabled = false;
            if (r.ok && r.d.user) { showMsg(signupMsg, "Account created!", "ok"); afterAuth(); }
            else showMsg(signupMsg, errText(r), "error");
          })
          .catch(function (err) {
            btn.disabled = false;
            showMsg(signupMsg, err && err.message === "no-api"
              ? "Server API is not responding. (Cloudflare Functions / D1)"
              : "Connection error", "error");
          });
      });
    })();
    </script>
  </body>
