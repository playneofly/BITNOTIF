      <div class="auth-box">
        <div class="switch-row">
          <button type="button" class="side active" id="sideLogin">ورود</button>
          <button type="button" class="slider" id="flipSlider" aria-label="switch"></button>
          <button type="button" class="side" id="sideSignup">ثبت‌نام</button>
        </div>
        <div class="flip-wrap">
          <div class="flip-card__inner" id="flipInner">
            <div class="flip-card__front">
              <div class="card-title">خوش آمدی</div>
              <div id="msgLogin" class="msg"></div>
              <form class="auth-form" id="loginForm" onsubmit="return false;">
                <input type="text" placeholder="نام کاربری" id="loginUsername" class="auth-input" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
                <input type="password" placeholder="رمز عبور" id="loginPassword" class="auth-input" autocomplete="current-password">
                <button class="auth-btn" type="submit">بزن بریم</button>
              </form>
            </div>
            <div class="flip-card__back">
              <div class="card-title">ساخت حساب تازه</div>
              <div id="msgSignup" class="msg"></div>
              <form class="auth-form" id="signupForm" onsubmit="return false;">
                <input type="text" placeholder="Name" id="signupName" class="auth-input" autocomplete="name">
                <input type="text" placeholder="نام کاربری" id="signupUsername" class="auth-input" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
                <input type="password" placeholder="رمز عبور" id="signupPassword" class="auth-input" autocomplete="new-password">
                <button class="auth-btn" type="submit">ثبت‌نام</button>
              </form>
            </div>
          </div>
        </div>
        <button type="button" class="dl-hint" id="dlFromLogin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>
          <span>دانلود اپ اندروید</span>
        </button>
      </div>
    </div>

    <script>
    (function () {
      "use strict";

      var API      = "/api";
      var overlay  = document.getElementById("loginOverlay");
      var root     = document.getElementById("root");
      var loader   = document.getElementById("bootLoader");
      var loginMsg = document.getElementById("msgLogin");
      var signupMsg= document.getElementById("msgSignup");

      var settled = false;
      function hideLoader() {
        if (loader.classList.contains("hide")) return;
        loader.classList.add("fade");
        setTimeout(function () { loader.classList.add("hide"); }, 300);
      }
      function showApp()    { hideLoader(); overlay.classList.remove("show"); root.style.display = "block"; }
      function showLogin(text) {
        hideLoader();
        root.style.display = "none";
        overlay.classList.add("show");
        if (text) showMsg(loginMsg, text, "error", true);
      }

      /* پاسخ را فقط وقتی JSON است می‌خوانیم؛ اگر HTML برگشت یعنی API جلویش گرفته شده */
      function readJson(res) {
        var ct = res.headers.get("content-type") || "";
        if (ct.indexOf("application/json") === -1) {
          return Promise.reject(new Error("no-api"));
        }
        return res.json().then(function (d) { return { ok: res.ok, status: res.status, d: d || {} }; });
      }

      function showMsg(el, text, type, sticky) {
        el.textContent = text;
        el.className = "msg " + type;
        el.style.display = "block";
        if (text && !sticky) setTimeout(function () { el.style.display = "none"; }, 6000);
      }
      function hideMsg(el) { el.style.display = "none"; }

      function errText(r) {
        if (r && r.d && r.d.error) return r.d.error;
        if (r && r.status === 503) return "Server database is not connected.";
        return "Something went wrong. Try again.";
      }

      /* ---------- تشخیص وضعیت ورود ----------
         مسیر سریع: کوکیِ نشانه (t_in) که موقع ورود ست می‌شود؛ بدون انتظار برای شبکه.
         بعد پاسخ واقعی /api/me می‌رسد و اگر لازم بود تصمیم اصلاح می‌شود. */
      function boot() {
        /* مهم: دیگر با کوکی حدس نمی‌زنیم. تا پاسخ واقعی /api/me فقط لودر دیده می‌شود؛
           به این شکل صفحهٔ ورود قدیمیِ داخل باندل React بعد از ورود چشمک نمی‌زند. */
        var req = window.__meReq || fetch(API + "/me", { credentials: "include", cache: "no-store" })
          .then(function (r) { return { status: r.status, ct: r.headers.get("content-type") || "" }; })
          .catch(function () { return { status: 0, ct: "" }; });

        req.then(function (r) {
          if (r.status === 200) { settled = true; showApp(); return; }
          if (r.status === 0 || r.ct.indexOf("application/json") === -1) {
            if (!settled) showLogin("ارتباط با سرور برقرار نشد؛ یک لحظه دیگر دوباره امتحان کن.");
            return;
          }
          settled = true;
          showLogin("");
        });
      }
      boot();

      /* اگر داخل اپ خروج زد و به /login رفت، دوباره همین پنل را نشان بده.
         نکته: موقع بالا آمدن، خود اپ یک لحظه به /login می‌رود؛ پس قبل از نشان دادن
         پنل، حتماً از سرور می‌پرسیم که واقعاً لاگ‌اوت شده یا نه. */
      function watchLogout() {
        var checking = false, timer = null;
        function check() {
          var p = location.pathname;
          if (p !== "/login" && p !== "/register") return;
          if (checking) return;
          checking = true;
          clearTimeout(timer);
          timer = setTimeout(function () {
            fetch(API + "/me", { credentials: "include", cache: "no-store" })
              .then(function (r) {
                checking = false;
                if (r.status === 200) return; // هنوز لاگین است → اپ فقط داشت بالا می‌آمد
                root.style.display = "none";
                overlay.classList.add("show");
              })
              .catch(function () { checking = false; });
          }, 400);
        }
        ["pushState", "replaceState"].forEach(function (m) {
          var orig = history[m];
          history[m] = function () { var r = orig.apply(this, arguments); setTimeout(check, 0); return r; };
        });
        window.addEventListener("popstate", function () { setTimeout(check, 0); });
      }
      watchLogout();

      /* ---------- flip ---------- */
      var flipped   = false;
      var slider    = document.getElementById("flipSlider");
      var inner     = document.getElementById("flipInner");
      var sideLogin = document.getElementById("sideLogin");
      var sideSignup= document.getElementById("sideSignup");

      function setFlip(on) {
        flipped = on;
        inner.classList.toggle("flipped", on);
        slider.classList.toggle("on", on);
        sideLogin.classList.toggle("active", !on);
        sideSignup.classList.toggle("active", on);
      }
      slider.addEventListener("click", function () { setFlip(!flipped); });
      sideLogin.addEventListener("click", function () { setFlip(false); });
      sideSignup.addEventListener("click", function () { setFlip(true); });

      /* بعد از ورود، همان صفحه‌ای که کاربر خواسته باز شود (مثلاً پنل ادمین) */
      function afterAuth() {
        var target = location.pathname;
        if (target === "/login" || target === "/register") target = "/";
        location.replace(target + location.search);
      }

      /* ---------- ورود ---------- */
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var username = document.getElementById("loginUsername").value.trim();
        var password = document.getElementById("loginPassword").value;
        if (!username || !password) { showMsg(loginMsg, "نام کاربری و رمز را وارد کن", "error"); return; }
        var btn = this.querySelector("button");
        btn.disabled = true; hideMsg(loginMsg);
        fetch(API + "/auth/login", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(readJson)
          .then(function (r) {
            btn.disabled = false;
            if (r.ok && r.d.user) { showMsg(loginMsg, "Welcome back!", "ok"); afterAuth(); }
            else showMsg(loginMsg, errText(r), "error");
          })
          .catch(function (err) {
            btn.disabled = false;
            showMsg(loginMsg, err && err.message === "no-api"
              ? "\u0633\u0631\u0648\u0631 \u0627\u0644\u0627\u0646 \u062c\u0648\u0627\u0628 \u0646\u0645\u06cc\u200c\u062f\u0647\u062f\u061b \u0686\u0646\u062f \u0644\u062d\u0638\u0647 \u0628\u0639\u062f \u062f\u0648\u0628\u0627\u0631\u0647 \u0627\u0645\u062a\u062d\u0627\u0646 \u06a9\u0646"
              : "Connection error", "error");
          });
      });

      /* ---------- ثبت‌نام ---------- */
      document.getElementById("signupForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var name     = document.getElementById("signupName").value.trim();
        var username = document.getElementById("signupUsername").value.trim();
        var password = document.getElementById("signupPassword").value;
        if (!name || !username || !password) { showMsg(signupMsg, "Name, username and password are required", "error"); return; }
        if (!/^[a-zA-Z][a-zA-Z0-9_]{2,19}$/.test(username)) {
          showMsg(signupMsg, "Username: 3–20 chars, letters/numbers/_ , must start with a letter", "error"); return;
        }
        if (password.length < 6) { showMsg(signupMsg, "Password must be at least 6 characters", "error"); return; }
        var btn = this.querySelector("button");
        btn.disabled = true; hideMsg(signupMsg);
        fetch(API + "/auth/register", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password, displayName: name })
        })
          .then(readJson)
          .then(function (r) {
            btn.disabled = false;
            if (r.ok && r.d.user) { showMsg(signupMsg, "Account created!", "ok"); afterAuth(); }
            else showMsg(signupMsg, errText(r), "error");
          })
          .catch(function (err) {
            btn.disabled = false;
            showMsg(signupMsg, err && err.message === "no-api"
              ? "\u0633\u0631\u0648\u0631 \u0627\u0644\u0627\u0646 \u062c\u0648\u0627\u0628 \u0646\u0645\u06cc\u200c\u062f\u0647\u062f\u061b \u0686\u0646\u062f \u0644\u062d\u0638\u0647 \u0628\u0639\u062f \u062f\u0648\u0628\u0627\u0631\u0647 \u0627\u0645\u062a\u062d\u0627\u0646 \u06a9\u0646"
              : "Connection error", "error");
          });
      });
    })();
    </script>

          aiF.state.innerHTML = pill + " " + extra +
            (st.lastErr ? '<br><span style="color:#ff9d9d">آخرین خطا: ' + String(st.lastErr).replace(/</g, "&lt;") + "</span>" : "");
        }).catch(function (e) { aiF.state.textContent = "خطا در گرفتن تنظیمات: " + e.message; });
      }
      function aiPayload() {
        var p = {
          on: !!aiF.on.checked,
          model: aiF.model.value,
          temp: Number(aiF.temp.value),
          maxTokens: Number(aiF.maxTokens.value),
          hist: Number(aiF.hist.value),
          daily: Number(aiF.daily.value),
          pauseMin: Number(aiF.pauseMin.value),
          prompt: aiF.prompt.value,
          kb: aiF.kb.value,
          base: aiF.base.value,
          extModel: aiF.extModel.value
        };
        if (aiF.key.value && aiF.key.value !== "••••••") p.key = aiF.key.value;
        return p;
      }
      function loadMod() {
        api("/admin/mod").then(function (d) {
          aiF.modOn.checked = !!d.on;
          aiF.modAi.checked = !!d.ai;
          aiF.modAction.value = d.action || "report";
          aiF.modThreshold.value = d.threshold;
          aiF.modMuteAfter.value = d.muteAfter;
          aiF.modMuteMin.value = d.muteMin;
          aiF.sttDaily.value = d.sttDaily;
          aiF.modToday.value = fa(d.today || 0) + " مورد";
          aiF.tsOn.checked = !!d.turnstileOn;
          aiF.tsSite.value = d.turnstileSite || "";
          aiF.tsSecret.value = d.turnstileSecret ? "••••••" : "";
          aiF.flags.textContent = "";
          if (!(d.flags || []).length) aiF.flags.textContent = "چیزی پرچم نخورده ✅";
          (d.flags || []).slice(0, 20).forEach(function (f) {

            row.style.cssText = "font-size:11.5px;line-height:1.9;color:var(--mute,#8d95a8)";
            aiF.flags.appendChild(row);

        api("/admin/security").then(function (d) {

          bits.push(d.turnstile ? '<span class="tsai-pill ok">Turnstile روشن</span>' : '<span class="tsai-pill no">Turnstile خاموش</span>');
          bits.push('<span class="tsai-pill ' + (d.legacyPasswords ? "no" : "ok") + '">رمزهای قدیمی: ' + fa(d.legacyPasswords) + "</span>");
          bits.push('<span class="tsai-pill ok">نشست فعال: ' + fa(d.activeSessions) + "</span>");
          if ((d.locked || []).length) bits.push('<span class="tsai-pill no">قفل‌شده: ' + fa(d.locked.length) + "</span>");
          aiF.secState.innerHTML = bits.join(" ");
        }).catch(function () {});
      }
      function modSave() {
        var p = {
          on: !!aiF.modOn.checked, ai: !!aiF.modAi.checked, action: aiF.modAction.value,
          threshold: Number(aiF.modThreshold.value), muteAfter: Number(aiF.modMuteAfter.value),
          muteMin: Number(aiF.modMuteMin.value), sttDaily: Number(aiF.sttDaily.value),

      function aiSave() {

        api("/admin/ai", {

        }).then(function () { return modSave(); }).then(function () {

      function aiReset(what) {

        }).then(function (d) {

      /* ---------- سفارش‌های پرداخت ---------- */
      var payWrap = null, payF = {}, payTab = "review";

      function buildPay() {
        if (payWrap) return payWrap;
        payWrap = el("div"); payWrap.id = "tordWrap";

      }
      function openPay() {
        buildPay().classList.add("on");
        loadOrders();
        api("/admin/pay").then(function (d) {
          payF.on.checked = !!d.on;
          payF.card.value = d.card || "";
          payF.holder.value = d.holder || "";
          payF.note.value = d.note || "";
          payF.windowMin.value = d.windowMin;
          payF.plans.value = d.plansJson || "";
          payF.stat.innerHTML = '<span class="tsai-pill ' + (d.on && d.card ? "ok" : "no") + '">' +
            (d.on && d.card ? "فروش باز است" : "فروش بسته یا شمارهٔ کارت خالی است") + "</span> " +
            "درآمد ۳۰ روز اخیر: " + fa(d.month.totalText) + " تومان از " + fa(d.month.count) + " سفارش";
        }).catch(function (e) { payF.stat.textContent = "خطا: " + e.message; });
      }
      function loadOrders() {
        if (!payF.list) return;
        [].forEach.call(payF.tabs.children, function (b) {
          b.className = "tsup-btn" + (b.dataset.tab === payTab ? " gold" : "");
        });
        payF.list.textContent = "در حال گرفتن…";
        api("/admin/orders?status=" + payTab).then(function (d) {
          payF.list.textContent = "";
          if (!(d.orders || []).length) { payF.list.appendChild(el("div", "tsup-empty", "چیزی اینجا نیست.")); return; }
          d.orders.forEach(function (o) { payF.list.appendChild(orderCard(o)); });

      }
      function orderCard(o) {
        var card = el("div");
        card.style.cssText = "display:flex;gap:12px;align-items:flex-start;background:var(--bg2,#111420);" +
          "border:1px solid var(--line,rgba(120,140,255,.18));border-radius:12px;padding:11px 13px";
        if (o.hasReceipt) {
          var a = document.createElement("a");
          a.href = "/api/admin/orders/" + o.id + "/receipt";
          a.target = "_blank"; a.rel = "noreferrer";

          im.src = "/api/admin/orders/" + o.id + "/receipt";
          im.style.cssText = "width:86px;height:86px;object-fit:cover;border-radius:10px;display:block;background:#0b1020";
          a.appendChild(im); card.appendChild(a);
        }
        var mid = el("div"); mid.style.cssText = "flex:1;min-width:0";
        var t = el("div", null, "@" + (o.username || "?") + " · " + (o.displayName || ""));
        t.style.cssText = "font-size:13.5px;font-weight:600";
        mid.appendChild(t);
        var m = el("div", null, fa(o.amountText) + " تومان · " + (o.planTitle || o.plan) + " · " + fa(o.days) + " روز");
        m.style.cssText = "font-size:12.5px;color:#8fc3ff;margin-top:3px";
        mid.appendChild(m);
        var when = el("div", null, new Date(o.createdAt).toLocaleString("fa-IR") + " · وضعیت: " + statusFa(o.status) +
          (o.adminNote ? " · " + o.adminNote : ""));

        if (o.status === "review" || o.status === "open") {

          var ok = el("button", "tsup-btn gold", "تأیید");

            api("/admin/orders/" + o.id + "/ok", { method: "POST" }).then(function (d) {
              if (d.error) { toast(d.error); ok.disabled = false; return; }

            });

          no.addEventListener("click", function () {

            if (why === null) return;
            api("/admin/orders/" + o.id + "/no", {
              method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ reason: why })
            }).then(function () { toast("رد شد"); loadOrders(); loadOrdCount(); });

      function statusFa(s) {

      }
      function savePay() {

        api("/admin/pay", {
          method: "PATCH", headers: { "content-type": "application/json" },
          body: JSON.stringify({
            on: !!payF.on.checked, card: payF.card.value, holder: payF.holder.value,
            note: payF.note.value, windowMin: Number(payF.windowMin.value), plansJson: payF.plans.value
          })
        }).then(function (d) {
          payF.save.disabled = false;
          payF.err.textContent = d.error ? "خطا: " + d.error : "ذخیره شد ✅";
          if (!d.error) openPay();
        }).catch(function (e) { payF.save.disabled = false; payF.err.textContent = e.message; });
      }

      /* ---------- تزریق تب داخل ریل پنل ادمین ---------- */
      var ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">' +
        '<path d="M4 13v-1a8 8 0 0 1 16 0v1"></path>' +
        '<path d="M4 13h2.4a1 1 0 0 1 1 1v3.4a1 1 0 0 1-1 1H5.6A1.6 1.6 0 0 1 4 16.8Z"></path>' +
        '<path d="M20 13h-2.4a1 1 0 0 0-1 1v3.4a1 1 0 0 0 1 1h.8a1.6 1.6 0 0 0 1.6-1.6Z"></path>' +
        '<path d="M18 18.4v.6a2.5 2.5 0 0 1-2.5 2.5H13"></path></svg>';

      var ORD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">' +
        '<rect x="2.5" y="5" width="19" height="14" rx="2.5"></rect>' +
        '<path d="M2.5 9.5h19"></path><path d="M6 14.5h4"></path></svg>';
      var ordTabBtn = null, ordBadgeEl = null, ordTimer = null;

      function injectOrdTab(nav) {
        if (ordTabBtn && nav.contains(ordTabBtn)) return;
        ordTabBtn = document.createElement("button");
        ordTabBtn.type = "button";
        ordTabBtn.className = "admin-tab";
        ordTabBtn.title = "سفارش‌های پرمیوم";
        ordTabBtn.setAttribute("data-t-orders", "1");
        var ico = el("span", "admin-tab-ico");
        ico.innerHTML = ORD_ICON;
        ordTabBtn.appendChild(ico);
        ordTabBtn.appendChild(el("em", null, "سفارش‌ها"));
        ordBadgeEl = el("span", "tsup-badge");
        ordTabBtn.appendChild(ordBadgeEl);
        nav.appendChild(ordTabBtn);
        loadOrdCount();
        clearInterval(ordTimer);
        ordTimer = setInterval(function () { if (onAdmin()) loadOrdCount(); }, 30000);
      }
      function loadOrdCount() {
        api("/admin/orders?status=review").then(function (d) {
          var n = (d.orders || []).length;
          if (!ordBadgeEl) return;
          ordBadgeEl.textContent = n > 99 ? "۹۹+" : fa(n);
          ordBadgeEl.classList.toggle("on", n > 0);
        }).catch(function () {});
      }
      window.__tOrdRefresh = loadOrdCount;

      function injectTab() {
        if (!onAdmin()) return;
        var nav = document.querySelector(".admin-rail nav");
        if (!nav) return;
        injectOrdTab(nav);
        if (tabBtn && nav.contains(tabBtn)) return;
        tabBtn = document.createElement("button");
        tabBtn.type = "button";
        tabBtn.className = "admin-tab" + (open ? " on" : "");
        tabBtn.title = "پشتیبانی";
        tabBtn.setAttribute("data-t-support", "1");
        var ico = el("span", "admin-tab-ico");
        ico.innerHTML = ICON;
        tabBtn.appendChild(ico);
        tabBtn.appendChild(el("em", null, "پشتیبانی"));
        badgeEl = el("span", "tsup-badge");
        tabBtn.appendChild(badgeEl);
        nav.appendChild(tabBtn);
        loadList(false);
      }

      /* کلیک‌ها به‌صورت delegation — حتی اگر React ریل را دوباره بسازد کار می‌کند */
      document.addEventListener("click", function (e) {
        if (!e.target || !e.target.closest) return;
        var ord = e.target.closest("[data-t-orders]");
        if (ord) {
          e.preventDefault(); e.stopPropagation();
          ordTabBtn = ord;
          ordBadgeEl = ord.querySelector(".tsup-badge");
          openPay();
          return;
        }
        var mine = e.target.closest("[data-t-support]");
        if (mine) {
          e.preventDefault(); e.stopPropagation();
          tabBtn = mine;
          badgeEl = mine.querySelector(".tsup-badge");
          if (open) closePanel(); else openPanel();
          return;
        }
        if (e.target.closest(".admin-tab") && open) closePanel();
      }, true);

      var mo = new MutationObserver(function () {
        if (!onAdmin()) { if (open) closePanel(); tabBtn = null; badgeEl = null; return; }
        injectTab();
      });
      function start() {
        mo.observe(document.body, { childList: true, subtree: true });
        injectTab();
        clearInterval(pollTimer);
        pollTimer = setInterval(function () {
          if (onAdmin() && !open) loadList(false);
        }, 30000);
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
      else start();
    })();
    </script>

    <script>
    (function () {
      "use strict";
      /* دکمه‌های آپلود و ورودی‌ها را بدون دست‌زدن به ساختار React بهبود می‌دهد */

      var FOLDER =
        '<div class="folder">' +
          '<div class="front-side"><div class="tip"></div><div class="cover"></div></div>' +
          '<div class="back-side cover"></div>' +
        '</div>';

      function label(inp) {
        var f = inp.files && inp.files[0];
        if (f) return f.name.length > 26 ? f.name.slice(0, 23) + "…" : f.name;
        var acc = (inp.getAttribute("accept") || "");
        if (acc.indexOf("apk") > -1) return "انتخاب فایل APK";
        if (acc.indexOf("image") > -1) return "انتخاب عکس";
        return "انتخاب فایل";
      }

      function makeCard(inp) {
        var card = document.createElement("div");
        card.className = "t-upload";
        card.setAttribute("data-t-upload", "1");
        card.innerHTML = FOLDER + '<span class="custom-file-upload"></span>';
        card.querySelector(".custom-file-upload").textContent = label(inp);
        card.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          inp.click();
        });
        inp.addEventListener("change", function () {
          var t = card.querySelector(".custom-file-upload");
          if (t) t.textContent = label(inp);
        });
        return card;
      }

      function enhance() {
        /* ۱) فایل‌های پنل ادمین */
        var files = document.querySelectorAll('.admin input[type="file"]:not(.t-av-input)');
        for (var i = 0; i < files.length; i++) {
          var inp = files[i];
          if (inp.closest("table")) continue;          /* ورودی‌های آواتار داخل جدول کارت نمی‌گیرند */
          var next = inp.nextElementSibling;
          if (next && next.getAttribute && next.getAttribute("data-t-upload")) {
            if (!inp.classList.contains("t-file-native")) inp.classList.add("t-file-native");
            continue;
          }
          inp.classList.add("t-file-native");
          inp.insertAdjacentElement("afterend", makeCard(inp));
        }
        /* کارت‌های یتیم (اگر React ورودی را برداشت) پاک شوند */
        var cards = document.querySelectorAll("[data-t-upload]");
        for (var k = 0; k < cards.length; k++) {
          var prev = cards[k].previousElementSibling;
          if (!prev || prev.tagName !== "INPUT" || prev.type !== "file") cards[k].remove();
        }
        /* ۲) گیرهٔ کاغذ چت → پوشه */
        var clips = document.querySelectorAll('.composer .tool[title="عکس یا فیلم"]');
        for (var j = 0; j < clips.length; j++) {
          if (!clips[j].classList.contains("t-clip")) clips[j].classList.add("t-clip");
        }
      }

      var t = null;
      function schedule() {
        if (t) return;
        t = setTimeout(function () { t = null; try { enhance(); } catch (e) {} }, 200);
      }
      function start() {
        enhance();
        new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
      else start();
    })();
    </script>

    <script>
    (function () {
      "use strict";

      /* ================= ۱) منوی پیام: داخل کادر بماند ================= */
      function fitMenu(menu) {
        try {
          menu.style.transform = "";
          menu.style.top = "";
          menu.style.bottom = "";
          var pad = 8;
          var r = menu.getBoundingClientRect();
          var dx = 0;
          if (r.right > window.innerWidth - pad) dx = window.innerWidth - pad - r.right;
          if (r.left + dx < pad) dx = pad - r.left;
          if (dx) menu.style.transform = "translateX(" + Math.round(dx) + "px)";
          var r2 = menu.getBoundingClientRect();
          if (r2.bottom > window.innerHeight - pad && r2.height < window.innerHeight - 40) {
            menu.style.top = "auto";
            menu.style.bottom = "100%";
          }
        } catch (e) {}
      }

    <script>
    (function () {

      var convCache = {};              /* id -> "bot" | "human" */
      var CACHE_KEY = "t_conv_kinds";
      try {
        var saved = sessionStorage.getItem(CACHE_KEY);
        if (saved) convCache = JSON.parse(saved) || {};
      } catch (e) {}
      function remember(id, kind) {
        convCache[id] = kind;
        try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(convCache)); } catch (e) {}
      }

      /* یک‌بار همهٔ گفتگوها را می‌گیریم تا موقع سوئیچ هیچ تأخیری نباشد */
      var preloaded = false, preloading = false;
      function preloadKinds() {
        if (preloaded || preloading) return;
        preloading = true;
        fetch("/api/conversations", { credentials: "include", cache: "no-store" })
          .then(function (r) {
            if (!r.ok) throw new Error("no");
            return r.json();
          })
          .then(function (d) {
            (d.conversations || []).forEach(function (c) {
              var peer = c.peer || {};
              remember(c.id, String(peer.id || "").indexOf("bot_") === 0 ? "bot" : "human");
            });
            preloaded = true; preloading = false;
            decorateChat();
          })
          .catch(function () {
            preloading = false;                 /* هنوز لاگین نشده؛ دفعهٔ بعد دوباره */
          });
      }

      function convIdFromUrl() {
        var m = /^\/c\/([^/?#]+)/.exec(location.pathname);
        return m ? m[1] : null;
      }

        var bg = pane.querySelector(":scope > .t-chatbg");
        if (bg && bg.dataset.kind === kind) return;
        if (bg) bg.remove();
        bg = document.createElement("div");
        bg.className = "t-chatbg";
        bg.dataset.kind = kind;
        bg.innerHTML = kind === "bot"
          ? '<div class="container"></div>'
          : '<div class="island"></div><div class="islandt"></div>';
        pane.insertBefore(bg, pane.firstChild);
      }

      function decorateChat() {
        var pane = document.querySelector(".chat-pane");
        if (!pane) return;
        var id = convIdFromUrl();
        if (!id) {
          var old = pane.querySelector(":scope > .t-chatbg");
          if (old) old.remove();
          return;
        }
        var kind = convCache[id];
        if (kind) { applyBg(pane, kind); return; }
        preloadKinds();
        if (pending[id]) return;
        pending[id] = 1;
        fetch("/api/conversations/" + encodeURIComponent(id), { credentials: "include", cache: "no-store" })

            var conv = d && d.conversation;
            var peer = conv && conv.peer;
            var isBot = !!(peer && String(peer.id || "").indexOf("bot_") === 0);

            var pane2 = document.querySelector(".chat-pane");

            img.onload = function () {

    <script>
    (function () {
      "use strict";

      /* ---------- نگاشت blob ← شناسهٔ رسانه (برای ویس) ---------- */
      var mediaOfBlob = new WeakMap();
      var urlToMedia = new Map();
      window.__tTagBlob = function (blob, id) { try { mediaOfBlob.set(blob, id); } catch (e) {} };
      window.__tMediaOfUrl = function (u) { return urlToMedia.get(u) || ""; };
      try {
        var origCOU = URL.createObjectURL.bind(URL);
        URL.createObjectURL = function (obj) {
          var u = origCOU(obj);
          try { var id = mediaOfBlob.get(obj); if (id) urlToMedia.set(u, id); } catch (e) {}
          return u;
        };
      } catch (e) {}

      function el(tag, cls, txt) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;

      function api(path, body) {
        return fetch("/api" + path, {

        var box = el("div", "t-stt-text" + (err ? " err" : ""));
        box.appendChild(el("span", "lbl", err ? "تبدیل نشد" : "متن ویس"));

        host.parentElement.appendChild(box);
      }
      function runStt(voice, btn) {
        var a = voice.querySelector("audio");
        var src = a ? a.src || "" : "";
        var id = window.__tMediaOfUrl(src);
        if (!id) { var m = src.match(/\/api\/media\/([A-Za-z0-9_-]+)/); if (m) id = m[1]; }
        if (!id) { sttBox(voice, "این ویس هنوز دانلود نشده؛ یک بار پخشش کن بعد دوباره بزن.", true); return; }
        btn.disabled = true; btn.textContent = "…";
        api("/media/" + encodeURIComponent(id) + "/transcribe", {})
          .then(function (d) {
            btn.disabled = false; btn.textContent = "متن";
            if (d.error) return sttBox(voice, d.error, true);
            sttBox(voice, d.text || "چیزی شنیده نشد.", !d.text);

          .catch(function (e) { btn.disabled = false; btn.textContent = "متن"; sttBox(voice, e.message, true); });
      }

      /* ---------- ترجمه ---------- */
      var LANGS = [["fa", "فارسی"], ["en", "English"], ["ar", "العربية"], ["tr", "Türkçe"], ["he", "עברית"], ["ru", "Русский"]];
      var menu = null;

        if (menu && !menu.contains(e.target) && !(e.target.classList && e.target.classList.contains("t-tr-btn"))) closeMenu();
      }, true);
      function openLangMenu(btn, bubble) {
        closeMenu();
        menu = el("div", "t-lang-menu");
        LANGS.forEach(function (l) {
          var b = el("button", null, l[1]);
          b.type = "button";
          b.addEventListener("click", function (e) {
            e.preventDefault(); e.stopPropagation();
            closeMenu(); runTr(bubble, btn, l[0], l[1]);
          });
          menu.appendChild(b);
        });
        document.body.appendChild(menu);
        var r = btn.getBoundingClientRect();
        var w = menu.offsetWidth, h = menu.offsetHeight;
        var left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left - w / 2 + r.width / 2));
        var top = r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8;
        menu.style.left = left + "px";
        menu.style.top = top + "px";

          v.appendChild(b);

        document.querySelectorAll(".bubble .foot:not([data-ttr])").forEach(function (f) {
          var bub = f.closest(".bubble");
          if (!bub || !bub.querySelector(".txt")) return;
          var txt = bub.querySelector(".txt").innerText.trim();

            '<path d="M12 3c2.6 2.9 2.6 15.1 0 18"></path><path d="M12 3c-2.6 2.9-2.6 15.1 0 18"></path></svg>';
          b.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); openLangMenu(b, bub); });
          f.appendChild(b);

      setInterval(scan, 700);
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", scan);
      else scan();

      /* ---------- تأیید امنیتی Turnstile ---------- */
      var tsKey = "";
      window.__tsToken = "";
      fetch("/api/site", { credentials: "include" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          tsKey = (d && d.site && d.site.turnstile) || "";
          if (!tsKey) return;
          window.__tTsInit = function () { mountTs(); setInterval(mountTs, 1500); };
          var s = document.createElement("script");
          s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__tTsInit";
          s.async = true; s.defer = true;
          document.head.appendChild(s);
        })
        .catch(function () {});
      function mountTs() {
        if (!tsKey || !window.turnstile) return;
        if (document.getElementById("tTsBox")) return;
        var card = document.querySelector(".auth-card") || document.querySelector(".auth");
        if (!card) return;
        var box = el("div"); box.id = "tTsBox";
        card.appendChild(box);

          window.turnstile.render(box, {
            sitekey: tsKey, theme: "dark", language: "fa",
            callback: function (t) { window.__tsToken = t; }

        } catch (e) {}
      }
    })();
    </script>

        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js", { scope: "/" })
            .then(function (reg) { swReg = reg; maybeAskPush(); })
            .catch(function () {});
        });
      }

      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredInstall = e;
        if (!localStorage.getItem("t_install_dismissed")) showNudge("install");
      });
      window.addEventListener("appinstalled", function () {
        deferredInstall = null;
        hideNudge();
        localStorage.setItem("t_install_dismissed", "1");
      });

      /* ---------- نوار پیشنهاد ---------- */
      var nudge = null;
      function buildNudge() {
        if (nudge) return nudge;
        nudge = document.createElement("div");
        nudge.className = "t-nudge";
        nudge.innerHTML =
          '<span class="ico"></span><p></p>' +
          '<button class="yes" type="button"></button>' +
          '<button class="no" type="button">بعداً</button>';
        nudge.querySelector(".no").addEventListener("click", function () {
          localStorage.setItem(nudge.dataset.kind === "push" ? "t_push_dismissed" : "t_install_dismissed", "1");
          hideNudge();
        });
        nudge.querySelector(".yes").addEventListener("click", function () {
          var kind = nudge.dataset.kind;
          hideNudge();
          if (kind === "install" && deferredInstall) {
            deferredInstall.prompt();
            deferredInstall.userChoice.finally(function () { deferredInstall = null; });
          } else if (kind === "push") {
            askPush();
          }
        });
        document.body.appendChild(nudge);
        return nudge;
      }
      function showNudge(kind) {
        var n = buildNudge();
        n.dataset.kind = kind;
        n.querySelector("p").innerHTML = kind === "install"
          ? "<b>T</b> را روی گوشی‌ات نصب کن — سریع‌تر باز می‌شود و نوتیف می‌دهد."
          : "روشن کردن <b>نوتیفیکیشن</b> تا پیام‌های تازه را از دست ندهی.";
        n.querySelector(".yes").textContent = kind === "install" ? "نصب" : "روشن کن";
        n.classList.add("show");
      }
      function hideNudge() { if (nudge) nudge.classList.remove("show"); }

      /* ---------- نوتیفیکیشن ---------- */
      function loggedIn() { return document.cookie.indexOf("t_in=1") > -1; }

      function maybeAskPush() {
        if (!("Notification" in window) || !swReg || !swReg.pushManager) return;
        if (!loggedIn()) return;
        if (Notification.permission === "granted") { subscribePush(); return; }
        if (Notification.permission === "denied") return;
        if (localStorage.getItem("t_push_dismissed")) return;
        setTimeout(function () { if (loggedIn()) showNudge("push"); }, 6000);
      }

      function askPush() {
        if (!("Notification" in window)) return;
        Notification.requestPermission().then(function (p) {
          if (p === "granted") subscribePush();
        });
      }

      function subscribePush() {
        if (!swReg || !swReg.pushManager || !loggedIn()) return;
        swReg.pushManager.getSubscription().then(function (sub) {
          if (sub) return sub;
          return swReg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlB64ToUint8(VAPID)
          });
        }).then(function (sub) {
          if (!sub) return;
          var raw = sub.toJSON();
          return fetch("/api/push/subscribe", {
            method: "POST", credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ endpoint: raw.endpoint, keys: raw.keys })
          });
        }).catch(function () {});
      }
      window.__tPushSubscribe = subscribePush;
      window.__tPushAsk = askPush;
      window.__tInstall = function () {
        if (deferredInstall) { deferredInstall.prompt(); return true; }
        return false;
      };

      /* بعد از ورود، اشتراک را بساز */
      var seen = loggedIn();
      setInterval(function () {
        var now = loggedIn();
        if (now && !seen) { seen = true; maybeAskPush(); }
        if (!now) seen = false;
      }, 4000);

      /* ------- حباب «در حال نوشتن» برای ربات پشتیبانی ------- */
      (function () {
        var TYPING = [];
        window.__tSetTyping = function (list) { TYPING = Array.isArray(list) ? list : []; };

        var css = document.createElement("style");
        css.textContent =
          ".t-typing-row{display:flex;direction:ltr;justify-content:flex-start;padding:2px 4px 8px;}" +
          ".t-typing-bub{display:inline-flex;gap:5px;align-items:center;padding:11px 14px;border-radius:16px;" +
            "border-start-start-radius:6px;background:var(--bg2,#111420);border:1px solid var(--line,rgba(120,140,255,.18));}" +
          ".t-typing-bub span{width:7px;height:7px;border-radius:50%;background:var(--gold2,#4c8dff);opacity:.35;" +
            "animation:tTypingDot 1.1s infinite ease-in-out;}" +
          ".t-typing-bub span:nth-child(2){animation-delay:.16s}" +
          ".t-typing-bub span:nth-child(3){animation-delay:.32s}" +
          "@keyframes tTypingDot{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}";
        (document.head || document.documentElement).appendChild(css);

        function openConv() {
          var m = location.pathname.match(/^\/c\/([^/?#]+)/);
          return m ? m[1] : "";
        }
        function tick() {
          var id = openConv();
          var box = document.querySelector(".msgs");
          var node = document.getElementById("tTypingRow");
          var on = !!(id && box && TYPING.some(function (t) {
            return String(t.conversationId || t.conversation_id || "") === id;
          }));
          if (!on) { if (node) node.parentNode.removeChild(node); return; }
          if (!node) {
            node = document.createElement("div");
            node.id = "tTypingRow";
            node.className = "t-typing-row";
            node.innerHTML = "<div class='t-typing-bub'><span></span><span></span><span></span></div>";
          }
          if (node.parentElement !== box) {
            box.appendChild(node);
            try { box.scrollTop = box.scrollHeight; } catch (e) {}
          } else if (box.lastElementChild !== node) {
            box.appendChild(node);
          }
        }
        setInterval(tick, 300);
      })();

      /* ------- سرعت: پولینگ هوشمند /api/sync + حالت داغ بعد از ارسال پیام ------- */
      (function () {
        var origFetch = window.fetch;
        var lastSync = 0, hotUntil = 0;
        var lastCursor = null, lastTyping = [];
        var HOT_MS = 30000;      /* تا ۳۰ ثانیه بعد از ارسال، هیچ خفه‌کنندهٔ سرعتی نداریم */

        window.__tHot = function (ms) { hotUntil = Date.now() + (ms || HOT_MS); };

        function skipRes() {
          /* 🔴 مهم: باید همان cursor قبلی برگردد؛ وگرنه اپ نشانگرش را گم می‌کند
             و تا رفرش‌شدن صفحه دیگر پیام تازه نمی‌گیرد */
          return new Response(JSON.stringify({
            cursor: lastCursor,
            events: [], messages: [], conversations: [],
            typing: lastTyping, presence: [], blasts: [], gone: [],
            serverTime: Date.now(), skipped: true
          }), { status: 200, headers: { "Content-Type": "application/json" } });
        }

        window.fetch = function (input, init) {
          try {
            var url = typeof input === "string" ? input : (input && input.url) || "";
            var m = ((init && init.method) || (input && input.method) || "GET").toUpperCase();

            /* ارسال پیام/ری‌اکشن/تایپ → یعنی کاربر منتظر جواب است */
            if (m !== "GET" && /\/api\/(conversations\/[^/]+\/messages|messages\/|typing)/.test(url)) {
              hotUntil = Date.now() + HOT_MS;
            }

            /* برچسب‌زدن رسانه‌ها تا بشود ویس را به متن تبدیل کرد */
            var mm = url.match(/\/api\/media\/([A-Za-z0-9_-]+)/);
            if (mm && m === "GET") {
              return origFetch.apply(this, arguments).then(function (r) {
                try {
                  var ob = r.blob.bind(r);
                  r.blob = function () {
                    return ob().then(function (b) {
                      if (window.__tTagBlob) window.__tTagBlob(b, mm[1]);
                      return b;
                    });
                  };
                } catch (e) {}
                return r;
              });
            }

            /* توکن تأیید امنیتی را به ورود/ثبت‌نام اضافه کن */
            if (m === "POST" && /\/api\/auth\/(login|register)/.test(url) && window.__tsToken && init && typeof init.body === "string") {
              try {
                var payload = JSON.parse(init.body);
                if (payload && typeof payload === "object" && !payload.turnstileToken) {
                  payload.turnstileToken = window.__tsToken;
                  init = Object.assign({}, init, { body: JSON.stringify(payload) });
                  return origFetch.call(this, input, init);
                }
              } catch (e) {}
            }

            if (url.indexOf("/api/sync") > -1) {
              var now = Date.now();
              var hot = now < hotUntil;
              /* پنهان: ۱۵ ثانیه · داغ: بدون محدودیت (۴۰۰ms خود اپ) · عادی: ۹۰۰ms */
              var gap = document.hidden ? (hot ? 3000 : 15000) : (hot ? 0 : 900);
              if (gap && lastCursor !== null && now - lastSync < gap) {
                return Promise.resolve(skipRes());
              }
              lastSync = now;
              return origFetch.apply(this, arguments).then(function (r) {
                try {
                  r.clone().json().then(function (d) {
                    if (!d) return;
                    if (d.cursor !== undefined && d.cursor !== null) lastCursor = d.cursor;
                    if (Array.isArray(d.typing)) lastTyping = d.typing;
                    if (window.__tSetTyping) window.__tSetTyping(lastTyping);
                    /* پیام یا «در حال نوشتن» تازه → چند ثانیه سریع بمان */
                    if ((d.messages && d.messages.length) || (d.typing && d.typing.length)) {
                      hotUntil = Date.now() + 12000;
                    }
                  }).catch(function () {});
                } catch (e) {}
                return r;
              });
            }
          } catch (e) {}
          return origFetch.apply(this, arguments);
        };
      })();
    })();
    </script>
  </body>
</html>
