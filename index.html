    <style>
      /* ===== پنل ورود flip-card — تم تیره ===== */
      :root {
        --lg-bg:#0d0f14; --lg-card:#1b1f28; --lg-card2:#151922; --lg-border:#333a48;
        --lg-input:#232936; --lg-text:#f2f3f5; --lg-sub:#9aa0a6; --lg-gold:#d4a84b; --lg-gold2:#e0b84d;
      }
      /* قد واقعی صفحه روی موبایل (نوار مرورگر) */
      @supports (height: 100dvh) { :root { --app-h: 100dvh; } }

      html, body { height: 100%; }
      #loginOverlay {
        position: fixed; inset: 0; z-index: 99999;
        background: radial-gradient(1000px 700px at 50% -20%, #1a1e27 0%, var(--lg-bg) 60%, #07080b 100%);
        display: none; align-items: center; justify-content: center;
        padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
        box-sizing: border-box; overflow-y: auto; -webkit-overflow-scrolling: touch;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, sans-serif;
      }
      #loginOverlay.show { display: flex; }
      .auth-box { display: flex; flex-direction: column; align-items: center; gap: 20px; margin: auto; width: 100%; max-width: 340px; }
      .switch-row { display: flex; align-items: center; justify-content: center; gap: 18px; }
      .switch-row .side { font-size: 15px; font-weight: 600; color: var(--lg-sub); cursor: pointer; user-select: none; padding: 2px 4px; transition: color .2s; border-bottom: 2px solid transparent; background: none; border-top: 0; border-inline: 0; }
      .switch-row .side.active { color: var(--lg-gold); border-bottom-color: var(--lg-gold); }
      .switch-row .slider { width: 56px; height: 26px; border-radius: 20px; background: var(--lg-input); border: 1.5px solid var(--lg-border); position: relative; cursor: pointer; transition: background .25s; flex-shrink: 0; padding: 0; }
      .switch-row .slider:before { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--lg-gold); transition:transform .25s; }
      .switch-row .slider.on { background:rgba(212,168,75,.25); border-color:var(--lg-gold); }
      .switch-row .slider.on:before { transform:translateX(30px); background:#fff; }
      .flip-wrap { perspective: 1200px; width: 100%; display: flex; justify-content: center; }
      .flip-card__inner {
        width: 100%; max-width: 320px;
        height: clamp(430px, calc(var(--app-h, 100vh) - 190px), 480px);
        position: relative; transform-style: preserve-3d; transition: transform .7s;
      }
      .flip-card__inner.flipped { transform: rotateY(180deg); }
      .flip-card__front, .flip-card__back {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        -webkit-backface-visibility: hidden; backface-visibility: hidden;
        background: linear-gradient(165deg, var(--lg-card) 0%, var(--lg-card2) 100%);
        border: 1px solid var(--lg-border); border-radius: 14px;
        box-shadow: 0 24px 60px -16px rgba(0,0,0,.8);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 24px 22px; box-sizing: border-box; overflow-y: auto;
      }
      .flip-card__back { transform: rotateY(180deg); }
      .card-title { font-size: 24px; font-weight: 800; color: var(--lg-text); letter-spacing: .5px; margin-bottom: 4px; }
      .auth-form { display: flex; flex-direction: column; align-items: center; gap: 13px; width: 100%; }
      .auth-input {
        width: 100%; height: 46px; border-radius: 8px; border: 1.5px solid var(--lg-border);
        background: var(--lg-input); color: var(--lg-text);
        font-size: 16px; /* جلوگیری از زوم خودکار روی iOS */
        font-weight: 500; padding: 6px 14px; outline: none; box-sizing: border-box;
        transition: border-color .2s, box-shadow .2s;
      }
      .auth-input::placeholder { color: var(--lg-sub); opacity: .85; }
      .auth-input:focus { border-color: var(--lg-gold); box-shadow: 0 0 0 3px rgba(212,168,75,.16); }
      .auth-btn {
        width: 150px; height: 44px; border: none; border-radius: 8px;
        background: linear-gradient(135deg, var(--lg-gold2) 0%, #c89a35 100%);
        color: #1a1508; font-size: 15px; font-weight: 700; letter-spacing: .5px; cursor: pointer;
        margin-top: 4px; transition: transform .15s, box-shadow .2s, opacity .2s;
        box-shadow: 0 8px 20px -6px rgba(212,168,75,.45);
      }
      .auth-btn:hover { transform: translateY(-1px); }
      .auth-btn:active { transform: translateY(1px); }
      .auth-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
      .msg { display: none; font-size: 12.5px; line-height: 1.6; text-align: center; font-weight: 600; padding: 7px 10px; border-radius: 6px; width: 100%; box-sizing: border-box; }
      .msg.error { color: #ffb4b4; background: rgba(255,80,80,.12); border: 1px solid rgba(255,80,80,.3); }
      .msg.ok { color: #b4f5b4; background: rgba(80,255,80,.08); border: 1px solid rgba(80,255,80,.25); }

      /* لودر کوتاه تا وقتی وضعیت ورود مشخص شود */
      #bootLoader {
        position: fixed; inset: 0; z-index: 100000; display: flex; align-items: center; justify-content: center;
        background: #050506;
      }
      #bootLoader.hide { display: none; }
      #bootLoader .ring {
        width: 44px; height: 44px; border-radius: 50%;
        border: 3px solid rgba(212,168,75,.18); border-top-color: var(--lg-gold);
        animation: spin .9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 420px) {
        .auth-box { gap: 14px; }

        .switch-row .slider.on:before { transform: translateX(26px); }
        .flip-card__inner { max-width: 300px; height: clamp(420px, calc(var(--app-h, 100vh) - 150px), 470px); }
        .flip-card__front, .flip-card__back { padding: 20px 18px; gap: 12px; }
        .card-title { font-size: 21px; }
        .auth-btn { width: 145px; }
      }
      @media (max-height: 560px) {
        .flip-card__inner { height: 420px; }
      }

  <body style="margin:0;background:#050506">
    <!-- اپ تا وقتی وضعیت ورود مشخص نشده مخفی است -->
    <div id="root" style="display:none"></div>

    <div id="bootLoader"><div class="ring"></div></div>

    <!-- پنل ورود/ثبت‌نام flip-card -->
    <div id="loginOverlay" dir="ltr">
      <div class="auth-box">
        <div class="switch-row">
          <button type="button" class="side active" id="sideLogin">Log in</button>
          <button type="button" class="slider" id="flipSlider" aria-label="switch"></button>
          <button type="button" class="side" id="sideSignup">Sign up</button>
        </div>
        <div class="flip-wrap">
          <div class="flip-card__inner" id="flipInner">
            <div class="flip-card__front">
              <div class="card-title">Log in</div>
              <div id="msgLogin" class="msg"></div>
              <form class="auth-form" id="loginForm" onsubmit="return false;">
                <input type="text" placeholder="Username" id="loginUsername" class="auth-input" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
                <input type="password" placeholder="Password" id="loginPassword" class="auth-input" autocomplete="current-password">
                <button class="auth-btn" type="submit">Let`s go!</button>
              </form>
            </div>
            <div class="flip-card__back">
              <div class="card-title">Sign up</div>
              <div id="msgSignup" class="msg"></div>
              <form class="auth-form" id="signupForm" onsubmit="return false;">
                <input type="text" placeholder="Name" id="signupName" class="auth-input" autocomplete="name">
                <input type="text" placeholder="Username" id="signupUsername" class="auth-input" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
                <input type="password" placeholder="Password" id="signupPassword" class="auth-input" autocomplete="new-password">
                <button class="auth-btn" type="submit">Confirm!</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
    (function () {
      "use strict";

      var API      = "/api";
      var overlay  = document.getElementById("loginOverlay");
      var root     = document.getElementById("root");
      var loader   = document.getElementById("bootLoader");
      var loginMsg = document.getElementById("msgLogin");
      var signupMsg= document.getElementById("msgSignup");

      function hideLoader() { loader.classList.add("hide"); }
      function showApp()    { hideLoader(); overlay.classList.remove("show"); root.style.display = "block"; }
      function showLogin(text) {
        hideLoader();
        root.style.display = "none";
        overlay.classList.add("show");
        if (text) showMsg(loginMsg, text, "error", true);
      }

      /* پاسخ را فقط وقتی JSON است می‌خوانیم؛ اگر HTML برگشت یعنی API جلویش گرفته شده */
      function readJson(res) {
        var ct = res.headers.get("content-type") || "";
        if (ct.indexOf("application/json") === -1) {
          return Promise.reject(new Error("no-api"));
        }
        return res.json().then(function (d) { return { ok: res.ok, status: res.status, d: d || {} }; });
      }

      function showMsg(el, text, type, sticky) {
        el.textContent = text;
        el.className = "msg " + type;
        el.style.display = "block";
        if (text && !sticky) setTimeout(function () { el.style.display = "none"; }, 6000);
      }
      function hideMsg(el) { el.style.display = "none"; }

      function errText(r) {
        if (r && r.d && r.d.error) return r.d.error;
        if (r && r.status === 503) return "Server database is not connected.";
        return "Something went wrong. Try again.";
      }

      /* ---------- تشخیص وضعیت ورود ---------- */
      function boot() {
        fetch(API + "/me", { credentials: "include", cache: "no-store" })
          .then(function (res) {
            var ct = res.headers.get("content-type") || "";
            if (ct.indexOf("application/json") === -1) {
              /* API اصلاً جواب JSON نمی‌دهد → به کاربر بگو، به اپ راه نده */
              showLogin("Server is not reachable right now. Please try again in a moment.");
              return;
            }
            if (res.status === 200) showApp();
            else showLogin("");
          })
          .catch(function () {
            showLogin("Connection error. Check your internet and refresh.");
          });
      }
      boot();

      /* اگر داخل اپ خروج زد و به /login رفت، دوباره همین پنل را نشان بده.
         نکته: موقع بالا آمدن، خود اپ یک لحظه به /login می‌رود؛ پس قبل از نشان دادن
         پنل، حتماً از سرور می‌پرسیم که واقعاً لاگ‌اوت شده یا نه. */
      function watchLogout() {
        var checking = false, timer = null;
        function check() {
          var p = location.pathname;
          if (p !== "/login" && p !== "/register") return;
          if (checking) return;
          checking = true;
          clearTimeout(timer);
          timer = setTimeout(function () {
            fetch(API + "/me", { credentials: "include", cache: "no-store" })
              .then(function (r) {
                checking = false;
                if (r.status === 200) return; // هنوز لاگین است → اپ فقط داشت بالا می‌آمد
                root.style.display = "none";
                overlay.classList.add("show");
              })
              .catch(function () { checking = false; });
          }, 400);
        }
        ["pushState", "replaceState"].forEach(function (m) {
          var orig = history[m];
          history[m] = function () { var r = orig.apply(this, arguments); setTimeout(check, 0); return r; };
        });
        window.addEventListener("popstate", function () { setTimeout(check, 0); });
      }
      watchLogout();

      /* ---------- flip ---------- */
      var flipped   = false;
      var slider    = document.getElementById("flipSlider");
      var inner     = document.getElementById("flipInner");
      var sideLogin = document.getElementById("sideLogin");
      var sideSignup= document.getElementById("sideSignup");

      function setFlip(on) {
        flipped = on;
        inner.classList.toggle("flipped", on);
        slider.classList.toggle("on", on);
        sideLogin.classList.toggle("active", !on);
        sideSignup.classList.toggle("active", on);
      }
      slider.addEventListener("click", function () { setFlip(!flipped); });
      sideLogin.addEventListener("click", function () { setFlip(false); });
      sideSignup.addEventListener("click", function () { setFlip(true); });

      /* بعد از ورود، همان صفحه‌ای که کاربر خواسته باز شود (مثلاً پنل ادمین) */
      function afterAuth() {
        var target = location.pathname;
        if (target === "/login" || target === "/register") target = "/";
        location.replace(target + location.search);
      }

      /* ---------- ورود ---------- */
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var username = document.getElementById("loginUsername").value.trim();
        var password = document.getElementById("loginPassword").value;
        if (!username || !password) { showMsg(loginMsg, "Username and password are required", "error"); return; }
        var btn = this.querySelector("button");
        btn.disabled = true; hideMsg(loginMsg);
        fetch(API + "/auth/login", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(readJson)
          .then(function (r) {
            btn.disabled = false;
            if (r.ok && r.d.user) { showMsg(loginMsg, "Welcome back!", "ok"); afterAuth(); }
            else showMsg(loginMsg, errText(r), "error");
          })
          .catch(function (err) {
            btn.disabled = false;
            showMsg(loginMsg, err && err.message === "no-api"
              ? "Server API is not responding. (Cloudflare Functions / D1)"
              : "Connection error", "error");
          });
      });

      /* ---------- ثبت‌نام ---------- */
      document.getElementById("signupForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var name     = document.getElementById("signupName").value.trim();
        var username = document.getElementById("signupUsername").value.trim();
        var password = document.getElementById("signupPassword").value;
        if (!name || !username || !password) { showMsg(signupMsg, "Name, username and password are required", "error"); return; }
        if (!/^[a-zA-Z][a-zA-Z0-9_]{2,19}$/.test(username)) {
          showMsg(signupMsg, "Username: 3–20 chars, letters/numbers/_ , must start with a letter", "error"); return;
        }
        if (password.length < 6) { showMsg(signupMsg, "Password must be at least 6 characters", "error"); return; }
        var btn = this.querySelector("button");
        btn.disabled = true; hideMsg(signupMsg);
        fetch(API + "/auth/register", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password, displayName: name })
        })
          .then(readJson)
          .then(function (r) {
            btn.disabled = false;
            if (r.ok && r.d.user) { showMsg(signupMsg, "Account created!", "ok"); afterAuth(); }
            else showMsg(signupMsg, errText(r), "error");
          })
          .catch(function (err) {
            btn.disabled = false;
            showMsg(signupMsg, err && err.message === "no-api"
              ? "Server API is not responding. (Cloudflare Functions / D1)"
              : "Connection error", "error");
          });
      });
    })();
    </script>

        flex: 1; resize: none; min-height: 44px; max-height: 140px; border-radius: 11px;
        background: var(--bg2, #111114); border: 1px solid var(--line, rgba(224,184,77,.16));
        color: var(--cream, #f3ebd8); padding: 11px 13px; font-size: 14px; outline: none; font-family: inherit;
      }
      .tsup-ta:focus { border-color: var(--gold, #e0b84d); }
      .tsup-hint { padding: 26px; color: var(--mute, #8d8778); font-size: 13.5px; text-align: center; margin: auto; line-height: 2.1; }
      .tsup-toast { position: fixed; bottom: 18px; inset-inline-start: 18px; background: #2a1b1b; border: 1px solid #d9534f; color: #ffb4b4; padding: 9px 14px; border-radius: 9px; font-size: 12.5px; z-index: 70; display: none; }

      @media (max-width: 900px) {
        #tsupPanel { inset-inline-start: 0; }
        .tsup-body { grid-template-columns: 1fr; }
        .tsup-list { border: 0; }
        #tsupPanel.chat-open .tsup-list { display: none; }
        #tsupPanel:not(.chat-open) .tsup-chat { display: none; }
        .tsup-back { display: inline-flex; }
        .tsup-head h2 { font-size: 16px; }
        .tsup-head .sub { display: none; }
        .tsup-bub { max-width: 88%; }
      }
    </style>
    <script>
    (function () {
      "use strict";

      var ADMIN_PATH = "/13899831a";
      var LIST_MS = 12000, CHAT_MS = 6000;
      var panel = null, tabBtn = null, badgeEl = null;
      var threads = [], current = null, open = false;
      var listTimer = null, chatTimer = null, pollTimer = null;
      var q = "";

      function onAdmin() { return location.pathname.indexOf(ADMIN_PATH) === 0; }

      function api(path, opt) {
        return fetch("/api" + path, Object.assign({ credentials: "include", cache: "no-store" }, opt || {}))
          .then(function (r) {
            var ct = r.headers.get("content-type") || "";
            if (ct.indexOf("application/json") === -1) throw new Error("no-api");
            return r.json().then(function (d) {
              if (!r.ok) throw new Error((d && d.error) || "خطا");
              return d;
            });
          });
      }
      function el(tag, cls, txt) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (txt != null) n.textContent = txt;
        return n;
      }
      function toast(msg) {
        var t = document.getElementById("tsupToast");
        if (!t) { t = el("div", "tsup-toast"); t.id = "tsupToast"; document.body.appendChild(t); }
        t.textContent = msg; t.style.display = "block";
        clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = "none"; }, 4000);
      }
      function fa(n) { return String(n).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; }); }
      function timeOf(ts) {
        if (!ts) return "";
        var d = new Date(ts), now = new Date();
        var sameDay = d.toDateString() === now.toDateString();
        try {
          return sameDay
            ? d.toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" })
            : d.toLocaleDateString("fa-IR", { month: "2-digit", day: "2-digit" });
        } catch (e) { return fa(d.getHours() + ":" + d.getMinutes()); }
      }
      function tickOf(b) {
        if (b === "owner") return { c: "#9b7ae0", t: "مالک" };
        if (b === "admin") return { c: "#e0b84d", t: "ادمین" };
        if (b === "verified") return { c: "#6aa0ff", t: "تایید" };
        return null;
      }

      /* ---------- ساخت پنل ---------- */
      function buildPanel() {
        if (panel) return panel;
        panel = el("div"); panel.id = "tsupPanel";

        var head = el("div", "tsup-head");
        var back = el("button", "tsup-btn tsup-back", "→");
        back.title = "برگشت به لیست";
        back.addEventListener("click", function () { panel.classList.remove("chat-open"); });
        var h = el("h2", null, "پشتیبانی اختصاصی T");
        var sub = el("span", "sub", "پیام‌ها از طرف ربات فرستاده می‌شود");
        var grow = el("div", "grow");
        var search = el("input", "tsup-search"); search.placeholder = "جستجوی یوزرنیم یا اسم";
        search.addEventListener("input", function () { q = this.value.trim().toLowerCase(); renderList(); });
        var refresh = el("button", "tsup-btn", "تازه‌سازی");
        refresh.addEventListener("click", function () { loadList(true); });
        var close = el("button", "tsup-btn", "بستن ✕");
        close.addEventListener("click", closePanel);
        head.appendChild(back); head.appendChild(h); head.appendChild(sub);
        head.appendChild(grow); head.appendChild(search); head.appendChild(refresh); head.appendChild(close);

        var body = el("div", "tsup-body");
        var list = el("div", "tsup-list"); list.id = "tsupList";
        var chat = el("div", "tsup-chat"); chat.id = "tsupChat";
        chat.appendChild(el("div", "tsup-hint", "یک گفتگو را از لیست انتخاب کن تا جوابش را بدهی."));
        body.appendChild(list); body.appendChild(chat);

        panel.appendChild(head); panel.appendChild(body);
        document.body.appendChild(panel);
        return panel;
      }

      /* ---------- لیست گفتگوها ---------- */
      function loadList(showErr) {
        return api("/admin/support")
          .then(function (d) {
            threads = d.threads || [];
            setBadge(d.totalUnread || 0);
            if (open) renderList();
          })
          .catch(function (e) { if (showErr) toast("خطا در گرفتن لیست: " + e.message); });
      }
      function setBadge(n) {
        if (!badgeEl) return;
        badgeEl.textContent = n > 99 ? "۹۹+" : fa(n);
        badgeEl.classList.toggle("on", n > 0);
      }
      function renderList() {
        var box = document.getElementById("tsupList");
        if (!box) return;
        box.textContent = "";
        var items = threads.filter(function (t) {
          if (!q) return true;
          return (t.username || "").toLowerCase().indexOf(q) > -1 ||
                 (t.displayName || "").toLowerCase().indexOf(q) > -1;
        });
        if (!items.length) {
          box.appendChild(el("div", "tsup-empty", q ? "چیزی پیدا نشد." : "هنوز کسی به پشتیبانی پیام نداده است."));
          return;
        }
        items.forEach(function (t) {
          var b = el("button", "tsup-item" + (current && current.userId === t.userId ? " sel" : ""));
          var av = el("div", "tsup-av");
          if (t.avatar) { var im = new Image(); im.src = t.avatar; av.appendChild(im); }
          else { av.textContent = (t.displayName || t.username || "?").trim().charAt(0); av.style.background = "hsl(" + (t.hue || 40) + ",42%,45%)"; }
          var meta = el("div", "tsup-meta");
          var nm = el("div", "tsup-name");
          if (t.online) nm.appendChild(el("span", "dot"));
          nm.appendChild(el("span", null, t.displayName || t.username));
          var tk = tickOf(t.badge);
          if (tk) { var s = el("span", "tick", "●"); s.style.color = tk.c; s.title = tk.t; nm.appendChild(s); }
          if (t.banned) { var bn = el("span", "tick", "⛔"); bn.title = "مسدود"; nm.appendChild(bn); }
          meta.appendChild(nm);
          meta.appendChild(el("div", "tsup-prev", "@" + t.username + " · " + (t.preview || "")));
          var side = el("div", "tsup-side");
          side.appendChild(el("div", "tsup-time", timeOf(t.lastAt)));
          if (t.unread > 0) side.appendChild(el("div", "tsup-unread", fa(t.unread)));
          b.appendChild(av); b.appendChild(meta); b.appendChild(side);
          b.addEventListener("click", function () { openThread(t); });
          box.appendChild(b);
        });
      }

      /* ---------- گفتگو ---------- */
      function openThread(t) {
        current = t;
        panel.classList.add("chat-open");
        renderList();
        renderChatShell();
        loadChat(true);
        clearInterval(chatTimer);
        chatTimer = setInterval(function () { if (open && current) loadChat(false); }, CHAT_MS);
      }
      function renderChatShell() {
        var chat = document.getElementById("tsupChat");
        chat.textContent = "";
        var head = el("div", "tsup-chat-head");
        var av = el("div", "tsup-av");
        if (current.avatar) { var im = new Image(); im.src = current.avatar; av.appendChild(im); }
        else { av.textContent = (current.displayName || "?").charAt(0); av.style.background = "hsl(" + (current.hue || 40) + ",42%,45%)"; }
        var w = el("div");
        w.appendChild(el("div", "who", current.displayName || current.username));
        w.appendChild(el("div", "uname", "@" + current.username + (current.online ? " · آنلاین" : "")));
        head.appendChild(av); head.appendChild(w);
        var msgs = el("div", "tsup-msgs"); msgs.id = "tsupMsgs";
        var comp = el("div", "tsup-comp");
        var ta = el("textarea", "tsup-ta"); ta.id = "tsupTa"; ta.placeholder = "جواب را بنویس… (Enter = ارسال)";
        ta.addEventListener("input", function () { this.style.height = "auto"; this.style.height = Math.min(140, this.scrollHeight) + "px"; });
        ta.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
        });
        var btn = el("button", "tsup-btn gold", "ارسال"); btn.id = "tsupSend";
        btn.addEventListener("click", send);
        comp.appendChild(ta); comp.appendChild(btn);
        chat.appendChild(head); chat.appendChild(msgs); chat.appendChild(comp);
      }
      function loadChat(scroll) {
        if (!current) return;
        api("/admin/support/" + encodeURIComponent(current.userId))
          .then(function (d) {
            renderMsgs(d.messages || [], scroll);
            current.unread = 0;
            loadList(false);
          })
          .catch(function (e) { if (scroll) toast("خطا: " + e.message); });
      }
      function renderMsgs(list, scroll) {
        var box = document.getElementById("tsupMsgs");
        if (!box) return;
        var atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 60;
        box.textContent = "";
        if (!list.length) box.appendChild(el("div", "tsup-hint", "هنوز پیامی رد و بدل نشده."));
        list.forEach(function (m) {
          var row = el("div", "tsup-row " + (m.fromBot ? "bot" : "user"));
          var bub = el("div", "tsup-bub");
          if (m.deleted) { bub.appendChild(el("em", null, "پیام حذف شده")); }
          else {
            if (m.mediaId && (m.type === "photo" || m.type === "album")) {
              var im = new Image(); im.src = "/api/admin/support/media/" + m.mediaId; im.loading = "lazy";
              bub.appendChild(im);
            } else if (m.mediaId && m.type === "voice") {
              var au = document.createElement("audio"); au.controls = true;
              au.src = "/api/admin/support/media/" + m.mediaId; bub.appendChild(au);
            } else if (m.mediaId && m.type === "video") {
              var vd = document.createElement("video"); vd.controls = true; vd.style.maxWidth = "100%";
              vd.style.borderRadius = "9px"; vd.src = "/api/admin/support/media/" + m.mediaId; bub.appendChild(vd);
            }
            if (m.body) bub.appendChild(document.createTextNode(m.body));
          }
          bub.appendChild(el("span", "t", (m.fromBot ? "پشتیبانی · " : "") + timeOf(m.createdAt)));
          row.appendChild(bub);
          box.appendChild(row);
        });
        if (scroll || atBottom) box.scrollTop = box.scrollHeight;
      }
      function send() {
        var ta = document.getElementById("tsupTa");
        var btn = document.getElementById("tsupSend");
        if (!ta || !current) return;
        var text = ta.value.trim();
        if (!text) return;
        btn.disabled = true;
        api("/admin/support/" + encodeURIComponent(current.userId), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ body: text })
        })
          .then(function () {
            ta.value = ""; ta.style.height = "auto";
            btn.disabled = false;
            loadChat(true);
          })
          .catch(function (e) { btn.disabled = false; toast("ارسال نشد: " + e.message); });
      }

      /* ---------- باز/بسته ---------- */
      function openPanel() {
        buildPanel();
        open = true;
        panel.classList.add("open");
        if (tabBtn) tabBtn.classList.add("on");
        document.querySelectorAll(".admin-tab").forEach(function (b) {
          if (b !== tabBtn) b.classList.remove("on");
        });
        renderList();
        loadList(true);
        clearInterval(listTimer);
        listTimer = setInterval(function () { if (open) loadList(false); }, LIST_MS);
      }
      function closePanel() {
        open = false;
        if (panel) panel.classList.remove("open", "chat-open");
        if (tabBtn) tabBtn.classList.remove("on");
        current = null;
        clearInterval(listTimer); clearInterval(chatTimer);
      }

      /* ---------- تزریق تب داخل ریل پنل ادمین ---------- */
      var ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">' +
        '<path d="M4 13v-1a8 8 0 0 1 16 0v1"></path>' +
        '<path d="M4 13h2.4a1 1 0 0 1 1 1v3.4a1 1 0 0 1-1 1H5.6A1.6 1.6 0 0 1 4 16.8Z"></path>' +
        '<path d="M20 13h-2.4a1 1 0 0 0-1 1v3.4a1 1 0 0 0 1 1h.8a1.6 1.6 0 0 0 1.6-1.6Z"></path>' +
        '<path d="M18 18.4v.6a2.5 2.5 0 0 1-2.5 2.5H13"></path></svg>';

      function injectTab() {
        if (!onAdmin()) return;
        var nav = document.querySelector(".admin-rail nav");
        if (!nav) return;
        if (tabBtn && nav.contains(tabBtn)) return;
        tabBtn = document.createElement("button");
        tabBtn.type = "button";
        tabBtn.className = "admin-tab" + (open ? " on" : "");
        tabBtn.title = "پشتیبانی";
        tabBtn.setAttribute("data-t-support", "1");
        var ico = el("span", "admin-tab-ico");
        ico.innerHTML = ICON;
        tabBtn.appendChild(ico);
        tabBtn.appendChild(el("em", null, "پشتیبانی"));
        badgeEl = el("span", "tsup-badge");
        tabBtn.appendChild(badgeEl);
        nav.appendChild(tabBtn);
        loadList(false);
      }

      /* کلیک‌ها به‌صورت delegation — حتی اگر React ریل را دوباره بسازد کار می‌کند */
      document.addEventListener("click", function (e) {
        if (!e.target || !e.target.closest) return;
        var mine = e.target.closest("[data-t-support]");
        if (mine) {
          e.preventDefault(); e.stopPropagation();
          tabBtn = mine;
          badgeEl = mine.querySelector(".tsup-badge");
          if (open) closePanel(); else openPanel();
          return;
        }
        if (e.target.closest(".admin-tab") && open) closePanel();
      }, true);

      var mo = new MutationObserver(function () {
        if (!onAdmin()) { if (open) closePanel(); tabBtn = null; badgeEl = null; return; }
        injectTab();
      });
      function start() {
        mo.observe(document.body, { childList: true, subtree: true });
        injectTab();
        clearInterval(pollTimer);
        pollTimer = setInterval(function () {
          if (onAdmin() && !open) loadList(false);
        }, 30000);
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
      else start();
    })();
    </script>
  </body>
</html>
