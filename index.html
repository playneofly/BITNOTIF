<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050506" />
<meta name="description" content="پیام‌رسان T" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050506'/%3E%3Crect x='1.5' y='1.5' width='61' height='61' rx='15' fill='none' stroke='%23e0b84d' stroke-opacity='.35' stroke-width='2'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='600' fill='%23e0b84d' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
<title>T</title>
<style>
:root{--bg0:#050506;--bg1:#0a0a0c;--bg2:#111114;--bg3:#18181c;--line:rgba(224,184,77,.16);--line2:rgba(255,255,255,.06);--gold:#e0b84d;--gold2:#b8892a;--gold3:#8a6a1e;--cream:#f3ebd8;--mute:#8d8778;--mute2:#5c574c;--owner:#9b7ae0;--owner-deep:#2a1b44;--admin:#e0b84d;--verify:#6aa0ff;--danger:#d36a6a;--glass:rgba(14,14,16,.72);--shadow:0 30px 80px rgba(0,0,0,.55);--serif:Georgia,"Times New Roman",serif;--sans:Tahoma,"Segoe UI",sans-serif;--rail:78px;--app-h:100%}
*{box-sizing:border-box}
html,body,#app{height:100%}
html{color-scheme:dark}
body{margin:0;background:var(--bg0);color:var(--cream);font-family:var(--sans);font-weight:400;letter-spacing:0;overflow:hidden}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:rgba(224,184,77,.28)}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:#3a3a3e}
*::-webkit-scrollbar-track{background:transparent}
.app-bg{position:fixed;top:0;right:0;bottom:0;left:0;background:radial-gradient(1200px 700px at 80% -10%,rgba(224,184,77,.08),transparent 55%),radial-gradient(800px 500px at -10% 110%,rgba(90,50,160,.12),transparent 50%),var(--bg0);pointer-events:none;z-index:0}
.app-bg:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;opacity:.18;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");mix-blend-mode:overlay}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#050506;z-index:99}
#boot .b-mark{width:74px;height:74px;display:grid;place-items:center;border:1px solid rgba(224,184,77,.25);border-radius:20px;background:linear-gradient(160deg,rgba(224,184,77,.14),rgba(224,184,77,.02));color:var(--gold);font-family:var(--serif);font-size:44px}
#boot .b-txt{margin-top:14px;text-align:center;color:var(--mute);font-size:13px}
.shell{position:relative;z-index:1;height:100%;max-height:100%;overflow:hidden;display:grid;grid-template-columns:var(--rail) 320px 1fr}
.shell>*{min-height:0}
.rail{border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0 14px;background:linear-gradient(180deg,#0a0a0ce6,#050506b3);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.mark{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,#e0b84d24,#e0b84d05);box-shadow:inset 0 0 20px #e0b84d14;margin-bottom:22px}
.mark span{font-family:var(--serif);font-size:28px;line-height:1;color:var(--gold);font-weight:600}
.rail nav{display:flex;flex-direction:column;gap:6px;flex:1}
.rail button.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mute);background:transparent;border:1px solid transparent;transition:.2s ease}
.rail button.icon:hover{color:var(--cream);background:#ffffff08}
.rail button.icon.active{color:var(--gold);border-color:var(--line);background:#e0b84d14}
.rail svg,.iconbtn svg{width:20px;height:20px}
.me-avatar{margin-top:10px;width:32px;height:32px!important;border-radius:11px!important;font-size:12px!important}
.col{border-left:1px solid var(--line2);background:#08080a8c;display:flex;flex-direction:column;min-width:0;position:relative}
.col-head{padding:18px 18px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.col-head h2{margin:0;font-family:var(--serif);font-weight:600;font-size:28px;letter-spacing:.02em}
.col-head p{margin:0;color:var(--mute);font-size:12px}
.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid transparent;display:grid;place-items:center;background:transparent;color:var(--mute);transition:.2s ease}
.iconbtn:hover{color:var(--cream);background:#ffffff08}
.iconbtn svg{width:18px;height:18px}
.search{margin:8px 14px 12px;background:#ffffff08;border:1px solid var(--line2);border-radius:12px;padding:9px 12px;outline:none;width:calc(100% - 28px);font-size:13px}
.search:focus{border-color:var(--line)}
.search::placeholder{color:var(--mute2)}
.list{flex:1;overflow:auto;padding:0 8px 88px}
.list-empty{text-align:center;color:var(--mute2);font-size:12px;padding:38px 16px;line-height:1.9}
.fab-plus{position:absolute;right:16px;bottom:18px;width:56px;height:56px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,#e8c45a,#9a7420);color:#1a1406;box-shadow:0 14px 32px #e0b84d47;display:grid;place-items:center;z-index:6;transition:transform .2s ease}
.fab-plus:hover{transform:translateY(-2px) scale(1.03)}
.fab-plus svg{width:24px;height:24px}
.compose-opt{width:100%;display:block;text-align:right;background:#ffffff08;border:1px solid var(--line2);border-radius:16px;padding:14px 16px;margin-top:10px;color:inherit;transition:.2s ease;font-size:inherit}
.compose-opt:hover{border-color:var(--line);background:#e0b84d14}
.compose-opt b{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:20px;font-weight:500}
.compose-opt b svg{width:18px;height:18px;color:var(--gold)}
.compose-opt small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:10px;padding:10px;border-radius:14px;cursor:pointer;align-items:center;border:1px solid transparent;width:100%;background:transparent;text-align:right;font-size:inherit}
.row:hover{background:#ffffff08}
.row.active{background:linear-gradient(90deg,#e0b84d1a,#e0b84d05);border-color:var(--line)}
.row .meta{min-width:0}
.row .name{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap}
.row .name svg{width:14px;height:14px;color:var(--verify);flex:none}
.row .preview{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .when{color:var(--mute2);font-size:11px;text-align:left;white-space:nowrap}
.unread{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--gold);color:#1a1406;font-size:10px;font-weight:700;display:inline-grid;place-items:center}
.avatar{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:14px;position:relative;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 0 20px #00000040;flex:none;overflow:hidden;color:#141005;font-family:var(--serif)}
.avatar.sm{width:32px;height:32px;border-radius:11px;font-size:11px}
.avatar.lg{width:84px;height:84px;border-radius:28px;font-size:28px;font-family:var(--serif)}
.avatar .dot{position:absolute;left:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#7dba7a;border:2px solid var(--bg0)}
.avatar .dot.off{background:#3a3832}
.av-gold{background:linear-gradient(160deg,#e8c45a,#9a7420)}
.av-violet{background:linear-gradient(160deg,#9b7ae0,#4a2b86);color:#f3edff}
.av-blue{background:linear-gradient(160deg,#6aa0ff,#2b4a86);color:#eef4ff}
.av-rose{background:linear-gradient(160deg,#e08a8a,#86332b);color:#fff0f0}
.av-green{background:linear-gradient(160deg,#7dba7a,#2b5e33);color:#f0fff2}
.av-teal{background:linear-gradient(160deg,#5ec2b8,#1e5c55);color:#effffd}
.avatar-picker{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0 8px}
.avatar-pick-hint{font-size:12px;color:var(--gold)}
.av-swatches{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.av-swatch{width:34px;height:34px;border-radius:12px;border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:13px;color:#141005;transition:.15s ease;background-clip:padding-box}
.av-swatch:hover{transform:translateY(-2px)}
.av-swatch.on{outline:2px solid var(--gold);outline-offset:2px}
.stage{min-width:0;min-height:0;height:100%;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(224,184,77,.03),transparent 180px),#05050633}
.stage-empty{flex:1;display:grid;place-items:center;text-align:center;padding:40px}
.stage-empty .giant{font-family:var(--serif);font-size:120px;line-height:.8;color:var(--gold);opacity:.85;text-shadow:0 0 60px rgba(224,184,77,.25);margin:0}
.stage-empty h3{font-family:var(--serif);font-size:32px;font-weight:500;margin:8px 0 6px}
.stage-empty p{color:var(--mute);margin:0;font-size:13px}
.topbar{flex:none;height:68px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line2);background:#08080a8c;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.topbar .who{min-width:0;flex:1;display:flex;align-items:center;gap:10px}
.topbar .who b{display:flex;align-items:center;gap:6px;font-size:15px}
.topbar .who b svg{width:15px;height:15px;color:var(--verify)}
.topbar .who span{color:var(--mute);font-size:12px;display:block}
.msgs{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;padding:22px 8% 18px;display:block;-webkit-overflow-scrolling:touch}
.msg-line{display:block;width:100%;margin:6px 0}
.msg-line.system{text-align:center;padding:0}
.msg-line.is-mine{padding-left:22%;padding-right:0}
.msg-line.is-theirs{padding-left:0;padding-right:22%}
.msg-line.pending>.bubble{opacity:.7}
.msg-line.is-mine>.bubble{display:block;width:fit-content;max-width:100%;margin-left:auto;margin-right:0}
.msg-line.is-theirs>.bubble{display:block;width:fit-content;max-width:100%;margin-left:0;margin-right:auto}
.day{width:fit-content;margin:8px auto;font-size:11px;color:var(--mute);border:1px solid var(--line2);padding:4px 10px;border-radius:99px;background:#00000040}
.bubble{width:fit-content;max-width:100%;padding:8px 12px 6px;border-radius:16px 16px 16px 6px;border:1px solid var(--line2);background:#182533;position:relative;direction:rtl}
.msg-line.is-mine>.bubble{background:linear-gradient(160deg,#3a3118,#2a2414);border-color:var(--line);border-radius:16px 16px 6px 16px}
.msg-line.system .bubble{background:transparent;border:none;color:var(--mute);font-size:12px;padding:4px}
.bubble .fwd{font-size:11px;color:var(--gold);margin-bottom:4px}
.bubble .quote{border-right:2px solid var(--gold);padding:4px 8px;margin-bottom:6px;color:var(--mute);font-size:12px;background:#0000002e;border-radius:0 8px 8px 0;cursor:pointer}
.bubble .txt{white-space:pre-wrap;word-break:break-word;line-height:1.65;font-size:14.5px;text-align:right}
.bubble .foot{display:flex;justify-content:flex-start;align-items:center;gap:6px;margin-top:4px;color:var(--mute2);font-size:11px}
.msg-line.is-mine>.bubble .foot{justify-content:flex-end}
.bubble .foot svg{width:14px;height:14px}
.bubble .foot .hg{display:inline-flex;align-items:center;gap:3px}
.bubble .foot .hg svg{width:11px;height:11px}
.b-tools{position:absolute;top:-26px;left:8px;display:none;gap:2px;background:var(--glass);border:1px solid var(--line2);border-radius:10px;padding:3px;box-shadow:0 10px 26px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:5}
.msg-line.is-mine .b-tools{left:auto;right:8px}
.msg-line:hover .b-tools{display:flex}
.b-tools button{width:24px;height:24px;border-radius:7px;border:0;background:transparent;color:var(--mute);display:grid;place-items:center}
.b-tools button:hover{color:var(--gold);background:#ffffff0d}
.b-tools svg{width:13px;height:13px}
.composer{flex:none;display:flex;align-items:flex-end;gap:10px;padding:14px 8% 18px;background:linear-gradient(0deg,#050506 30%,transparent)}
.composer .box{flex:1;display:flex;align-items:flex-end;gap:8px;background:#0d0d10;border:1px solid var(--line2);border-radius:18px;padding:8px 12px;transition:border-color .2s ease}
.composer .box:focus-within{border-color:var(--line)}
.composer textarea{flex:1;background:transparent;border:0;outline:none;resize:none;max-height:140px;font-size:14px;line-height:1.7;padding:6px 0;color:var(--cream)}
.composer textarea::placeholder{color:var(--mute2)}
.composer .attach{color:var(--mute2);background:transparent;border:0;display:grid;place-items:center;width:34px;height:34px;border-radius:10px}
.composer .attach:hover{color:var(--cream);background:#ffffff08}
.composer .attach svg{width:19px;height:19px}
.sendbtn{width:48px;height:48px;flex:none;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,#e8c45a,#9a7420);color:#1a1406;display:grid;place-items:center;box-shadow:0 10px 26px #e0b84d45;transition:transform .15s ease}
.sendbtn:hover{transform:translateY(-2px)}
.sendbtn:disabled{opacity:.45;transform:none;cursor:default}
.sendbtn svg{width:20px;height:20px;transform:scaleX(-1)}
.replybar{flex:none;display:flex;align-items:center;gap:10px;margin:0 8%;padding:9px 13px;background:#0d0d10;border:1px solid var(--line2);border-bottom:0;border-radius:16px 16px 0 0;font-size:12px;color:var(--mute)}
.replybar .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:2px solid var(--gold);padding-right:8px}
.replybar button{background:transparent;border:0;color:var(--mute2);display:grid;place-items:center}
.replybar button:hover{color:var(--cream)}
.replybar svg{width:15px;height:15px}
.modal-veil{position:fixed;inset:0;z-index:60;background:#050506b3;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;animation:veil .18s ease}
@keyframes veil{from{opacity:0}}
.modal{width:min(430px,100%);max-height:82vh;overflow:auto;background:linear-gradient(180deg,#101013,#0a0a0c);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);animation:pop .22s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.modal h3{margin:0 0 2px;font-family:var(--serif);font-size:24px;font-weight:600}
.modal .sub{color:var(--mute);font-size:12px;margin:0 0 14px}
.btn-gold{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 14px;background:linear-gradient(160deg,#e8c45a,#9a7420);color:#1a1406;font-weight:700;font-size:14px;transition:.15s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-gold:hover{filter:brightness(1.06)}
.btn-gold:disabled{opacity:.5;cursor:default}
.btn-gold svg{width:16px;height:16px}
.btn-ghost{width:100%;border:1px solid var(--line2);border-radius:13px;padding:10px 14px;background:transparent;color:var(--mute);font-size:13px;transition:.15s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-ghost:hover{color:var(--cream);background:#ffffff08}
.btn-ghost svg{width:14px;height:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:var(--mute)}
.field input{background:#ffffff08;border:1px solid var(--line2);border-radius:12px;padding:11px 13px;outline:none;font-size:14px;transition:border-color .2s ease;color:var(--cream);width:100%}
.field input:focus{border-color:var(--line)}
.field input::placeholder{color:var(--mute2)}
.err{color:var(--danger);font-size:12px;margin:6px 0 0;min-height:16px}
.hintline{color:var(--mute2);font-size:11px;margin-top:10px;text-align:center}
#loginOverlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;direction:ltr;overflow:auto;padding:24px}
.lo-mark{position:absolute;top:34px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;color:var(--cream)}
.lo-mark .mk{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:linear-gradient(160deg,#e0b84d24,#e0b84d05);font-family:var(--serif);font-size:23px;color:var(--gold)}
.lo-mark .wm{font-family:var(--serif);font-size:19px;letter-spacing:.04em}
.lo-tag{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:var(--mute2);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center}
.lo-tag svg{width:11px;height:11px;margin:0 6px}
.lo-wrap{display:flex;align-items:stretch;gap:0;perspective:1600px}
.lo-side{display:flex;flex-direction:column;justify-content:center;gap:26px;padding:0 26px}
.lo-side p{margin:0;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--serif);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute2);cursor:pointer;transition:.25s ease;background:none;border:0;padding:6px 2px}
.lo-side p:hover{color:var(--cream)}
.lo-side p.on{color:var(--gold);text-shadow:0 0 22px rgba(224,184,77,.4)}
#flipInner{position:relative;width:min(420px,92vw);min-height:620px;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.7,0,.2,1)}
#flipInner.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(180deg,rgba(20,20,24,.86),rgba(10,10,12,.92));border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);padding:36px 34px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;scrollbar-width:thin}
.face.back{transform:rotateY(180deg)}
.face h1{margin:0 0 4px;font-family:var(--serif);font-weight:600;font-size:38px;color:var(--cream)}
.face h1 em{font-style:normal;color:var(--gold)}
.face .under{color:var(--mute);font-size:13px;margin:0 0 26px}
.face form{display:flex;flex-direction:column}
.face .forgot{align-self:flex-start;font-size:12px;color:var(--mute);margin:-4px 0 16px;transition:.2s}
.face .forgot:hover{color:var(--gold)}
.face .swapnote{margin-top:16px;text-align:center;font-size:12px;color:var(--mute2)}
.face .swapnote b{color:var(--gold);font-weight:600;cursor:pointer}
@media (max-width:960px){
  .shell{grid-template-columns:64px minmax(0,1fr)}
  .shell.chat-open .col{display:none}
  .shell:not(.chat-open) .stage{display:none}
  .rail{padding:14px 0 10px}
  .msg-line.is-mine{padding-left:8%}
  .msg-line.is-theirs{padding-right:8%}
  .msgs{padding:18px 5% 14px}
  .composer{padding:10px 5% 14px}
  .backonly{display:grid!important}
}
.backonly{display:none;width:36px;height:36px;border-radius:11px;border:1px solid transparent;place-items:center;background:transparent;color:var(--mute)}
.backonly:hover{color:var(--cream);background:#ffffff08}
.backonly svg{width:18px;height:18px}
@media (max-width:560px){
  .face{padding:28px 22px}
  .face h1{font-size:30px}
  .lo-side{padding:0 10px;gap:16px}
  #flipInner{min-height:560px}
  .col-head h2{font-size:24px}
}
</style>
</head>
<body>
<div class="app-bg"></div>
<div id="boot"><div><div class="b-mark">T</div><div class="b-txt">پیام‌رسان T — در حال بارگذاری…</div></div></div>
<div id="app"></div>
<noscript><div style="position:fixed;inset:0;background:#050506;color:#f3ebd8;display:grid;place-items:center;font-family:Tahoma,sans-serif;z-index:100">برای استفاده از «T» باید جاوااسکریپت فعال باشد.</div></noscript>

var jsonHeaders = { "Content-Type": "application/json", "Accept": "application/json" };
function tryFetch(input, init) {
  init = init || {};
  init.headers = Object.assign({}, jsonHeaders);
  return fetch(input, init).then(function (res) {
    var ct = res.headers.get("content-type") || "";
    if (ct.indexOf("application/json") === -1) throw new Error("no-api");
    return res.json().then(function (data) {
      if (!res.ok) { var e = new Error(data.error || "خطا"); e.status = res.status; throw e; }
      return data;
    });
  });
}

var DB_KEY = "t-demo-db-v1", SES_KEY = "t-demo-session-v1";
function nowMinus(m) { return Date.now() - m * 60000; }
function seedDB() {
  return {
    seq: 100,
    users: [
      { id: "u-support", username: "support", name: "پشتیبانی T", avatar: "violet", pass: "-", verified: true },
      { id: "u-sara", username: "sara", name: "سارا محمدی", avatar: "rose", pass: "-" }
    ],
    chats: [],
    messages: [
      { id: "m1", chatId: "", senderId: "u-support", text: "به پیام‌رسان «T» خوش آمدید", createdAt: nowMinus(1560) },
      { id: "m2", chatId: "", senderId: "u-support", text: "اینجا می‌توانید گفتگوهایتان را شروع کنید. برای ساخت گفتگوی جدید، دکمه + را بزنید.", createdAt: nowMinus(1559) },
      { id: "m3", chatId: "", senderId: "u-sara", text: "سلام! تو هم اومدی اینجا؟", createdAt: nowMinus(180) },
      { id: "m4", chatId: "", senderId: "u-sara", text: "ظاهرش خیلی شیک شده", hearts: 1, createdAt: nowMinus(179) },
      { id: "m5", chatId: "", senderId: "u-team", text: "نسخه جدید سرور «t» روی کلادفلر بالا اومد", createdAt: nowMinus(540) }
    ]
  };
}
function loadDB() {
  try { var raw = localStorage.getItem(DB_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  var db = seedDB(); saveDB(db); return db;
}
function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function demoSetupFor(me) {
  var db = loadDB();
  var has = db.chats.some(function (c) { return c.userId === me.id; });
  if (!has) {
    var mk = function (p) { var c = Object.assign({ kind: "direct", title: "", avatar: "gold", unread: 0, userId: me.id }, p); db.chats.push(c); };
    mk({ id: "c-saved-" + me.id, kind: "saved", title: "پیام‌های ذخیره‌شده", peer: null });
    mk({ id: "c-support-" + me.id, title: "پشتیبانی T", avatar: "violet", online: true, verified: true, peer: { id: "u-support", username: "support", name: "پشتیبانی T", avatar: "violet", verified: true } });
    mk({ id: "c-sara-" + me.id, title: "سارا محمدی", avatar: "rose", online: true, unread: 2, peer: { id: "u-sara", username: "sara", name: "سارا محمدی", avatar: "rose" } });
    mk({ id: "c-team-" + me.id, kind: "group", title: "تیم NeoFly", avatar: "blue" });
    var bind = function (mid, cid, sid) { var m = db.messages.find(function (x) { return x.id === mid; }); if (m) { m.chatId = cid; m.senderId = sid; } };
    bind("m1", "c-support-" + me.id, "u-support");
    bind("m2", "c-support-" + me.id, "u-support");
    bind("m3", "c-sara-" + me.id, "u-sara");
    bind("m4", "c-sara-" + me.id, "u-sara");
    bind("m5", "c-team-" + me.id, "u-team");
    saveDB(db);
  }
  return db;
}
function withLast(db, me) {
  return db.chats.filter(function (c) { return c.userId === me.id; }).map(function (c) {
    var msgs = db.messages.filter(function (m) { return m.chatId === c.id; }).sort(function (a, b) { return b.createdAt - a.createdAt; });
    var out = Object.assign({}, c);
    if (msgs[0]) { out.lastText = msgs[0].text; out.lastAt = msgs[0].createdAt; }
    return out;
  }).sort(function (a, b) { return (b.lastAt || 0) - (a.lastAt || 0); });
}

var mode = null, demoUser = null;
function detect() {
  if (mode) return Promise.resolve(mode);
  return tryFetch("/api/me").then(function () { mode = "live"; return mode; }, function (e) {
    mode = (e && e.message === "no-api") ? "demo" : "live"; return mode;
  });
}

var Api = {
  me: function () {
    return detect().then(function () {
      if (mode === "live") return tryFetch("/api/me").then(function (d) { return d.user; }, function () { return null; });
      var sid = localStorage.getItem(SES_KEY);
      if (!sid) return null;
      var u = loadDB().users.find(function (x) { return x.id === sid; });
      if (!u) return null;
      demoUser = { id: u.id, username: u.username, name: u.name, avatar: u.avatar, verified: !!u.verified };
      return demoUser;
    });
  },
  login: function (username, password) {
    return detect().then(function () {
      if (mode === "live") return tryFetch("/api/login", { method: "POST", body: JSON.stringify({ username: username, password: password }) }).then(function (d) { return d.user; });
      var u = loadDB().users.find(function (x) { return x.username.toLowerCase() === String(username).toLowerCase(); });
      if (!u || (u.pass !== "-" && u.pass !== password)) throw new Error("نام کاربری یا رمز عبور اشتباه است");
      if (u.pass === "-") throw new Error("این حساب نمایشی است؛ لطفاً ثبت‌نام کنید");
      localStorage.setItem(SES_KEY, u.id);
      demoUser = { id: u.id, username: u.username, name: u.name, avatar: u.avatar };
      return demoUser;
    });
  },
  signup: function (input) {
    return detect().then(function () {
      if (mode === "live") return tryFetch("/api/signup", { method: "POST", body: JSON.stringify(input) }).then(function (d) { return d.user; });
      var db = loadDB();
      var dup = db.users.some(function (x) { return x.username.toLowerCase() === input.username.toLowerCase(); });
      if (dup) throw new Error("این نام کاربری قبلاً گرفته شده است");
      var u = { id: "u-" + Math.random().toString(36).slice(2, 10), name: input.name, username: input.username, avatar: input.avatar, pass: input.password };
      db.users.push(u); saveDB(db);
      localStorage.setItem(SES_KEY, u.id);
      demoUser = { id: u.id, username: u.username, name: u.name, avatar: u.avatar };
      demoSetupFor(demoUser);
      return demoUser;
    });
  },
  logout: function () {
    if (mode === "live") return tryFetch("/api/logout", { method: "POST", body: "{}" }).then(function () {}, function () {});
    localStorage.removeItem(SES_KEY); demoUser = null;
    return Promise.resolve();
  },
  listChats: function (me) {
    if (mode === "live") return tryFetch("/api/chats").then(function (d) { return d.chats; });
    demoSetupFor(me);
    return Promise.resolve(withLast(loadDB(), me));
  },
  messages: function (me, chatId) {
    if (mode === "live") return tryFetch("/api/chats/" + encodeURIComponent(chatId) + "/messages").then(function (d) { return d.messages; });
    var db = demoSetupFor(me);
    return Promise.resolve(db.messages.filter(function (m) { return m.chatId === chatId; }).sort(function (a, b) { return a.createdAt - b.createdAt; }));
  },
  send: function (me, chatId, text, replyTo, fwdFrom) {
    if (mode === "live") return tryFetch("/api/chats/" + encodeURIComponent(chatId) + "/messages", { method: "POST", body: JSON.stringify({ text: text, replyTo: replyTo ? replyTo.id : null, fwdFrom: fwdFrom || null }) }).then(function (d) { return d.message; });
    var db = loadDB();
    var msg = { id: "m" + (++db.seq), chatId: chatId, senderId: me.id, text: text, replyTo: replyTo ? replyTo.id : null, replyText: replyTo ? String(replyTo.text || "").slice(0, 90) : null, fwdFrom: fwdFrom || null, createdAt: Date.now(), hearts: 0 };
    db.messages.push(msg); saveDB(db);
    return Promise.resolve(msg);
  },
  react: function (messageId) {
    if (mode === "live") return tryFetch("/api/messages/" + encodeURIComponent(messageId) + "/react", { method: "POST", body: JSON.stringify({ kind: "heart" }) }).then(function () {}, function () {});
    var db = loadDB();
    var m = db.messages.find(function (x) { return x.id === messageId; });
    if (m) { m.myHeart = !m.myHeart; m.hearts = Math.max(0, (m.hearts || 0) + (m.myHeart ? 1 : -1)); saveDB(db); }
    return Promise.resolve();
  },
  markRead: function (me, chatId) {
    if (mode === "live") return tryFetch("/api/chats/" + encodeURIComponent(chatId) + "/read", { method: "POST", body: "{}" }).then(function () {}, function () {});
    var db = loadDB();
    var c = db.chats.find(function (x) { return x.id === chatId; });
    if (c) { c.unread = 0; saveDB(db); }
    return Promise.resolve();
  },
  searchUsers: function (q) {
    if (mode === "live") return tryFetch("/api/users/search?q=" + encodeURIComponent(q)).then(function (d) { return d.users; });
    var s = String(q || "").trim().toLowerCase();
    if (!s || s.length < 2) return Promise.resolve([]);
    return Promise.resolve(loadDB().users.filter(function (u) {
      return (!demoUser || u.id !== demoUser.id) && (u.username.toLowerCase().indexOf(s) !== -1 || u.name.indexOf(String(q).trim()) !== -1);
    }).map(function (u) { return { id: u.id, username: u.username, name: u.name, avatar: u.avatar, verified: !!u.verified }; }));
  },
  openDirect: function (me, username) {
    var target = String(username).replace(/^@/, "").toLowerCase();
    if (mode === "live") return tryFetch("/api/chats", { method: "POST", body: JSON.stringify({ kind: "direct", username: target }) }).then(function (d) { return d.chat; });
    var db = loadDB();
    var u = db.users.find(function (x) { return x.username.toLowerCase() === target; });
    if (!u) throw new Error("کاربری با این نام پیدا نشد");
    var c = db.chats.find(function (x) { return x.userId === me.id && x.peer && x.peer.username === u.username; });
    if (!c) {
      c = { id: "c-" + u.id + "-" + me.id, kind: "direct", title: u.name, avatar: u.avatar, peer: { id: u.id, username: u.username, name: u.name, avatar: u.avatar }, userId: me.id, unread: 0, online: false };
      db.chats.push(c); saveDB(db);
    }
    return Promise.resolve(c);
  },
  createGroup: function (me, title, kind) {
    if (mode === "live") return tryFetch("/api/chats", { method: "POST", body: JSON.stringify({ kind: kind, title: title }) }).then(function (d) { return d.chat; });
    var db = loadDB();
    var c = { id: "c-g" + (++db.seq), kind: kind, title: title, avatar: kind === "channel" ? "teal" : "green", userId: me.id, unread: 0 };
    db.chats.push(c);
    db.messages.push({ id: "m" + (++db.seq), chatId: c.id, senderId: "system", text: kind === "channel" ? "کانال «" + title + "» ساخته شد" : "گروه «" + title + "» ساخته شد", createdAt: Date.now() });
    saveDB(db);
    return Promise.resolve(c);
  }
};

function bindOverlay() {
  var flip = function (side) { S.side = side; S.err = ""; render(); };
  $("#sideLogin").addEventListener("click", function () { flip("login"); });
  $("#sideSignup").addEventListener("click", function () { flip("signup"); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-goto]"), function (b) {
    b.addEventListener("click", function () { flip(b.getAttribute("data-goto")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-noop]"), function (a) {
    a.addEventListener("click", function (e) { e.preventDefault(); });
  });
  var sw = $("#suSwatches");
  sw.addEventListener("click", function (e) {
    var b = e.target.closest(".av-swatch");
    if (!b) return;
    S.avatar = b.getAttribute("data-av");
    Array.prototype.forEach.call(sw.querySelectorAll(".av-swatch"), function (x) { x.classList.toggle("on", x === b); });
    $("#suAvPrev").className = "avatar lg av-" + S.avatar;
  });
  $("#sn").addEventListener("input", function (e) {
    var ch = (e.target.value.trim() || "T").slice(0, 1);
    $("#suAvPrev").textContent = ch;
    Array.prototype.forEach.call(sw.querySelectorAll(".av-swatch"), function (x) { x.textContent = ch; });
  });
  $("#loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (S.busy) return;
    var u = $("#lu").value.trim(), p = $("#lp").value;
    if (!u || !p) { S.err = "نام کاربری و رمز عبور را وارد کنید"; return render(); }
    S.busy = true; S.err = ""; render();
    Api.login(u, p).then(function (user) { S.busy = false; S.me = user; S.chats = []; return renderAll(true); }, function (ex) {
      S.busy = false; S.err = (ex && ex.message) || "ورود ناموفق بود"; render();
    });
  });
  $("#signupForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (S.busy) return;
    var name = $("#sn").value.trim(), u = $("#su").value.trim(), p = $("#sp").value;
    if (!name) { S.err = "نام نمایشی را وارد کنید"; return render(); }
    if (!/^[a-zA-Z0-9_]{3,}$/.test(u)) { S.err = "نام کاربری باید حداقل ۳ حرف انگلیسی یا عدد باشد"; return render(); }
    if (p.length < 4) { S.err = "رمز عبور باید حداقل ۴ کاراکتر باشد"; return render(); }
    S.busy = true; S.err = ""; render();
    Api.signup({ name: name, username: u, password: p, avatar: S.avatar }).then(function (user) {
      S.busy = false; S.me = user; S.chats = []; return renderAll(true);
    }, function (ex) { S.busy = false; S.err = (ex && ex.message) || "ثبت‌نام ناموفق بود"; render(); });
  });
}

/* ─────────────── شِل پیام‌رسان ─────────────── */
function shellHTML() {
  return '' +
  '<div class="shell" id="shell">' +
    '<aside class="rail">' +
      '<div class="mark"><span>T</span></div>' +
      "<nav>" +
        '<button class="icon active" id="navChats" title="گفتگوها">' + icon("chat") + "</button>" +
        '<button class="icon" id="navSaved" title="پیام‌های ذخیره‌شده">' + icon("bookmark") + "</button>" +
        '<button class="icon" id="navSettings" title="تنظیمات">' + icon("settings") + "</button>" +
      "</nav>" +
      '<button class="icon" id="navLogout" title="خروج">' + icon("logout") + "</button>" +
      avatarHTML(S.me.name, S.me.avatar, undefined, "me-avatar") +
    "</aside>" +
    '<section class="col">' +
      '<div class="col-head"><div><h2>پیام‌ها</h2><p>پیام‌رسان T</p></div>' +
        '<div class="col-tools"><button class="iconbtn" title="ویرایش">' + icon("pencil", 18) + "</button></div></div>" +
      '<input class="search" id="searchInput" placeholder="جستجو…" value="' + esc(S.query) + '">' +
      '<div class="list" id="chatList"></div>' +
      '<button class="fab-plus" id="fabPlus" title="گفتگوی جدید">' + icon("plus", 24) + "</button>" +
    "</section>" +
    '<main class="stage" id="stage"></main>' +
    '<div id="mroot"></div>' +
  "</div>";
}

function rowHTML(c, activeId) {
  var kindHint = c.kind === "channel" ? "کانال" : c.kind === "group" ? "گروه" : c.kind === "saved" ? "یادداشت‌های شخصی" : "شروع گفتگو…";
  return '<button class="row' + (activeId === c.id ? " active" : "") + '" data-chat="' + esc(c.id) + '">' +
    avatarHTML(c.title, c.avatar, (c.kind === "saved" || c.kind === "group" || c.kind === "channel") ? undefined : c.online) +
    '<div class="meta"><div class="name">' + esc(c.title) + (c.verified ? icon("verified", 14) : "") + "</div>" +
    '<div class="preview">' + esc(c.lastText || kindHint) + "</div></div>" +
    '<div class="side">' + (c.lastAt ? '<span class="when">' + timeFmt.format(c.lastAt) + "</span>" : "") +
    (c.unread ? '<span class="unread">' + faNum(c.unread) + "</span>" : "") + "</div></button>";
}

function renderList() {
  var el = $("#chatList");
  if (!el) return;
  var q = S.query.trim();
  var list = S.chats.filter(function (c) { return !q || c.title.indexOf(q) !== -1 || (c.lastText || "").indexOf(q) !== -1; });
  el.innerHTML = list.map(function (c) { return rowHTML(c, S.active && S.active.id); }).join("") ||
    '<div class="list-empty">چیزی پیدا نشد.</div>';
}

function stageHTML() {
  if (!S.active) {
    return '<div class="stage-empty"><div><p class="giant">T</p><h3>پیام‌رسان T</h3><p>یک گفتگو را انتخاب کنید تا پیام‌ها اینجا نمایش داده شود.</p></div></div>';
  }
  var c = S.active;
  var sub = c.kind === "saved" ? "فقط برای خودتان" : c.kind === "group" ? "گروه" : c.kind === "channel" ? "کانال" : c.online ? "آنلاین" : "آخرین بازدید اخیراً";
  return '' +
    '<div class="topbar">' +
      '<button class="backonly" id="btnBack">' + icon("back", 18) + "</button>" +
      '<div class="who">' + avatarHTML(c.title, c.avatar, c.online, "sm") +
        "<div><b>" + esc(c.title) + (c.verified ? icon("verified", 15) : "") + "</b><span>" + sub + "</span></div></div>" +
      '<button class="iconbtn" title="تماس صوتی">' + icon("phone", 18) + "</button>" +
      '<button class="iconbtn" title="جستجو">' + icon("search", 18) + "</button>" +
    "</div>" +
    '<div class="msgs" id="msgs"></div>' +
    '<div id="replySlot"></div>' +
    '<div class="composer" id="composer">' +
      '<div class="box" id="compBox">' +
        '<button class="attach" title="پیوست">' + icon("clip", 19) + "</button>" +
        '<textarea id="compTa" rows="1" placeholder="پیام بنویسید…"></textarea>' +
      "</div>" +
      '<button class="sendbtn" id="btnSend" disabled title="ارسال">' + icon("send", 20) + "</button>" +
    "</div>";
}

function msgHTML(m, prev) {
  if (m.senderId === "system") return '<div class="msg-line system"><div class="bubble system">' + esc(m.text) + "</div></div>";
  var mine = m.senderId === S.me.id || m.senderId === "u-local";
  var day = (!prev || !sameDay(prev.createdAt, m.createdAt)) ? '<div class="day">' + dayFmt.format(m.createdAt) + "</div>" : "";
  var hearts = (m.hearts || 0) > 0
    ? '<span class="hg"' + (m.myHeart ? ' style="color:var(--gold)"' : "") + ">" + icon("heart", 11) + faNum(m.hearts) + "</span>" : "";
  return day + '<div class="msg-line ' + (mine ? "is-mine" : "is-theirs") + (m.id === S.pendingId ? " pending" : "") + '" data-mid="' + esc(m.id) + '">' +
    '<div class="bubble">' +
      '<div class="b-tools">' +
        '<button title="قلب" data-act="heart">' + icon("heart", 13) + "</button>" +
        '<button title="پاسخ" data-act="reply">' + icon("reply", 13) + "</button>" +
        '<button title="بازگردانی" data-act="fwd">' + icon("forward", 13) + "</button>" +
        '<button title="کپی" data-act="copy">' + icon("copy", 13) + "</button>" +
      "</div>" +
      (m.fwdFrom ? '<div class="fwd">بازگردانده شده از ' + esc(m.fwdFrom) + "</div>" : "") +
      (m.replyTo && m.replyText ? '<div class="quote">' + esc(m.replyText) + "</div>" : "") +
      '<div class="txt">' + esc(m.text) + "</div>" +
      '<div class="foot">' + hearts + "<span>" + timeFmt.format(m.createdAt) + "</span>" + (mine ? icon("seen", 14) : "") + "</div>" +
    "</div></div>";
}

function renderMsgs() {
  var el = $("#msgs");
  if (!el) return;
  if (!S.msgs.length) { el.innerHTML = '<div class="stage-empty" style="padding:20px"><p>هنوز پیامی نیست؛ اولین پیام را بفرستید.</p></div>'; return; }
  el.innerHTML = S.msgs.map(function (m, i) { return msgHTML(m, S.msgs[i - 1]); }).join("");
}

function renderReplybar() {
  var el = $("#replySlot");
  if (!el) return;
  if (!S.reply) { el.innerHTML = ""; $("#compBox").style.borderRadius = ""; $("#compBox").style.borderTop = ""; $("#composer").style.paddingTop = ""; return; }
  el.innerHTML = '<div class="replybar">' + icon("reply", 14) + '<div class="q">' + esc(S.reply.text) + "</div>" +
    '<button id="btnUnreply" aria-label="بستن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:15px;height:15px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>';
  el.querySelector("#btnUnreply").addEventListener("click", function () { S.reply = null; renderReplybar(); if ($("#compTa")) $("#compTa").focus(); });
  $("#compBox").style.borderRadius = "0 0 18px 18px";
  $("#compBox").style.borderTop = "0";
  $("#composer").style.paddingTop = "0";
}

function scrollDown() {
  requestAnimationFrame(function () { var el = $("#msgs"); if (el) el.scrollTop = el.scrollHeight; });
}

function renderStage() {
  var el = $("#stage");
  if (!el) return;
  el.innerHTML = stageHTML();
  var back = $("#btnBack");
  if (back) back.addEventListener("click", function () { S.active = null; syncShellClass(); renderStage(); });
  if (S.active) {
    renderMsgs(); renderReplybar(); scrollDown();
    var ta = $("#compTa"), sendBtn = $("#btnSend");
    var grow = function () { ta.style.height = "auto"; ta.style.height = Math.min(140, ta.scrollHeight) + "px"; sendBtn.disabled = !ta.value.trim(); };
    ta.addEventListener("input", grow);
    ta.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendNow(); } });
    sendBtn.addEventListener("click", sendNow);
  }
}

function syncShellClass() {
  var sh = $("#shell");
  if (sh) sh.classList.toggle("chat-open", !!S.active);
  renderList();
}

function openChat(c) {
  S.active = c; S.reply = null; S.msgs = []; S.panel = null;
  syncShellClass(); renderStage(); renderModal();
  Api.messages(S.me, c.id).then(function (m) { if (S.active && S.active.id === c.id) { S.msgs = m; renderMsgs(); scrollDown(); } });
  Api.markRead(S.me, c.id);
  c.unread = 0; renderList();
}

function refreshChats() {
  return Api.listChats(S.me).then(function (cs) { S.chats = cs; renderList(); });
}

function sendNow() {
  var ta = $("#compTa");
  if (!ta || !S.active) return;
  var t = ta.value.trim();
  if (!t) return;
  var r = S.reply;
  ta.value = ""; ta.style.height = "auto"; $("#btnSend").disabled = true;
  S.reply = null; renderReplybar();
  var temp = { id: "tmp-" + Date.now(), chatId: S.active.id, senderId: S.me.id, text: t, replyTo: r ? r.id : null, replyText: r ? String(r.text || "").slice(0, 90) : null, createdAt: Date.now(), hearts: 0 };
  S.msgs.push(temp); S.pendingId = temp.id; renderMsgs(); scrollDown();
  Api.send(S.me, S.active.id, t, r, null).then(function (saved) {
    S.msgs = S.msgs.map(function (x) { return x.id === temp.id ? Object.assign({}, saved, { replyText: temp.replyText, replyTo: temp.replyTo }) : x; });
    S.pendingId = null; renderMsgs(); scrollDown(); refreshChats(); ta.focus();
  });
}

function heartMsg(m) {
  if (String(m.id).indexOf("tmp-") === 0) return;
  var mapped = S.msgs.map(function (x) { return x.id === m.id ? Object.assign({}, x, { myHeart: !x.myHeart, hearts: Math.max(0, (x.hearts || 0) + (x.myHeart ? -1 : 1)) }) : x; });
  S.msgs = mapped; renderMsgs(); scrollDown();
  Api.react(m.id);
}

/* ─────────────── مودال‌ها ─────────────── */
function modalHTML() {
  if (!S.panel) return "";
  var inner = "";
  if (S.panel === "compose") {
    inner = "<h3>شروع کنید</h3><p class=\"sub\">یک راه برای گفتگو انتخاب کنید</p>" +
      '<button class="compose-opt" data-mpanel="direct"><b>' + icon("chat", 18) + " گفتگوی جدید</b><small>شروع چت خصوصی با یک نفر</small></button>" +
      '<button class="compose-opt" data-mpanel="group"><b>' + icon("users", 18) + " گروه جدید</b><small>گفتگوی دسته‌جمعی با دوستان</small></button>" +
      '<button class="compose-opt" data-mpanel="channel"><b>' + icon("mega", 18) + " کانال جدید</b><small>پخش پیام برای مخاطبان</small></button>";
  } else if (S.panel === "direct") {
    var rows = S.found.map(function (u) {
      return '<button class="row" data-user="' + esc(u.username) + '">' + avatarHTML(u.name, u.avatar, undefined) +
        '<div class="meta"><div class="name">' + esc(u.name) + (u.verified ? icon("verified", 14) : "") + '</div><div class="preview" dir="ltr" style="text-align:right">@' + esc(u.username) + "</div></div><span></span></button>";
    }).join("");
    inner = "<h3>گفتگوی جدید</h3><p class=\"sub\">نام کاربری یا نام شخص را جستجو کنید</p>" +
      '<div class="field"><input id="directQ" dir="ltr" placeholder="@username" value="' + esc(S.directQ) + '"></div>' +
      rows + (!rows && S.directQ.trim().length >= 2 && !S.directErr ? '<div class="list-empty">کاربری پیدا نشد.</div>' : "") +
      (S.directErr ? '<p class="err">' + esc(S.directErr) + "</p>" : "");
  } else if (S.panel === "group" || S.panel === "channel") {
    var kind = S.panel === "group" ? "گروه" : "کانال";
    inner = "<h3>" + kind + " جدید</h3><p class=\"sub\">یک نام برای " + kind + " انتخاب کنید</p>" +
      '<div class="field"><input id="groupTitle" placeholder="نام ' + kind + '…" value="' + esc(S.groupTitle) + '"></div>' +
      '<button class="btn-gold" id="btnCreateG" ' + (S.groupTitle.trim() ? "" : "disabled") + ">ساخت</button>";
  } else if (S.panel === "forward" && S.fwd) {
    inner = "<h3>بازگردانی به…</h3><p class=\"sub\">«" + esc(String(S.fwd.text).slice(0, 60)) + "»</p>" +
      S.chats.map(function (c) { return '<button class="row" data-fwdto="' + esc(c.id) + '">' + rowHTML_inner(c) + "</button>"; }).join("");
  } else if (S.panel === "settings") {
    inner = "<h3>تنظیمات</h3><p class=\"sub\">حساب T شما</p>" +
      '<div class="avatar-picker">' + avatarHTML(S.me.name, S.me.avatar, undefined, "lg") +
        "<div><div style=\"text-align:center;font-weight:700\">" + esc(S.me.name) + "</div>" +
        '<div style="text-align:center;color:var(--mute);font-size:12px" dir="ltr">@' + esc(S.me.username) + "</div></div></div>" +
      '<button class="btn-ghost" id="btnLogout2">' + icon("logout", 14) + "خروج از حساب</button>" +
      '<p class="hintline">T — playneofly.ir</p>';
  }
  return '<div class="modal-veil" id="mveil"><div class="modal">' + inner + "</div></div>";
}

function rowHTML_inner(c) {
  return avatarHTML(c.title, c.avatar, (c.kind === "saved" || c.kind === "group" || c.kind === "channel") ? undefined : c.online) +
    '<div class="meta"><div class="name">' + esc(c.title) + "</div></div><span></span>";
}

function renderModal() {
  var el = $("#mroot");
  if (!el) return;
  el.innerHTML = modalHTML();
  var veil = $("#mveil");
  if (!veil) return;
  veil.addEventListener("click", function (e) { if (e.target === veil) { S.panel = null; S.fwd = null; S.directErr = ""; renderModal(); } });
  Array.prototype.forEach.call(el.querySelectorAll("[data-mpanel]"), function (b) {
    b.addEventListener("click", function () { S.panel = b.getAttribute("data-mpanel"); renderModal(); var dq = $("#directQ"); if (dq) dq.focus(); var gt = $("#groupTitle"); if (gt) gt.focus(); });
  });
  var dq = $("#directQ");
  if (dq) dq.addEventListener("input", function () {
    S.directQ = dq.value; S.directErr = "";
    if (S.directQ.trim().length < 2) { S.found = []; renderModal(); if ($("#directQ")) $("#directQ").focus(); return; }
    Api.searchUsers(S.directQ).then(function (us) { if (S.panel === "direct") { S.found = us; renderModal(); var d = $("#directQ"); if (d) { d.focus(); d.setSelectionRange(d.value.length, d.value.length); } } });
  });
  Array.prototype.forEach.call(el.querySelectorAll("[data-user]"), function (b) {
    b.addEventListener("click", function () {
      Api.openDirect(S.me, b.getAttribute("data-user")).then(function (c) {
        refreshChats().then(function () {
          var full = S.chats.find(function (x) { return x.id === c.id; }) || c;
          openChat(full);
        });
      }, function (ex) { S.directErr = (ex && ex.message) || "خطا"; renderModal(); });
    });
  });
  var gt = $("#groupTitle");
  if (gt) gt.addEventListener("input", function () { S.groupTitle = gt.value; $("#btnCreateG").disabled = !S.groupTitle.trim(); });
  var cg = $("#btnCreateG");
  if (cg) cg.addEventListener("click", function () {
    Api.createGroup(S.me, S.groupTitle.trim(), S.panel).then(function (c) {
      S.groupTitle = "";
      refreshChats().then(function () { openChat(S.chats.find(function (x) { return x.id === c.id; }) || c); });
    });
  });
  Array.prototype.forEach.call(el.querySelectorAll("[data-fwdto]"), function (b) {
    b.addEventListener("click", function () {
      var id = b.getAttribute("data-fwdto");
      var target = S.chats.find(function (x) { return x.id === id; });
      if (!target || !S.fwd) return;
      var fwdText = S.fwd.text, fwdFrom = S.active ? S.active.title : null;
      Api.send(S.me, target.id, fwdText, null, fwdFrom).then(function () {
        S.fwd = null; S.panel = null; renderModal(); refreshChats();
        if (S.active && S.active.id === target.id) Api.messages(S.me, target.id).then(function (m) { S.msgs = m; renderMsgs(); scrollDown(); });
      });
    });
  });
}

/* ─────────────── بایند شِل ─────────────── */
function bindShell() {
  $("#chatList").addEventListener("click", function (e) {
    var row = e.target.closest("[data-chat]");
    if (!row) return;
    var c = S.chats.find(function (x) { return x.id === row.getAttribute("data-chat"); });
    if (c) openChat(c);
  });
  $("#searchInput").addEventListener("input", function (e) { S.query = e.target.value; renderList(); });
  $("#fabPlus").addEventListener("click", function () { S.panel = "compose"; renderModal(); });
  $("#navChats").addEventListener("click", function () { S.active = null; syncShellClass(); renderStage(); });
  $("#navSaved").addEventListener("click", function () {
    var c = S.chats.find(function (x) { return x.kind === "saved"; }); if (c) openChat(c);
  });
  $("#navSettings").addEventListener("click", function () { S.panel = "settings"; renderModal(); });
  $("#navLogout").addEventListener("click", function () {
    Api.logout().then(function () { S.me = null; S.active = null; S.msgs = []; S.chats = []; render(); });
  });
  document.addEventListener("click", function (e) {
    var lo2 = e.target.closest("#btnLogout2");
    if (lo2) Api.logout().then(function () { S.me = null; S.active = null; S.panel = null; render(); });
  });
  var stage = $("#stage");
  stage.addEventListener("click", function (e) {
    var btn = e.target.closest(".b-tools button");
    if (!btn) return;
    var line = btn.closest("[data-mid]");
    var m = line && S.msgs.find(function (x) { return x.id === line.getAttribute("data-mid"); });
    if (!m) return;
    var act = btn.getAttribute("data-act");
    if (act === "heart") heartMsg(m);
    else if (act === "reply") { S.reply = m; renderReplybar(); if ($("#compTa")) $("#compTa").focus(); }
    else if (act === "fwd") { S.fwd = m; S.panel = "forward"; renderModal(); }
    else if (act === "copy") { try { navigator.clipboard.writeText(m.text); } catch (err) {} }
  });
}

/* ─────────────── رندر اصلی ─────────────── */
function render() {
  if (!S.me) { app.innerHTML = overlayHTML(); bindOverlay(); return; }
  app.innerHTML = shellHTML();
  bindShell();
  renderList(); renderStage(); syncShellClass(); renderModal();
}

function renderAll(load) {
  render();
  if (load && S.me) refreshChats();
}

/* ─────────────── شروع ─────────────── */
Api.me().then(function (u) {
  S.me = u;
  render();
  var boot = $("#boot"); if (boot) boot.remove();
  if (u) refreshChats();
});
})();
</script>
</body>
</html>
