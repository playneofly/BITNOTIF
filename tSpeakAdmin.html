<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#10141A" />
<meta name="robots" content="noindex" />
<title>اتاق فرمان — T اسپیک</title>
<link rel="icon" type="image/png" href="/assets/tsp-192.png" />
<style>
  @font-face { font-family: "Vazirmatn"; src: url("/assets/Vazirmatn-T33.woff2") format("woff2"); font-display: swap; }
  :root {
    --bg:#10141A; --bg2:#151A21; --panel:#1A2029; --panel2:#202834;
    --line:#28303D; --line2:#20262F;
    --text:#D9E0EA; --sub:#8C99AB; --dim:#5F6C7F;
    --acc:#4C8DFF; --acc2:#2E6BD8; --green:#43C97B; --red:#E0696E; --gold:#D8A94E;
    --mono: "SF Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif; font-size: 13px;
    display: flex; align-items: flex-start; justify-content: center; padding: 16px;
  }
  [hidden] { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  .shell { width: 100%; max-width: 680px; }
  .mono { font-family: var(--mono); direction: ltr; }

  .adbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 13px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  .adbar .mark {
    width: 38px; height: 38px; border-radius: 8px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(150deg, var(--acc), var(--acc2));
  }
  .adbar .tt { flex: 1; min-width: 0; }
  .adbar .tt b { font-size: 14px; display: block; }
  .adbar .tt span { font-size: 10px; color: var(--dim); font-family: var(--mono); }
  .btn {
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    border-radius: 6px; height: 36px; padding: 0 14px; font-size: 12px; font-weight: 700;
  }
  .btn:hover { background: #263042; }
  .btn.primary { background: var(--acc2); border-color: var(--acc2); color: #fff; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 10px; }
  .phead {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 13px; border-bottom: 1px solid var(--line2);
    font-size: 10.5px; color: var(--dim); font-weight: 700; letter-spacing: .4px;
  }
  .room { border-bottom: 1px solid var(--line2); padding: 11px 13px; }
  .room:last-child { border-bottom: 0; }
  .rline { display: flex; align-items: center; gap: 9px; }
  .rline .ic { font-size: 14px; }
  .rline .nm { font-size: 13px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rline .code {
    font-family: var(--mono); font-size: 11px; color: var(--acc); background: rgba(76,141,255,.1);
    border: 1px solid rgba(76,141,255,.3); padding: 2px 8px; border-radius: 5px; cursor: pointer; direction: ltr;
  }
  .rline .cnt { font-size: 10px; color: var(--sub); font-family: var(--mono); }
  .rline .go {
    border: 0; background: linear-gradient(135deg, #5C9BFF, var(--acc2)); color: #fff;
    border-radius: 6px; padding: 6px 13px; font-size: 11px; font-weight: 800;
  }
  .mchips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .chip {
    display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--sub);
    background: var(--bg2); border: 1px solid var(--line2); border-radius: 999px; padding: 3px 9px;
  }
  .chip .d { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .chip .d.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .chip b { color: var(--text); font-weight: 700; }
  .empty { padding: 26px 14px; text-align: center; color: var(--dim); font-size: 12px; }
  .statusbar {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    background: var(--bg2); border: 1px solid var(--line2); border-radius: 6px;
    padding: 6px 12px; font-size: 10px; color: var(--dim); font-family: var(--mono);
  }
  .statusbar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .statusbar.off .dot { background: var(--red); }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1C2530; border: 1px solid var(--line); color: var(--text);
    font-size: 12px; font-weight: 700; padding: 10px 18px; border-radius: 7px;
    opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 99; max-width: 86%; text-align: center;
  }
  #toast.show { opacity: 1; }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .adbar { padding: 8px 10px; }
    .rline { flex-wrap: wrap; }
    .rline .nm { font-size: 12px; min-width: 50%; }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="adbar">
      <div class="mark"><img src="/assets/tsp-192.png" alt="" style="width:24px;height:24px;border-radius:6px" /></div>
      <div class="tt"><b>اتاق فرمان — T اسپیک</b><span id="stMeta">playneofly.ir · admin</span></div>
      <button class="btn" id="btnBack">🎧 T اسپیک</button>
      <button class="btn" id="btnRefresh">↻ تازه‌سازی</button>
    </div>

    <div class="panel" id="roomsPanel">
      <div class="phead"><span>روم‌های فعال</span><span class="mono" id="stRooms">--</span></div>
      <div id="rooms"><div class="empty">در حال بارگذاری…</div></div>
    </div>

    <div class="panel">
      <div class="phead"><span>حساب‌های آنلاین در T اسپیک</span><span class="mono" id="stOnline">--</span></div>
      <div id="online"><div class="empty">…</div></div>
    </div>

    <div class="statusbar" id="stBar"><span class="dot"></span><span id="stTxt">در حال اتصال…</span><span style="margin-inline-start:auto" class="mono" id="stPing">--</span></div>
  </div>
  <div id="toast"></div>

  <script>
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    function toast(t) {
      var x = $("toast"); x.textContent = t; x.classList.add("show");
      clearTimeout(x._tm); x._tm = setTimeout(function () { x.classList.remove("show"); }, 2200);
    }
    function api(path) {
      return fetch("/api" + path, { credentials: "include" })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); });
    }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    var timer = 0;
    function load() {
      var t0 = Date.now();
      api("/admin/speak").then(function (r) {
        if (r.status === 401) { $("stTxt").textContent = "ابتدا وارد حساب مدیر شو"; $("stBar").classList.add("off"); return; }
        if (!r.ok) { $("stTxt").textContent = (r.d && r.d.error) || "این پنل برای تو نیست"; $("stBar").classList.add("off"); return; }
        $("stPing").textContent = (Date.now() - t0) + "ms";
        $("stTxt").textContent = "متصل"; $("stBar").classList.remove("off");
        var chans = r.d.channels || [];
        var online = r.d.online || [];
        $("stRooms").textContent = chans.length + " روم";
        $("stOnline").textContent = online.length + " آنلاین";
        if (!chans.length) {
          $("rooms").innerHTML = '<div class="empty">هیچ رومی فعال نیست — روم‌ها بعد از ۶۰ ثانیه خالی‌بودن بسته می‌شوند</div>';
        } else {
          var h = "";
          chans.forEach(function (ch) {
            var ic = ch.locked ? "🔒" : (ch.isPublic ? "🎧" : "🔐");
            h += '<div class="room"><div class="rline">' +
              '<span class="ic">' + ic + '</span>' +
              '<span class="nm">' + esc(ch.name) + '</span>' +
              '<span class="code" data-code="' + ch.id + '" title="کپی کد">#' + ch.id + '</span>' +
              '<span class="cnt">' + ch.count + '/6</span>' +
              '<button class="go" data-join="' + ch.id + '">ورود به روم</button>' +
              '</div>';
            var ms = ch.members || [];
            if (ms.length) {
              h += '<div class="mchips">' + ms.map(function (m) {
                return '<span class="chip"><span class="d' + (m.speaking ? " on" : "") + '"></span><b>' + esc(m.displayName || m.username) + "</b>@" + esc(m.username) + (m.mic ? "" : " 🔇") + "</span>";
              }).join("") + "</div>";
            }
            h += "</div>";
          });
          $("rooms").innerHTML = h;
        }
        if (!online.length) {
          $("online").innerHTML = '<div class="empty">کسی آنلاین نیست</div>';
        } else {
          $("online").innerHTML = '<div style="padding:10px 13px" class="mchips">' + online.map(function (m) {
            return '<span class="chip"><span class="d' + (m.speaking ? " on" : "") + '"></span><b>' + esc(m.displayName || m.username) + "</b>@" + esc(m.username) + '<span style="color:var(--dim)">· ' + esc(m.channelName || "؟") + "</span></span>";
          }).join("") + "</div>";
        }
      }).catch(function () { $("stTxt").textContent = "ارتباط قطع — تلاش مجدد"; $("stBar").classList.add("off"); });
    }
    $("btnRefresh").addEventListener("click", load);
    $("btnBack").addEventListener("click", function () { location.href = "/tSpeak"; });
    document.addEventListener("click", function (e) {
      var j = e.target.getAttribute && e.target.getAttribute("data-join");
      if (j) { location.href = "/tSpeak#join=" + j; return; }
      var c = e.target.getAttribute && e.target.getAttribute("data-code");
      if (c && navigator.clipboard) { navigator.clipboard.writeText(c).then(function () { toast("کد کپی شد: " + c); }); }
    });
    load();
    timer = setInterval(load, 5000);
  })();
  </script>
</body>
</html>
